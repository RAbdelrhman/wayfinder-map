<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Open in Wayfinder</title>
    <link rel="stylesheet" href="/landing.css" />
    <script src="/landing.js" defer></script>
  </head>
  <body>
    <main>
      <section class="lp-card" aria-labelledby="destination-title">
        <img class="lp-mark" src="/wayfinder-icon.svg" alt="" width="40" height="40" />
        <p class="lp-kind" id="destination-kind">Link not recognized</p>
        <h1 id="destination-title">This link can’t be opened</h1>
        <p class="lp-sub" id="destination-context">It may have been cut off. Ask for the link again.</p>
        <a class="lp-open" id="open-wayfinder" hidden>Open in Wayfinder</a>
        <p class="lp-fallback" id="destination-fallback" hidden>Nothing opened? <a class="lp-link" href="https://github.com/RAbdelrhman/wayfinder-map/releases" rel="noreferrer">Install or update Wayfinder</a>, then try again.</p>
      </section>
    </main>
  </body>
</html>
