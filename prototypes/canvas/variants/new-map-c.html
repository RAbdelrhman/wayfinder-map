<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C · Goal first</title>
    <link rel="stylesheet" href="../../../src/ui/styles.css" />
    <link rel="stylesheet" href="new-map.css" />
    <style>
      .c-stage { max-width: 720px; margin: 0 auto; padding: 72px 24px 64px; }
      .c-stage h1 { font-size: 19px; font-weight: 650; text-align: center; margin: 0 0 16px; letter-spacing: -0.01em; }
      .c-composer { padding: 4px; box-shadow: var(--shadow); }
      .c-composer:focus-within { border-color: color-mix(in srgb, var(--state-claimed) 55%, var(--hairline)); }
      .c-composer textarea { width: 100%; min-height: 104px; border: 0; outline: 0; resize: none; background: none; color: var(--text-primary); font: inherit; font-size: 15px; line-height: 1.5; padding: 12px 14px 4px; }
      .c-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px; flex-wrap: wrap; }
      .c-bar .grow { flex: 1; }
      .c-chip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--plane); color: var(--text-secondary); cursor: pointer; }
      .c-chip:hover, .c-chip[aria-expanded='true'] { background: var(--wash); color: var(--text-primary); }
      .c-chip[hidden] { display: none; }
      .c-chip.is-quiet { border-color: transparent; background: none; }
      .c-chip.is-quiet:hover, .c-chip.is-quiet[aria-expanded='true'] { background: var(--wash); }
      .c-chip.is-empty { border-style: dashed; color: var(--text-primary); }
      .c-chip.is-ok .i { color: var(--state-frontier); }
      .c-chip.is-warn { border-color: color-mix(in srgb, var(--state-blocked) 50%, var(--hairline)); background: color-mix(in srgb, var(--state-blocked) 12%, transparent); }
      .c-chip.is-warn .i { color: var(--state-blocked); }
      .c-send { border-radius: 9px; }
      .c-fix { margin-top: 8px; }
      .c-fix:empty { display: none; }
      .c-intent { display: flex; align-items: center; gap: 8px; margin: 10px 4px 0; font-size: 12px; color: var(--text-muted); min-height: 20px; }
      .c-intent .i { color: var(--state-claimed); }
      .c-examples { margin-top: 28px; }
      .c-examples h2 { font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 0 0 6px 8px; text-transform: uppercase; letter-spacing: 0.04em; }
      .c-ex { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 8px; font: inherit; font-size: 13px; color: var(--text-secondary); background: none; border: 0; text-align: left; cursor: pointer; }
      .c-ex:hover { background: var(--wash); color: var(--text-primary); }

      /* Chip menus: a panel under the chip, laid out like a menu, never inside the chip. */
      .c-menu { position: absolute; z-index: 20; width: 300px; padding: 4px; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 12px; box-shadow: var(--shadow); font-size: 13px; }
      .c-menu-head { padding: 6px 8px 4px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .c-opt { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; column-gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; background: none; color: var(--text-primary); font: inherit; text-align: left; cursor: pointer; }
      .c-opt:hover, .c-opt:focus-visible { background: var(--wash); outline: 0; }
      .c-opt > .i { color: var(--state-claimed); }
      .c-opt small { grid-column: 2; color: var(--text-muted); font-size: 12px; }
      .c-opt .c-model { grid-row: 1; grid-column: 3; color: var(--text-muted); font-size: 11px; }
      .c-menu-foot { margin-top: 4px; padding: 6px 8px 4px; border-top: 1px solid var(--hairline); font-size: 12px; }
      .c-menu .input { width: 100%; margin-bottom: 4px; }
      .c-menu ul { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; }
      .c-menu li .c-opt { grid-template-columns: 18px 1fr auto; }

    </style>
  </head>
  <body class="viz-root">
    <div class="app">
      <nav class="rail" aria-label="App">
        <a class="logo" href="#" data-to="Home" data-icon="compass" aria-label="Wayfinder Home"></a>
        <a class="rail-btn" href="#" data-to="Home" data-icon="home" aria-label="Home"></a>
        <a class="rail-btn is-on" href="#" data-icon="plus" aria-label="Start a new map"></a>
        <span class="rail-spacer"></span>
        <button type="button" class="rail-btn" data-to="the theme switch" data-icon="moon" aria-label="Theme"></button>
        <span class="rail-mark">R</span>
      </nav>
      <div class="main">
        <header class="topbar">
          <span class="crumbs" id="crumbs"></span>
          <span class="topbar-spacer"></span>
        </header>
        <main class="page">
          <div class="c-stage" id="stage">
            <h1>What do you want to get done?</h1>
            <div class="nm-box c-composer">
              <textarea id="goal" aria-label="Goal" placeholder="Describe a goal. T3 Code interviews you about it, then drafts the map."></textarea>
              <div class="c-bar">
                <button type="button" class="c-chip" id="repo-chip" aria-haspopup="listbox" aria-expanded="false"></button>
                <button type="button" class="c-chip" id="clone-chip" hidden></button>
                <button type="button" class="c-chip is-quiet" id="model-chip" aria-haspopup="listbox" aria-expanded="false" title="Run as"></button>
                <span class="grow"></span>
                <button type="button" class="ghost" id="copy" title="Copy prompt" aria-label="Copy prompt"><span data-icon="copy"></span></button>
                <button type="button" class="primary c-send" id="go">Start map<span data-icon="arrow"></span></button>
              </div>
            </div>
            <!-- Opens by itself when the clone needs a decision; empty once it is settled. -->
            <div class="c-fix" id="fix"></div>
            <div class="c-intent" id="intent" role="status"></div>

            <div class="c-examples">
              <h2>Try a goal</h2>
              <button type="button" class="c-ex" data-ex="Offline draft mode: drafts save locally and sync in the background when the network is back."></button>
              <button type="button" class="c-ex" data-ex="Let people share a read-only link to a map."></button>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="../kit/kit.js"></script>
    <script src="wayfinder.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const F = FIXTURES;
      // From the rail's + nothing is picked. From a repository page (?repo=owner/name) that repo is.
      // SNAPSHOT_SEARCH is only set in the single-file snapshot.
      const from = new URLSearchParams(window.SNAPSHOT_SEARCH ?? location.search).get('repo');
      const s = { repo: NM.known(from) ? from : null, clone: null, cloneInfo: null, fixing: false, model: 'mid' };
      const tier = () => F.models.find((m) => m.id === s.model);

      $('crumbs').innerHTML = s.repo
        ? `<a href="#" data-to="Home">Home</a><span class="crumb-sep">/</span><a href="#" data-to="${NM.esc(s.repo)}">${NM.esc(NM.short(s.repo))}</a><span class="crumb-sep">/</span><span>New map</span>`
        : '<a href="#" data-to="Home">Home</a><span class="crumb-sep">/</span><span>New map</span>';

      for (const b of document.querySelectorAll('[data-ex]')) {
        b.innerHTML = `${NM.icon('graph')}<span>${NM.esc(b.dataset.ex)}</span>`;
        b.onclick = () => (($('goal').value = b.dataset.ex), sync(), $('goal').focus());
      }

      /* ---------- clone ---------- */

      function loadClone() {
        s.clone = null;
        s.cloneInfo = 'checking';
        s.fixing = false;
        $('fix').innerHTML = '';
        paint();
        const repo = s.repo;
        NM.workspace(repo).then((info) => {
          if (repo !== s.repo) return;
          s.cloneInfo = info;
          if (info.status === 'ready') s.clone = info.path;
          else openFix();
          paint();
        });
      }

      // The shared clone line, under the composer. Collapses back into the green chip once settled.
      // manual: opened from the green chip. Its re-check can answer "ready" again, so only a
      // clone the user settles closes it.
      function openFix(manual = false) {
        s.picked = !manual;
        s.fixing = true;
        $('fix').innerHTML = '<div id="clone-line"></div>';
        NM.cloneLine($('clone-line'), s.repo, (path) => {
          s.clone = path;
          if (path && s.picked) {
            s.cloneInfo = { status: 'ready', path };
            s.fixing = false;
            setTimeout(() => !s.fixing && ($('fix').innerHTML = ''), 700);
          }
          paint();
        });
      }

      // Capture, so it runs before the clone line settles on the same click.
      $('fix').addEventListener('click', (e) => ['use', 'browse', 'clone-here'].includes(e.target.closest('[data-act]')?.dataset.act) && (s.picked = true), true);

      /* ---------- chip menus ---------- */

      let menu = null;
      function closeMenu() {
        if (!menu) return;
        menu.chip.setAttribute('aria-expanded', 'false');
        menu.el.remove();
        menu = null;
      }
      function openMenu(chip, html, onOpen) {
        const again = menu?.chip === chip;
        closeMenu();
        if (again) return;
        const el = document.createElement('div');
        el.className = 'c-menu';
        el.innerHTML = html;
        document.body.append(el);
        const r = chip.getBoundingClientRect();
        const left = Math.min(r.left, document.documentElement.clientWidth - el.offsetWidth - 12);
        el.style.left = `${left + scrollX}px`;
        el.style.top = `${r.bottom + 6 + scrollY}px`;
        chip.setAttribute('aria-expanded', 'true');
        menu = { chip, el };
        Kit.fillIcons(el);
        onOpen(el);
      }
      document.addEventListener('mousedown', (e) => menu && !menu.el.contains(e.target) && !menu.chip.contains(e.target) && closeMenu());
      document.addEventListener('keydown', (e) => e.key === 'Escape' && menu && (menu.chip.focus(), closeMenu()));
      addEventListener('resize', closeMenu);

      $('model-chip').onclick = () =>
        openMenu(
          $('model-chip'),
          `<div class="c-menu-head">Run as</div>${F.models
            .map(
              (m) => `<button type="button" class="c-opt" role="option" aria-selected="${m.id === s.model}" data-m="${m.id}">
                ${m.id === s.model ? NM.icon('check') : '<span></span>'}<span>${m.label}</span><span class="c-model">${NM.esc(m.model)}</span><small>${NM.esc(m.detail)}</small></button>`,
            )
            .join('')}
            <div class="c-menu-foot"><a href="#" class="linkish" data-to="Settings, tier defaults">Change the model for each tier</a></div>`,
          (el) => {
            el.querySelector(`[data-m="${s.model}"]`).focus();
            el.onclick = (e) => {
              const m = e.target.closest('[data-m]')?.dataset.m;
              if (m) (s.model = m), closeMenu(), paint();
            };
          },
        );

      $('repo-chip').onclick = () =>
        openMenu(
          $('repo-chip'),
          '<input class="input" id="repo-in" placeholder="Search or type owner/name" autocomplete="off" aria-label="Repository" /><ul role="listbox" id="repo-list"></ul>',
          (el) => {
            const all = [...new Set([...F.recents, ...Object.keys(F.repositories)])];
            const list = () => {
              const q = $('repo-in').value.trim().toLowerCase();
              $('repo-list').innerHTML = all
                .filter((r) => r.toLowerCase().includes(q))
                .map(
                  (r) => `<li><button type="button" class="c-opt" role="option" data-repo="${NM.esc(r)}">${NM.repoMark(r)}<span>${NM.esc(r)}</span>${
                    r === s.repo ? NM.icon('check') : F.recents.includes(r) ? '<span class="c-model">recent</span>' : '<span></span>'
                  }</button></li>`,
                )
                .join('');
              Kit.fillIcons(el);
            };
            $('repo-in').oninput = list;
            $('repo-in').onkeydown = (e) => e.key === 'Enter' && el.querySelector('[data-repo]')?.click();
            el.onclick = (e) => {
              const r = e.target.closest('[data-repo]')?.dataset.repo;
              if (!r) return;
              closeMenu();
              if (r !== s.repo) (s.repo = r), loadClone();
            };
            list();
            $('repo-in').focus();
          },
        );

      $('clone-chip').onclick = () => {
        if (s.fixing) return;
        openFix(true);
        paint();
      };

      /* ---------- paint ---------- */

      function paint() {
        const repo = $('repo-chip');
        repo.className = `c-chip${s.repo ? '' : ' is-empty'}`;
        repo.innerHTML = s.repo ? `${NM.repoMark(s.repo)}${NM.esc(s.repo)}${NM.icon('chevron')}` : `${NM.icon('repo')}Choose a repository${NM.icon('chevron')}`;

        const c = $('clone-chip');
        c.hidden = !s.repo;
        c.className = `c-chip ${s.clone ? 'is-ok' : s.cloneInfo === 'checking' ? '' : 'is-warn'}`;
        c.title = s.clone ? `Runs in ${s.clone}` : '';
        c.innerHTML = s.clone
          ? `${NM.icon('check')}Local clone`
          : s.cloneInfo === 'checking'
            ? '<span class="nm-spin"></span>Finding clone…'
            : `${NM.icon('alert')}${s.cloneInfo?.status === 'choose' ? 'Pick a clone' : 'No local clone'}`;

        $('model-chip').innerHTML = `${NM.icon('sliders')}${tier().label}${NM.icon('chevron')}`;
        sync();
      }

      // One line under the composer: why Start is disabled, or what it will do.
      function sync() {
        const text = $('goal').value.trim();
        const why = !s.repo ? 'Pick a repository to start.' : !s.clone ? (s.cloneInfo === 'checking' ? 'Looking for a local clone…' : 'Settle where T3 Code works, just above.') : !text ? '' : null;
        $('intent').innerHTML =
          why === null ? `${NM.icon('graph')}Starts a new map: T3 Code interviews you about this goal, then drafts the issues.` : why ? `<span class="nm-why">${why}</span>` : '';
        $('go').disabled = why !== null;
        $('go').title = why ?? '';
        $('copy').disabled = !text || !s.repo;
      }

      $('goal').oninput = sync;
      $('goal').onkeydown = (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !$('go').disabled) $('go').click();
      };
      $('copy').onclick = () => Kit.toast('Copied the prompt. Paste it into any T3 Code thread.');
      // Start goes straight to the new map's page, which shows the hand-off while it is planned.
      $('go').onclick = () => {
        closeMenu();
        NM.planning(document.querySelector('.main'), { repo: s.repo, clone: s.clone, goal: $('goal').value.trim(), tier: `${tier().label} · ${tier().model}` });
      };

      paint();
      if (s.repo) loadClone();
      Kit.fillIcons();
      $('goal').focus();
    </script>
  </body>
</html>
