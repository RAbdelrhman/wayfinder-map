<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example page</title>
    <style>
      :root {
        --bg: #f7f5f0;
        --fg: #1b1b1a;
        --muted: #6b6860;
        --line: #e2ded5;
        --accent: #2f6f5e;
        --radius: 10px;
      }
      :root[data-theme='dark'] {
        --bg: #171614;
        --fg: #f1efe9;
        --muted: #a29e94;
        --line: #33312d;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, sans-serif;
      }
      header,
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--line);
      }
      header .spacer {
        flex: 1;
      }
      h1 {
        margin: 48px 0 8px;
        font-size: 44px;
        line-height: 1.1;
      }
      p {
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 32px;
      }
      .card {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      button {
        padding: 10px 16px;
        border: 0;
        border-radius: var(--radius);
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .i {
        vertical-align: -0.15em;
      }
    </style>
  </head>
  <body>
    <header>
      <span data-icon="spark"></span><b>Product</b><span class="spacer"></span>
      <button data-to="Sign up">Get started</button>
    </header>
    <main>
      <h1>A headline that says what this is</h1>
      <p>One sentence of support copy. Links marked data-to explain where they'd go instead of navigating.</p>
      <div class="grid" id="cards"></div>
    </main>
    <script src="../kit/kit.js"></script>
    <script>
      Kit.icons.spark = '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>';
      const FEATURES = ['Fast', 'Friendly', 'Flexible'];
      document.getElementById('cards').innerHTML = FEATURES.map(
        (name) => `<div class="card"><b>${Kit.esc(name)}</b><p>A short line about it.</p></div>`,
      ).join('');
    </script>
  </body>
</html>
