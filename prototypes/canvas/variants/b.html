<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B · Pick up where you left off</title>
    <link rel="stylesheet" href="../../../src/ui/styles.css" />
    <style>
      .sheet {
        width: min(1080px, 100%);
      }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
        gap: 18px;
      }
      .continue {
        display: block;
        padding: 20px 22px;
        text-decoration: none;
        color: inherit;
      }
      .continue h2 {
        margin: 6px 0 12px;
        font-size: 19px;
        letter-spacing: -0.01em;
      }
      .progress {
        height: 6px;
        border-radius: 3px;
        background: var(--gridline);
        overflow: hidden;
      }
      .progress > i {
        display: block;
        height: 100%;
        background: var(--state-frontier);
      }
      .muted {
        margin: 6px 0 0;
        color: var(--text-muted);
        font-size: 12.5px;
      }
      .list {
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--hairline);
      }
      .list li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid var(--hairline);
        font-size: 13px;
      }
      .list .grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mono {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: var(--wash);
        font-size: 11px;
        font-weight: 700;
      }
      .inflight {
        padding: 18px 20px;
      }
      .inflight h2 {
        margin: 0;
        font-size: 14px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .dot.needs-input {
        background: var(--state-blocked);
      }
      .dot.working {
        background: var(--state-claimed);
      }
      .dot.done {
        background: var(--state-done);
      }
      .state {
        color: var(--text-secondary);
        font-size: 12px;
        white-space: nowrap;
      }
      .compact {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .compact a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid var(--hairline);
        border-radius: 8px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 13px;
      }
      .compact .i {
        width: 14px;
        height: 14px;
      }
    </style>
  </head>
  <body class="viz-root">
    <div class="app">
      <nav class="rail" aria-label="App">
        <a class="logo" href="#" data-to="Home" data-icon="compass" aria-label="Wayfinder Home"></a>
        <a class="rail-btn is-on" href="#" data-to="Home" data-icon="home" aria-label="Home"></a>
        <a class="rail-btn" href="#" data-to="Start a new map" data-icon="plus" aria-label="Start a new map"></a>
        <span class="rail-spacer"></span>
        <button type="button" class="rail-btn" data-to="a refresh" data-icon="refresh" aria-label="Refresh"></button>
        <button type="button" class="rail-btn" data-to="the theme switch" data-icon="moon" aria-label="Theme"></button>
        <span class="rail-mark">R</span>
      </nav>
      <div class="main">
        <header class="topbar">
          <span class="crumbs"><a href="#">Home</a></span>
          <span class="topbar-spacer"></span>
          <a class="primary" href="#" data-to="Start a new map"><span data-icon="plus"></span>Start a new map</a>
        </header>
        <main class="page">
          <div class="sheet">
            <div class="page-head">
              <div class="grow">
                <p class="eyebrow">Welcome back, ramon</p>
                <h1>Pick up where you left off</h1>
              </div>
            </div>
            <div class="split">
              <a class="card continue" href="#" id="continue"></a>
              <section class="card inflight">
                <h2>In flight in T3 Code</h2>
                <ul class="list" id="handoffs"></ul>
              </section>
            </div>
            <section class="section">
              <div class="section-head"><h2>Other repositories</h2></div>
              <div class="compact" id="repos"></div>
            </section>
          </div>
        </main>
      </div>
    </div>
    <script src="../kit/kit.js"></script>
    <script>
      const { FIXTURES: F, esc } = Kit;
      const map = F.lastMap;
      const cont = document.getElementById('continue');
      cont.dataset.to = `map #${map.number}`;
      cont.innerHTML = `<p class="eyebrow">${esc(map.repo)} · Map #${map.number}</p>
        <h2>${esc(map.title)}</h2>
        <div class="progress"><i style="width:${Math.round((100 * map.done) / map.total)}%"></i></div>
        <p class="muted">${map.done} of ${map.total} tickets done · ${F.frontier.length} ready to start</p>
        <ul class="list">${F.frontier
          .map((t) => `<li><span class="mono">${t.type}</span><span class="grow">#${t.number} ${esc(t.title)}</span><span data-icon="play"></span></li>`)
          .join('')}</ul>`;
      document.getElementById('handoffs').innerHTML = F.handOffs
        .map(
          (h) => `<li><span class="dot ${h.state}"></span><span class="grow">#${h.ticket} ${esc(h.title)}</span><span class="state">${esc(h.label)} · ${h.since}</span></li>`,
        )
        .join('');
      document.getElementById('repos').innerHTML = F.repositories
        .filter((r) => r.name !== map.repo)
        .map((r) => `<a href="#" data-to="${esc(r.name)}"><span data-icon="repo"></span>${esc(r.name)}</a>`)
        .join('');
    </script>
  </body>
</html>
