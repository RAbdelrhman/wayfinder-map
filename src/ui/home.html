<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wayfinder</title>
    <link rel="icon" type="image/svg+xml" href="/wayfinder-icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
  </head>
  <body class="viz-root">
    <div class="app" id="app">
      <aside class="sidebar-shell" id="sidebar-shell"></aside>

      <div class="main">
        <header class="topbar" id="topbar">
          <div class="nav-topbar" id="nav-topbar"></div>
          <span class="topbar-spacer"></span>
          <div class="map-inbox-anchor" id="map-inbox-anchor">
            <button type="button" class="map-inbox-trigger" id="map-inbox-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="map-inbox-list" aria-label="Inbox, 0 need you, 0 new"><span data-icon="bell" aria-hidden="true"></span><span class="map-inbox-label">Inbox</span><span class="map-inbox-count" id="map-inbox-count" hidden></span></button>
            <section class="map-inbox-list" id="map-inbox-list" role="dialog" aria-labelledby="map-inbox-title" hidden>
              <header class="map-inbox-head"><div><h2 id="map-inbox-title">Inbox</h2><p id="map-inbox-summary">Changes on maps you have opened</p></div><button type="button" class="map-inbox-clear" id="map-inbox-clear">Clear activity</button><button type="button" class="handoff-close" id="map-inbox-close" aria-label="Close inbox">×</button></header>
              <div class="map-inbox-filters" role="group" aria-label="Show"><button type="button" class="map-inbox-filter" data-inbox-filter="all" aria-pressed="true">All</button><button type="button" class="map-inbox-filter" data-inbox-filter="needs" aria-pressed="false">Needs you<span id="map-inbox-needs-count" class="map-inbox-needs-count" hidden></span></button></div>
              <div class="map-inbox-body" id="map-inbox-body"></div>
            </section>
          </div>
          <button type="button" class="synced" id="synced" aria-label="Resync from GitHub" title="Click to resync from GitHub"><span data-icon="refresh" class="synced-icon" aria-hidden="true"></span><span class="synced-label"></span></button>
        </header>
        <span class="sr-only" id="handoff-announcement" role="status" aria-live="polite"></span>
        <span class="sr-only" id="map-inbox-announcement" role="status" aria-live="polite"></span>

        <main class="page" id="main" tabindex="-1">
          <div class="sheet"><p class="loading">Reading GitHub…</p></div>
        </main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/home.js"></script>
  </body>
</html>
