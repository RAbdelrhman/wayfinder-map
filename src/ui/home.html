<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wayfinder</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
  </head>
  <body class="viz-root">
    <div class="app" id="app">
      <aside class="sidebar-shell" id="sidebar-shell"></aside>

      <div class="main">
        <header class="topbar" id="topbar">
          <div class="nav-topbar" id="nav-topbar"></div>
          <span class="topbar-spacer"></span>
          <div class="handoff-anchor" id="handoff-anchor" hidden>
            <button type="button" class="handoff-trigger" id="handoff-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="handoff-list" aria-label="Hand-offs in T3 Code"></button>
            <section class="handoff-list" id="handoff-list" role="dialog" aria-labelledby="handoff-list-title" hidden>
              <header class="handoff-list-head">
                <div><h2 id="handoff-list-title">Hand-offs</h2><p id="handoff-list-count"></p></div>
                <button type="button" class="handoff-close" data-focus-key="close" aria-label="Close hand-offs">×</button>
              </header>
              <div class="handoff-list-body" id="handoff-list-body"></div>
            </section>
          </div>
        </header>
        <span class="sr-only" id="handoff-announcement" role="status" aria-live="polite"></span>

        <main class="page" id="main" tabindex="-1">
          <div class="sheet"><p class="loading">Reading GitHub…</p></div>
        </main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/home.js"></script>
  </body>
</html>
