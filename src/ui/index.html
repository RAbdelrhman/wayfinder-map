<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wayfinder map</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
  </head>
  <body class="viz-root">
    <div class="app" id="app">
      <nav class="rail" aria-label="App">
        <a class="logo" href="/" data-icon="compass" title="Wayfinder Home" aria-label="Wayfinder Home"></a>
        <button type="button" id="view-map" class="rail-btn is-on" aria-pressed="true" aria-label="Map view" title="Map" data-icon="graph"></button>
        <button type="button" id="view-table" class="rail-btn" aria-pressed="false" aria-label="Table view" title="Table" data-icon="table"></button>
        <button type="button" id="view-prototypes" class="rail-btn" aria-pressed="false" aria-label="Prototypes view" title="Prototypes" data-icon="beaker"></button>
        <span class="rail-spacer"></span>
        <button type="button" id="models" class="rail-btn" aria-label="Model defaults" title="Pick a T3 Code model for each task tier" data-icon="sliders"></button>
        <button type="button" id="theme" class="rail-btn" aria-label="Theme" title="Switch light and dark" data-icon="moon"></button>
        <button type="button" id="updater" class="rail-btn" aria-label="Check for updates" title="Check for updates" data-icon="download"></button>
        <span class="rail-mark" id="account-mark" title="GitHub account">…</span>
      </nav>

      <div class="main">
        <header class="topbar">
          <span class="crumbs" id="repo">loading…</span>
          <div class="menu-anchor">
            <button type="button" class="mapswitch" id="mapswitch" aria-haspopup="menu" aria-expanded="false" hidden></button>
            <div class="menu" id="mapmenu" role="menu" hidden></div>
          </div>
          <label class="search">
            <span data-icon="lens"></span>
            <input id="search" type="search" placeholder="Jump to a ticket…" autocomplete="off" spellcheck="false" aria-label="Jump to a ticket" />
            <kbd>Ctrl K</kbd>
          </label>
          <div class="handoff-anchor" id="handoff-anchor" hidden>
            <button type="button" class="handoff-trigger" id="handoff-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="handoff-list" aria-label="Hand-offs in T3 Code"></button>
            <section class="handoff-list" id="handoff-list" role="dialog" aria-labelledby="handoff-list-title" hidden>
              <header class="handoff-list-head">
                <div><h2 id="handoff-list-title">Hand-offs</h2><p id="handoff-list-count"></p></div>
                <button type="button" class="handoff-close" data-focus-key="close" aria-label="Close hand-offs">×</button>
              </header>
              <div class="handoff-list-body" id="handoff-list-body"></div>
            </section>
          </div>
          <button type="button" class="synced" id="synced" aria-label="Resync from GitHub" title="Click to resync from GitHub">
            <span class="synced-icon" data-icon="refresh"></span>
            <span class="synced-label" id="synced-label"></span>
          </button>
        </header>
        <span class="sr-only" id="handoff-announcement" role="status" aria-live="polite"></span>

        <div class="warnings" id="warnings" hidden></div>
        <div class="planning-handoff is-compact" id="planning-handoff" role="region" aria-label="Map planning hand-off" hidden></div>
        <div class="filters" id="filters" role="toolbar" aria-label="Filter tickets"></div>

        <div class="body">
          <section class="stage" aria-label="Tickets">
            <div class="canvas-wrap" id="canvas-wrap">
              <div class="canvas-stage" id="canvas-stage">
                <div class="canvas" id="canvas">
                  <svg class="edges" id="edges" aria-hidden="true"></svg>
                  <div class="nodes" id="nodes"></div>
                </div>
              </div>
            </div>

            <div class="tablewrap" id="tablewrap" hidden></div>

            <div class="protowrap" id="protowrap" hidden></div>

            <div class="keybox menu-anchor">
              <button type="button" class="floatbox keybtn" id="key" aria-expanded="false"><span data-icon="info"></span>Key</button>
              <div class="menu is-up" id="keymenu" hidden></div>
            </div>

            <div class="zoom floatbox" role="group" aria-label="Zoom">
              <button type="button" id="zoom-out" class="iconbtn" aria-label="Zoom out" data-icon="minus"></button>
              <button type="button" id="zoom-reset" class="iconbtn pct" title="Reset zoom">100%</button>
              <button type="button" id="zoom-in" class="iconbtn" aria-label="Zoom in" data-icon="plus"></button>
            </div>
          </section>

          <aside class="inspector" id="inspector" aria-label="Brief and ticket"></aside>
        </div>
      </div>
    </div>

    <div class="hovercard" id="hovercard" aria-hidden="true"></div>

    <dialog class="dialog" id="models-dialog" aria-labelledby="models-title">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="models-title">Model defaults</h2>
          <button class="detail-close" value="close" aria-label="Close">×</button>
        </div>
        <p class="hint">Tickets run as Mid unless you switch them in the ticket panel. Changes save as you go.</p>
        <div id="tier-rows"></div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
