\n.runwith-row {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  min-width: 0;\r\n}\r\n\r\n.runwith-label {\r\n  flex: none;\r\n  width: 52px;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.runwith .seg {\r\n  padding: 3px 10px;\r\n  font-size: 12px;\r\n}\r\n\r\n.runwith .hint {\r\n  margin: 0;\r\n}\r\n\r\n.linkish {\r\n  margin-left: auto;\r\n  padding: 2px 4px;\r\n  border: 0;\r\n  background: none;\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n  text-decoration: underline;\r\n  text-underline-offset: 2px;\r\n}\r\n\r\n.linkish:hover {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.hint {\r\n  margin: 8px 0 0;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.picker {\r\n  display: flex;\r\n  gap: 6px;\r\n  min-width: 0;\r\n}\r\n\r\n.picker select {\r\n  flex: 1 1 auto;\r\n  min-width: 0;\r\n  padding: 6px 8px;\r\n  background: var(--surface-1);\r\n  color: var(--text-primary);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 8px;\r\n  font: inherit;\r\n  font-size: 12px;\r\n}\r\n\r\n.picker select + select {\r\n  flex: 0 1 auto;\r\n}\r\n\r\n.sec {\r\n  border-top: 1px solid var(--gridline);\r\n  padding: 10px 0;\r\n}\r\n\r\n.sec > summary {\r\n  cursor: pointer;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.sec > summary:hover {\r\n  color: var(--text-primary);\r\n}\r\n\r\npre.prompt {\r\n  margin: 10px 0 0;\r\n  max-height: 260px;\r\n  color: var(--text-secondary);\r\n  overflow-wrap: anywhere;\r\n}\r\n\r\n.body-text {\r\n  border-top: 1px solid var(--gridline);\r\n  padding-top: 14px;\r\n}\r\n\r\n/* ---------- table view ---------- */\r\n\r\n.tablewrap {\r\n  position: absolute;\r\n  inset: 0;\r\n  overflow: auto;\r\n  background: var(--surface-1);\r\n}\r\n\r\ntable {\r\n  width: 100%;\r\n  border-collapse: collapse;\r\n  font-size: 13px;\r\n}\r\n\r\nth,\r\ntd {\r\n  text-align: left;\r\n  padding: 10px 16px;\r\n  border-bottom: 1px solid var(--gridline);\r\n  vertical-align: top;\r\n}\r\n\r\nth {\r\n  position: sticky;\r\n  top: 0;\r\n  background: var(--surface-1);\r\n  color: var(--text-muted);\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  letter-spacing: 0.06em;\r\n  text-transform: uppercase;\r\n}\r\n\r\ntd.num,\r\nth.num {\r\n  width: 62px;\r\n  color: var(--text-muted);\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\ntbody tr {\r\n  cursor: pointer;\r\n}\r\n\r\ntbody tr:hover {\r\n  background: var(--wash);\r\n}\r\n\r\ntbody tr.is-selected {\r\n  background: color-mix(in srgb, var(--state-claimed) 10%, transparent);\r\n}\r\n\r\n.cellchip,\r\n.typecell {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.cellchip .i,\r\n.typecell .i {\r\n  width: 13px;\r\n  height: 13px;\r\n}\r\n\r\n.cellchip .i {\r\n  color: var(--accent);\r\n}\r\n\r\n.typecell .i {\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- models dialog ---------- */\r\n\r\n.dialog {\r\n  width: min(560px, calc(100vw - 32px));\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  background: var(--surface-1);\r\n  color: var(--text-primary);\r\n  padding: 16px;\r\n  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.24);\r\n}\r\n\r\n.dialog::backdrop {\r\n  background: rgba(0, 0, 0, 0.32);\r\n}\r\n\r\n.dialog-head {\r\n  display: flex;\r\n  align-items: center;\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.dialog-head h2 {\r\n  margin: 0;\r\n  font-size: 15px;\r\n}\r\n\r\n.detail-close {\r\n  margin-left: auto;\r\n  padding: 2px 6px;\r\n  border: 0;\r\n  border-radius: 6px;\r\n  background: none;\r\n  color: var(--text-muted);\r\n  font-size: 18px;\r\n  line-height: 1;\r\n}\r\n\r\n.detail-close:hover {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.dialog .hint {\r\n  margin: 0 0 14px;\r\n}\r\n\r\n.tier-row {\r\n  display: grid;\r\n  grid-template-columns: 150px minmax(0, 1fr);\r\n  gap: 12px;\r\n  align-items: center;\r\n  padding: 10px 0;\r\n  border-top: 1px solid var(--gridline);\r\n}\r\n\r\n.tier-name {\r\n  display: grid;\r\n  gap: 2px;\r\n  font-size: 13px;\r\n}\r\n\r\n.tier-name span {\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- toast ---------- */\r\n\r\n.toast {\r\n  position: fixed;\r\n  left: 50%;\r\n  bottom: 24px;\r\n  z-index: 70;\r\n  max-width: 70vw;\r\n  transform: translateX(-50%);\r\n  padding: 10px 16px;\r\n  border-radius: 10px;\r\n  background: var(--text-primary);\r\n  color: var(--surface-1);\r\n  font-size: 13px;\r\n  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);\r\n}\r\n\r\n@media (max-width: 1100px) {\r\n  .synced,\r\n  .search kbd {\r\n    display: none;\r\n  }\r\n\r\n  .body {\r\n    grid-template-columns: minmax(0, 1fr);\r\n    grid-template-rows: minmax(0, 1fr) 42vh;\r\n  }\r\n\r\n  .inspector {\r\n    border-left: 0;\r\n    border-top: 1px solid var(--hairline);\r\n  }\r\n}\r\n\r\n/* ---------- prototypes: gallery of live previews ---------- */\r\n\r\n.app.is-prototypes .filters,\r\n.app.is-prototypes .keybox,\r\n.app.is-prototypes .zoom {\r\n  display: none;\r\n}\r\n\r\n.protowrap {\r\n  position: absolute;\r\n  inset: 0;\r\n  overflow: auto;\r\n  background: var(--surface-1);\r\n}\r\n\r\n.protowrap .empty code {\r\n  font-size: 11px;\r\n}\r\n\r\n.proto .sec code,\r\n.ticket-proto .sec code {\r\n  font-size: 11px;\r\n}\r\n\r\n.ticket-proto {\r\n  margin-bottom: 16px;\r\n  padding: 12px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n}\r\n\r\n.ticket-proto .sec {\r\n  padding-bottom: 0;\r\n}\r\n\r\n/* ---------- home and repository pages ---------- */\r\n\r\n/*\r\n  Home borrows the map page's shell: the same 56px rail, the same 56px top bar, the same\r\n  surfaces and hairlines. Only the middle scrolls, so the chrome stays put exactly as it\r\n  does on a map.\r\n*/\r\n\r\n.rail-btn.is-on[href] {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.rail-mark {\r\n  position: relative;\r\n  width: 30px;\r\n  height: 30px;\r\n  margin-top: 6px;\r\n  border-radius: 50%;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  background: var(--state-claimed);\r\n  color: #fff;\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  flex: none;\r\n  overflow: hidden;\r\n  box-shadow: 0 0 0 1px var(--hairline);\r\n  user-select: none;\r\n}\r\n\r\n.rail-mark .avatar-img,\r\n.avatar .avatar-img {\r\n  position: absolute;\r\n  inset: 0;\r\n  width: 100%;\r\n  height: 100%;\r\n  object-fit: cover;\r\n  border-radius: inherit;\r\n  z-index: 1;\r\n}\r\n\r\n.rail-mark .avatar-initial,\r\n.avatar .avatar-initial {\r\n  position: relative;\r\n  z-index: 0;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  text-transform: uppercase;\r\n  font-weight: 700;\r\n  line-height: 1;\r\n}\r\n\r\n.rail-mark .avatar-initial .i,\r\n.avatar .avatar-initial .i {\r\n  width: 16px;\r\n  height: 16px;\r\n}\r\n\r\n.topbar-spacer {\r\n  flex: 1;\r\n  min-width: 8px;\r\n}\r\n\r\n.topbar .primary {\r\n  flex: none;\r\n  margin-right: 8px;\r\n  text-decoration: none;\r\n}\r\n\r\n.crumbs a {\r\n  color: inherit;\r\n  text-decoration: none;\r\n}\r\n\r\n.crumbs a:hover {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.page {\r\n  flex: 1 1 auto;\r\n  min-height: 0;\r\n  overflow: auto;\r\n}\r\n\r\n.sheet {\r\n  width: min(940px, 100%);\r\n  margin: 0 auto;\r\n  padding: 30px 28px 80px;\r\n}\r\n\r\n.page-head {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  gap: 18px;\r\n  margin-bottom: 26px;\r\n}\r\n\r\n.page-head .grow {\r\n  flex: 1;\r\n  min-width: 0;\r\n}\r\n\r\n.page-head h1 {\r\n  margin: 7px 0 0;\r\n  font-size: 25px;\r\n  line-height: 1.22;\r\n  letter-spacing: -0.02em;\r\n  font-weight: 650;\r\n  overflow-wrap: anywhere;\r\n}\r\n\r\n.page-head p {\r\n  margin: 8px 0 0;\r\n  max-width: 64ch;\r\n  font-size: 13.5px;\r\n  line-height: 1.55;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.page-actions {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding-top n-badge .repo-monogram-svg {\r\n  width: 100%;\r\n  height: 100%;\r\n  display: block;\r\n}\r\n\r\n.repo-icon-badge .repo-icon-img {\r\n  position: absolute;\r\n  inset: 0;\r\n  width: 100%;\r\n  height: 100%;\r\n  object-fit: contain;\r\n  border-radius: inherit;\r\n  z-index: 1;\r\n}\r\n\r\n:root[data-theme=\"light\"] .repo-monogram-svg,\r\n@media (prefers-color-scheme: light) {\r\n  :root:not([data-theme=\"dark\"]) .repo-monogram-svg {\r\n    filter: brightness(0.85) contrast(1.1);\r\n  }\r\n}\r\n\r\n.page-title-row {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n}\r\n\r\n.page-title-row h1 {\r\n  margin: 0;\r\n}\r\n\r\n.repo-pill {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n}\r\n\r\n.repo-option {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n\n\u003c/style>\n    \u003cstyle>\n/* PROTOTYPE (#45): pieces every after-hand-off variant shares. Tokens come from src/ui/styles.css. */\r\n\r\n.viz-root {\r\n  --ho-failed: #d13636;\r\n}\r\n:root[data-theme='dark'] .viz-root {\r\n  --ho-failed: #f06a6a;\r\n}\r\n\r\n#root,\r\n#root > .app {\r\n  height: 100%;\r\n}\r\n\r\n.grow {\r\n  flex: 1;\r\n  min-width: 0;\r\n}\r\n\r\ncode {\r\n  font: 12px ui-monospace, 'Cascadia Code', Consolas, monospace;\r\n}\r\n\r\n/* ---------- status pill, dot, spinner ---------- */\r\n\r\n.ho-pill {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  height: 22px;\r\n  padding: 0 8px;\r\n  border-radius: 999px;\r\n  font-size: 11.5px;\r\n  font-weight: 600;\r\n  white-space: nowrap;\r\n  color: color-mix(in srgb, var(--tone) 78%, var(--text-primary));\r\n  background: color-mix(in srgb, var(--tone) 13%, transparent);\r\n  border: 1px solid color-mix(in srgb, var(--tone) 30%, transparent);\r\n}\r\n.ho-pill .i {\r\n  width: 12px;\r\n  height: 12px;\r\n}\r\n.ho-pill i {\r\n  font-style: normal;\r\n  font-weight: 500;\r\n  opacity: 0.8;\r\n}\r\n.ho-pill.is-lg {\r\n  height: 28px;\r\n  padding: 0 11px;\r\n  font-size: 13px;\r\n}\r\n.ho-pill.is-stale {\r\n  color: var(--text-muted);\r\n  background: transparent;\r\n  border-style: dashed;\r\n  border-color: var(--baseline);\r\n}\r\n.ho-pill.is-live .i {\r\n  animation: ho-beat 1.4s ease-in-out infinite;\r\n}\r\n\r\n.ho-dot {\r\n  flex: none;\r\n  width: 8px;\r\n  height: 8px;\r\n  border-radius: 50%;\r\n  background: var(--tone);\r\n}\r\n.ho-dot.is-live {\r\n  box-shadow: 0 0 0 0 color-mix(in srgb, var(--tone) 60%, transparent);\r\n  animation: ho-ping 1.6s ease-out infinite;\r\n}\r\n.ho-dot.is-stale {\r\n  background: transparent;\r\n  border: 1.5px dashed var(--text-muted);\r\n}\r\n\r\n.ho-spin {\r\n  flex: none;\r\n  width: 11px;\r\n  height: 11px;\r\n  border-radius: 50%;\r\n  border: 2px solid color-mix(in srgb, currentColor 25%, transparent);\r\n  border-top-color: currentColor;\r\n  animation: ho-rot 0.8s linear infinite;\r\n}\r\n\r\n@keyframes ho-rot {\r\n  to {\r\n    transform: rotate(360deg);\r\n  }\r\n}\r\n@keyframes ho-beat {\r\n  50% {\r\n    opacity: 0.35;\r\n  }\r\n}\r\n@keyframes ho-ping {\r\n  to {\r\n    box-shadow: 0 0 0 7px transparent;\r\n  }\r\n}\r\n@media (prefers-reduced-motion: reduce) {\r\n  .ho-spin,\r\n  .ho-pill.is-live .i,\r\n  .ho-dot.is-live {\r\n    animation: none;\r\n  }\r\n}\r\n\r\n/* ---------- small shared bits ---------- */\r\n\r\n.ho-sm {\r\n  height: 28px;\r\n  padding: 0 10px;\r\n  font-size: 12.5px;\r\n}\r\n.ho-row {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n.ho-back {\r\n  margin-left: auto;\r\n  font-size: 12.5px;\r\n}\r\n.ho-line {\r\n  margin: 2px 0 0;\r\n  color: var(--text-secondary);\r\n  font-size: 12.5px;\r\n  line-height: 1.45;\r\n}\r\n.ho-when,\r\n.ho-count {\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n  white-space: nowrap;\r\n}\r\n.ho-where {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n}\r\n.ho-where-map {\r\n  display: flex;\r\n  min-width: 0;\r\n  max-width: 100%;\r\n  font-size: 11.5px;\r\n}\r\n.ho-where-map .ho-mark {\r\n  width: 15px;\r\n  height: 15px;\r\n  font-size: 7px;\r\n  border-radius: 4px;\r\n}\r\n.ho-where-repo {\r\n  color: var(--text-secondary);\r\n  white-space: nowrap;\r\n}\r\n.ho-where-sep {\r\n  opacity: 0.6;\r\n}\r\n.ho-where-title {\r\n  min-width: 0;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n.ho-where .i {\r\n  width: 12px;\r\n  height: 12px;\r\n}\r\n.ho-facts code {\r\n  min-width: 0;\r\n  font-size: 11.5px;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n.ho-facts dd .linkish {\r\n  margin: 0;\r\n}\r\n\r\n.ho-offline {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  padding: 9px 12px;\r\n  border: 1px dashed var(--baseline);\r\n  border-radius: 10px;\r\n  background: var(--wash);\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n}\r\n.ho-offline > .i {\r\n  color: var(--text-muted);\r\n}\r\n.ho-offline b {\r\n  color: var(--text-primary);\r\n}\r\n.ho-stage-banner {\r\n  position: absolute;\r\n  z-index: 5;\r\n  left: 16px;\r\n  right: 16px;\r\n  top: 12px;\r\n}\r\n.ho-stage-banner .ho-offline {\r\n  background: var(--surface-1);\r\n  box-shadow: var(--shadow);\r\n}\r\n\r\n.ho-prose h3 {\r\n  margin: 18px 0 6px;\r\n  font-size: 12px;\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.06em;\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- timeline ---------- */\r\n\r\n.ho-timeline {\r\n  list-style: none;\r\n  margin: 0;\r\n  padding: 0;\r\n}\r\n.ho-timeline li {\r\n  --c: var(--baseline);\r\n  position: relative;\r\n  display: flex;\r\n  gap: 12px;\r\n  padding: 0 0 14px 22px;\r\n  font-size: 13px;\r\n}\r\n.ho-timeline li::before {\r\n  content: '';\r\n  position: absolute;\r\n  left: 5px;\r\n  top: 14px;\r\n  bottom: -2px;\r\n  width: 2px;\r\n  background: var(--hairline);\r\n}\r\n.ho-timeline li:last-child::before {\r\n  display: none;\r\n}\r\n.ho-tl-dot {\r\n  position: absolute;\r\n  left: 0;\r\n  top: 4px;\r\n  width: 12px;\r\n  height: 12px;\r\n  border-radius: 50%;\r\n  border: 2px solid var(--c);\r\n  background: var(--surface-1);\r\n}\r\n.ho-timeline li.is-done {\r\n  --c: var(--text-muted);\r\n}\r\n.ho-timeline li.is-done .ho-tl-dot {\r\n  background: var(--c);\r\n}\r\n.ho-timeline li.is-live {\r\n  --c: var(--state-claimed);\r\n}\r\n.ho-timeline li.is-live .ho-tl-dot {\r\n  animation: ho-ping 1.6s ease-out infinite;\r\n  box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent);\r\n}\r\n.ho-timeline li.is-stale {\r\n  --c: var(--text-muted);\r\n}\r\n.ho-timeline li.is-stale .ho-tl-dot {\r\n  animation: none;\r\n  border-style: dashed;\r\n}\r\n.ho-timeline li.is-wait {\r\n  --c: var(--state-blocked);\r\n}\r\n.ho-timeline li.is-good {\r\n  --c: var(--state-frontier);\r\n}\r\n.ho-timeline li.is-bad {\r\n  --c: var(--ho-failed);\r\n}\r\n.ho-timeline li.is-wait .ho-tl-dot,\r\n.ho-timeline li.is-good .ho-tl-dot,\r\n.ho-timeline li.is-bad .ho-tl-dot {\r\n  background: var(--c);\r\n}\r\n.ho-timeline b {\r\n  display: block;\r\n  font-weight: 600;\r\n}\r\n.ho-timeline span.grow > span {\r\n  display: block;\r\n  color: var(--text-secondary);\r\n  font-size: 12.5px;\r\n}\r\n.ho-timeline time {\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n/* ---------- map page bits ---------- */\r\n\r\n.node.is-selected {\r\n  box-shadow: 0 0 0 2px var(--state-claimed);\r\n}\r\n.node .ho-nbadge {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  min-width: 0;\r\n  margin-top: auto;\r\n  font-size: 11.5px;\r\n  color: var(--text-secondary);\r\n}\r\n.node .ho-nbadge .ho-pill {\r\n  height: 19px;\r\n  font-size: 10.5px;\r\n  padding: 0 6px;\r\n}\r\n.node .ho-nbadge span.grow {\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- Home (#40) ---------- */\r\n\r\n.ho-home {\r\n  max-width: 1040px;\r\n}\r\n.ho-continue {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 14px;\r\n  padding: 16px 18px;\r\n  margin-bottom: 18px;\r\n  text-decoration: none;\r\n  color: inherit;\r\n}\r\n.ho-continue strong {\r\n  display: block;\r\n  font-size: 15px;\r\n}\r\n.ho-cont-ic {\r\n  display: grid;\r\n  place-items: center;\r\n  width: 42px;\r\n  height: 42px;\r\n  border-radius: 10px;\r\n  background: var(--wash);\r\n}\r\n.ho-home .section-head {\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 10px;\r\n}\r\n.ho-home > .ho-offline {\r\n  margin-bottom: 14px;\r\n}\r\n.ho-strip {\r\n  display: grid;\r\n  grid-template-columns: repeat(3, minmax(0, 1fr));\r\n  gap: 12px;\r\n}\r\n.ho-fcard {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 6px;\r\n  margin: 0;\r\n  padding: 14px;\r\n  border-top: 3px solid var(--tone);\r\n}\r\n.ho-fcard-top {\r\n  display: flex;\r\n  justify-content: space-between;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n.ho-fcard strong {\r\n  font-size: 13.5px;\r\n  line-height: 1.35;\r\n}\r\n.ho-fcard .ho-row {\r\n  margin-top: auto;\r\n  padding-top: 6px;\r\n}\r\n\r\n/* ---------- sidebar (#42 D) ---------- */\r\n\r\n.app.has-side {\r\n  grid-template-columns: 256px minmax(0, 1fr);\r\n}\r\n.ho-side {\r\n  display: flex;\r\n  flex-direction: column;\r\n  min-height: 0;\r\n  background: var(--surface-1);\r\n  border-right: 1px solid var(--hairline);\r\n  font-size: 13px;\r\n}\r\n.ho-side-head {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  height: 56px;\r\n  padding: 0 13px;\r\n  border-bottom: 1px solid var(--hairline);\r\n}\r\n.ho-side-actions {\r\n  display: grid;\r\n  gap: 6px;\r\n  padding: 12px 10px 6px;\r\n}\r\n.ho-side-actions .primary {\r\n  justify-content: center;\r\n  text-decoration: none;\r\n}\r\n.ho-side .search {\r\n  width: auto;\r\n  margin: 0;\r\n}\r\n.ho-tree {\r\n  flex: 1;\r\n  overflow: auto;\r\n  padding: 6px 8px 12px;\r\n}\r\n.ho-tlabel { tent = `:root,:root ${body}{${decls(style.vars)}}:root ${body}{${style.font ? `font-family:${style.font};` : ''}}\n        :root[data-theme='dark'],:root[data-theme='dark'] ${body}{${decls({ ...style.vars, ...style.dark })}}\n        ${style.css ?? ''}`;\n      document.head.append(el);\n    }\n  } catch {\n    console.warn('Ignoring a style the canvas could not parse.');\n  }\n\n  const esc = (text) => String(text ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n  /** Inner SVG markup by name, drawn on a 24px grid in currentColor. Add your own: Kit.icons.star = '\u003cpath …/>'. */\n  const icons = {};\n  const icon = (name) =>\n    `\u003csvg class=\"i\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${\n      icons[name] ?? ''\n    }\u003c/svg>`;\n\n  function fillIcons(root = document) {\n    for (const el of root.querySelectorAll('[data-icon]')) el.innerHTML = icon(el.dataset.icon);\n  }\n\n  const toastCss = document.createElement('style');\n  toastCss.textContent = `#kit-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;padding:9px 14px;border-radius:8px;\n    background:#1b1b1a;color:#f3f2ee;font:13px/1.4 system-ui,sans-serif;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}#kit-toast[hidden]{display:none}`;\n  document.head.append(toastCss);\n\n  let timer;\n  function toast(message) {\n    let el = document.getElementById('kit-toast');\n    if (!el) {\n      el = document.createElement('div');\n      el.id = 'kit-toast';\n      el.setAttribute('role', 'status');\n      document.body.append(el);\n    }\n    el.textContent = message;\n    el.hidden = false;\n    clearTimeout(timer);\n    timer = setTimeout(() => (el.hidden = true), 2600);\n  }\n\n  // A prototype has nowhere real to go: say where a link would lead instead.\n  document.addEventListener('click', (event) => {\n    const link = event.target.closest('[data-to]');\n    if (!link) return;\n    event.preventDefault();\n    toast(`Would open ${link.dataset.to}`);\n  });\n\n  document.addEventListener('DOMContentLoaded', () => fillIcons());\n\n  return { icons, icon, fillIcons, toast, esc };\n})();\n\n\u003c/script>\n    \u003cscript>\n/*\r\n  PROTOTYPE (#45): shared fake data, T3 Code states, chrome and page bodies for the\r\n  after-hand-off variants. Load after ../kit/kit.js. A variant calls AFTER.start(render),\r\n  where render(state) returns the whole page; everything here is the same in every variant.\r\n\r\n  The focus hand-off is ticket #55. Its T3 Code state is faked by the Prototype bar at the\r\n  bottom left (or ?state=starting|working|input|done|failed|offline). The other hand-offs\r\n  stay put so the in-flight list always has something in it.\r\n*/\r\n(() => {\r\n  Object.assign(Kit.icons, {\r\n    compass: '\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m15.5 8.5-2 5-5 2 2-5z\"/>',\r\n    home: '\u003cpath d=\"m3 10.5 9-7 9 7\"/>\u003cpath d=\"M5.5 9.2V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.2\"/>',\r\n    plus: '\u003cpath d=\"M12 5v14M5 12h14\"/>',\r\n    minus: '\u003cpath d=\"M5 12h14\"/>',\r\n    refresh: '\u003cpath d=\"M20 11a8 8 0 0 0-14.9-3.5L3 10\"/>\u003cpath d=\"M3 4v6h6\"/>\u003cpath d=\"M4 13a8 8 0 0 0 14.9 3.5L21 14\"/>\u003cpath d=\"M21 20v-6h-6\"/>',\r\n    moon: '\u003cpath d=\"M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z\"/>',\r\n    arrow: '\u003cpath d=\"M5 12h14\"/>\u003cpath d=\"m12 5 7 7-7 7\"/>',\r\n    back: '\u003cpath d=\"M19 12H5\"/>\u003cpath d=\"m12 19-7-7 7-7\"/>',\r\n    right: '\u003cpath d=\"m9 6 6 6-6 6\"/>',\r\n    chevron: '\u003cpath d=\"m6 9 6 6 6-6\"/>',\r\n    up: '\u003cpath d=\"m18 15-6-6-6 6\"/>',\r\n    graph: '\u003crect x=\"3\" y=\"4\" width=\"7\" height=\"6\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"6\" rx=\"1.5\"/>\u003cpath d=\"M10 7 = (h) => (h.kind === 'map' ? `the draft map \"${h.title}\"` : `ticket #${h.number} on map #${mapNum(h)} in ${repoOf(h).name}`);\r\n\r\n  /* ---------- small pieces ---------- */\r\n\r\n  const statusIcon = (status) => (status === 'starting' ? '\u003cspan class=\"ho-spin\" aria-hidden=\"true\">\u003c/span>' : icon(STATUS[status].icon));\r\n\r\n  /** The status pill: tone, icon and a word. Stale when T3 Code is off. */\r\n  function pill(h, { size = '' } = {}) {\r\n    const s = STATUS[h.status];\r\n    return `\u003cspan class=\"ho-pill${h.stale ? ' is-stale' : ''}${size ? ` is-${size}` : ''}${h.status === 'working' && !h.stale ? ' is-live' : ''}\" style=\"--tone:${s.tone}\">${statusIcon(h.status)}${s.word}${h.stale ? '\u003ci>· stale\u003c/i>' : ''}\u003c/span>`;\r\n  }\r\n  const dot = (h) =>\r\n    `\u003cspan class=\"ho-dot${h.stale ? ' is-stale' : ''}${h.status === 'working' && !h.stale ? ' is-live' : ''}\" style=\"--tone:${STATUS[h.status].tone}\" title=\"${STATUS[h.status].word}\">\u003c/span>`;\r\n  const sinceText = (h) => (h.stale ? 'as of 14 min ago' : h.status === 'working' || h.status === 'starting' ? `for ${h.since}`.replace('for just now', 'just now') : h.since);\r\n\r\n  /** The actions a hand-off offers in its state. `compact` gives icon-light buttons for lists. */\r\n  function actions(h, { compact = false, back = true } = {}) {\r\n    const b = (cls, ic, text, to) => `\u003cbutton type=\"button\" class=\"${cls}${compact ? ' ho-sm' : ''}\" data-to=\"${esc(to)}\">${icon(ic)}${text}\u003c/button>`;\r\n    const t3 = (cls = 'ghost') => b(cls, 'external', 'Open in T3 Code', 'the thread in T3 Code');\r\n    const out = [];\r\n    if (h.stale) out.push(b('primary', 'play', 'Start T3 Code', 'T3 Code (it reconnects and catches up)'));\r\n    else if (h.status === 'input') out.push(b('primary', 'ask', 'Answer in T3 Code', 'the thread in T3 Code, at the question'));\r\n    else if (h.status === 'done') out.push(b('primary', 'pr', `Open PR #${h.pr}`, `PR #${h. ss=\"title\">${esc(t.title)}\u003c/span>${b || `\u003cspan class=\"meta\">${ticketState(t) === 'claimed' || ticketState(t) === 'done' ? '@RAbdelrhman' : TYPES[t.type][0]}\u003c/span>`}\u003c/button>`;\r\n  }\r\n\r\n  function edgesSvg() {\r\n    const at = Object.fromEntries(TICKETS.map((t) => [t.number, pos(t)]));\r\n    return EDGES.map(([a, b]) => {\r\n      const x1 = at[a].x + NODE_W;\r\n      const y1 = at[a].y + NODE_H / 2;\r\n      const x2 = at[b].x;\r\n      const y2 = at[b].y + NODE_H / 2;\r\n      const m = (x1 + x2) / 2;\r\n      return `\u003cpath d=\"M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}\"/>`;\r\n    }).join('');\r\n  }\r\n\r\n  /** Filters row; `extra` is a variant's own chip. */\r\n  const filters = (extra = '') =>\r\n    `\u003cdiv class=\"filters\">\u003cbutton type=\"button\" class=\"fchip is-on\">All \u003cb>${TICKETS.length}\u003c/b>\u003c/button>${['frontier', 'claimed', 'blocked', 'done']\r\n      .map((s) => `\u003cbutton type=\"button\" class=\"fchip\" style=\"--accent: var(${STATES[s].v})\">${icon(STATES[s].icon)}${{ frontier: 'Next up', claimed: 'Claimed', blocked: 'Blocked', done: 'Done' }[s]} \u003cb>${TICKETS.filter((t) => ticketState(t) === s).length}\u003c/b>\u003c/button>`)\r\n      .join('')}${extra}\u003c/div>`;\r\n\r\n  /** The ticket panel for #55. `slot` replaces the launch block. */\r\n  function ticketPanel(slot) {\r\n    const t = TICKETS.find((x) => x.number === 55);\r\n    const st = STATES[ticketState(t)];\r\n    return `\u003caside class=\"inspector\">\u003cdiv class=\"insp-tabs\">\u003cdiv class=\"segmented\">\u003cbutton class=\"seg\">Brief\u003c/button>\u003cbutton class=\"seg is-on\">Ticket\u003c/button>\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"insp-panel\">\r\n        \u003cdiv class=\"dhead\">\u003cspan class=\"glyph\">${icon('list')}\u003c/span>\u003cspan class=\"num\">#55\u003c/span>\u003cspan class=\"chip\" style=\"--accent: var(${st.v})\">${icon(st.icon)}${st.label}\u003c/span>\u003c/div>\r\n        \u003ch2 class=\"dtitle\">${esc(t.title)}\u003c/h2>\r\n        ${slot}\r\n        \u003cdiv class=\"prose ho-prose\">\u003ch3>Question\u003c/h3>\u003cp>Persist a minimal record of every hand-off under \u003ccode>~/.wayfinder-map/\u003c/code> and keep it current from T3 Code's WebSocket, reconciling against \u003ccode>/api/orchestration/snapshot\u003c/code> every minute.\u003c/p>\r\n        \u003ch3>Done when\u003c/h3>\u003cul>\u003cli>Records survive a restart\u003c/li>\u003cli>Branch and PR links are picked up when T3 reports them\u003c/li>\u003cli>Offline shows the last record as stale\u003c/li>\u003c/ul>\u003c/div>\r\n      \u003c/div>\u003c/aside>`;\r\n  }\r\n\r\n  /** Today's launch block: what the panel shows before (or instead of) a hand-off. */\r\n  const launchBlock = () => `\u003cdiv class=\"launch\">\u003cdiv class=\"launch-actions\">\u003cbutton type=\"button\" class=\"primary\" data-handoff>${icon('play')}Open in T3 Code\u003c/button>\u003cbutton type=\"button\" class=\"ghost\" data-to=\"the clipboard\">${icon('copy')}Copy prompt\u003c/button>\u003c/div>\u003c/div>`;\r\n\r\n  function mapPage({ badge, slot, filterExtra = '', overlay = '' } = {}) {\r\n    return `${filters(filterExtra)}\u003cdiv class=\"body\">\u003csection class=\"stage\">${offlineBanner() ? `\u003cdiv class=\"ho-stage-banner\">${offlineBanner()}\u003c/div>` : ''}\u003cdiv class=\"canvas-wrap\">\u003cdiv class=\"canvas\" style=\"width:980px;height:560px\">\u003csvg class=\"edges\" width=\"980\" height=\"560\">${edgesSvg()}\u003c/svg>\u003cdiv class=\"nodes\">${TICKETS.map((t) => nodeHtml(t, { badge, selected: 55 })).join('')}\u003c/div>\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"zoom floatbox\">\u003cbutton class=\"iconbtn\">${icon('minus')}\u003c/button>\u003cbutton class=\"iconbtn pct\">100%\u003c/button>\u003cbutton class=\"iconbtn\">${icon('plus')}\u003c/button>\u003c/div>${overlay}\u003c/section>${ticketPanel(slot ?? launchBlock())}\u003c/div>`;\r\n  }\r\n\r\n  /* ---------- Home (#40): Continue, then In flight ordered by what waits on you ---------- */\r\n\r\n  function flightCard(h) {\r\n    return `\u003cdiv class=\"card ho-fcard\" style=\"--tone:${STATUS[h.status].tone}\">\r\n      \u003cdiv class=\"ho-fcard-top\">${pill(h)}\u003cspan class=\"ho-when\">${esc(sinceText(h))}\u003c/span>\u003c/div>\r\n      \u003cstrong>${esc(label(h))}\u003c/strong>\u003cp class=\"ho-line\">${esc(h.line)}\u003c/p>${whereHtml(h)}\r\n      \u003cdiv class=\"ho-row\">${actions(h, { compact: true })}\u003c/div>\u003c/div>`;\r\n  }\r\n\r\n  function homePage({ strip } = {}) {\r\n    const list = byUrgency(handOffs());\r\n    return `\u003cmain class=\"page\">\u003cdiv class=\"sheet ho-home\">\r\n      \u003cdiv class=\"page-head\">\u003cdiv class=\"grow\">\u003cp class=\"eyebrow\">Home\u003c/p>\u003ch1>Pick up where you left off\u003c/h1>\u003c/div>\u003c/div>\r\n      \u003ca class=\"card ho-continue\" href=\"#\" data-view=\"map\">\u003cspan class=\"ho-cont-ic\">${icon('graph')}\u003c/span>\u003cspan class=\"grow\">\u003cspan class=\"eyebrow\">Continue · wayfinder-map\u003c/span>\u003cstrong>#35 ${esc(MAP.title)}\u003c/strong>\u003cspan class=\"ho-line\">4 next up · 5 claimed\u003c/span>\u003c/span>${icon('arrow')}\u003c/a>\r\n      ${offlineBanner()}\r\n      \u003csection class=\"section\">\u003cdiv class=\"section-head\">\u003ch2>In flight\u003c/h2>\u003cspan class=\"ho-count\">${list.length}${waiting(list) ? ` · ${waiting(list)} waiting on you` : ''}\u003c/span>\u003c/div>\r\n        ${list.length === 0 ? '\u003cp class=\"ho-line\">Nothing in T3 Code right now.\u003c/p>' : strip ? strip(list) : `\u003cdiv class=\"ho-strip\">${list.map(flightCard).join('')}\u003c/div>`}\u003c/section>\r\n    \u003c/div>\u003c/main>`;\r\n  }\r\n\r\n  /* ---------- chrome (#42 D): sidebar tree on pages, folded rail on the map ---------- */\r\n\r\n  function side(s, { top = '' } = {}) {\r\n    const row = (attrs, inner, cls = '') => `\u003ca class=\"ho-trow${cls}\" href=\"#\" ${attrs}>${inner}\u003c/a>`;\r\n    return `\u003cnav class=\"ho-side\" aria-label=\"App\">\r\n      \u003cdiv class=\"ho-side-head\">\u003cspan class=\"logo\">${icon('compass')}\u003c/span>\u003cb>Wayfinder\u003c/b>\u003c/div>\r\n      \u003cdiv class=\"ho-side-actions\">\u003ca class=\"primary\" href=\"#\" data-to=\"Start a new map\">${icon('plus')}Start a new map\u003c/a>\r\n        \u003cbutton type=\"button\" class=\"search\" data-to=\"Jump to\">${icon('lens')}\u003cspan class=\"grow\">Jump to…\u003c/span>\u003ckbd>Ctrl K\u003c/kbd>\u003c/button>\u003c/div>\r\n      \u003cdiv class=\"ho-tree\">${top}\r\n        ${row('data-view=\"home\"', `${icon('home')}\u003cspan class=\"grow\">Home\u003c/span>`, s.view === 'home' ? ' is-on' : '')}\r\n        \u003cdiv class=\"ho-tlabel\">Repositories\u003c/div>\r\n        ${row('data-to=\"the repository page\"', `${icon('chevron')}\u003cspan class=\"ho-mark\">WM\u003c/span>\u003cspan class=\"grow\">wayfinder-map\u003c/span>`, ' is-trail')}\r\n        \u003cdiv class=\"ho-kids\">${row('data-view=\"map\"', `${icon('graph')}\u003cspan class=\"grow\">#35 Redesign Home and Start a…\u003c/span>`, s.view === 'map' ? ' is-on' : '')}\r\n          ${row('data-to=\"map #14\"', `${icon('graph')}\u003cspan class=\"grow\">#14 Installable desktop app\u003c/span>`)}\u003c/div>\r\n        ${row('data-to=\"podcontrol\"', `${icon('right')}\u003cspan class=\"ho-mark\" style=\"--h:150\">PC\u003c/span>\u003cspan class=\"grow\">podcontrol\u003c/span>`)}\r\n        ${row('data-to=\"pdfbuilder\"', `${icon('right')}\u003cspan class=\"ho-mark\" style=\"--h:28\">PB\u003c/span>\u003cspan class=\"grow\">pdfbuilder\u003c/span>`)}\r\n      \u003c/div>\r\n      \u003cdiv class=\"ho-side-foot\">\u003cspan class=\"rail-mark\">R\u003c/span>\u003cspan class=\"grow\">ramon\u003c/span>\u003cbutton type=\"button\" class=\"rail-btn\" data-to=\"settings\">${icon('moon')}\u003c/button>\u003c/div>\u003c/nav>`;\r\n  }\r\n\r\n  function rail(s, { extra = '' } = {}) {\r\n    return `\u003cnav class=\"rail\" aria-label=\"App\">\u003ca class=\"logo\" href=\"#\" data-view=\"home\">${icon('compass')}\u003c/a>\r\n      \u003cbutton type=\"button\" class=\"rail-btn\" data-to=\"the sidebar\" title=\"Open the sidebar\">${icon('panel')}\u003c/button>\r\n      \u003ca class=\"rail-btn${s.view === 'map' ? ' is-on' : ''}\" href=\"#\" data-view=\"map\" title=\"Map\">${icon('graph')}\u003c/a>\r\n      \u003ca class=\"rail-btn\" href=\"#\" data-to=\"the table view\" title=\"Table\">${icon('table')}\u003c/a>\r\n      \u003ca class=\"rail-btn\" href=\"#\" data-to=\"this map's prototypes\" title=\"Prototypes\">${icon('beaker')}\u003c/a>\r\n      ${extra}\u003cspan class=\"rail-spacer\">\u003c/span>\r\n      \u003cbutton type=\"button\" class=\"rail-btn\" data-to=\"the theme switch\">${icon('moon')}\u003c/button>\u003c/nav>`;\r\n  }\r\n\r\n  function topbar(s, { right = '', title } = {}) {\r\n    const t =\r\n      title ??\r\n      (s.view === 'map'\r\n        ? `\u003cspan class=\"crumbs\">\u003cspan class=\"ho-mark\">WM\u003c/span>wayfinder-map\u003cspan class=\"crumb-sep\">/\u003c/span>\u003c/span>\u003cspan class=\"ho-ptitle\">#35 ${esc(MAP.title)}\u003c/span>`\r\n        : `\u003cspan class=\"ho-ptitle\">${s.view === 'home' ? 'Home' : ''}\u003c/span>`);\r\n    return `\u003cheader class=\"topbar\">${t}\u003cspan class=\"topbar-spacer\">\u003c/span>${right}\u003cspan class=\"synced\">${offline() ? 'T3 Code offline' : 'Synced just now'}\u003c/span>\u003c/header>`;\r\n  }\r\n\r\n  /* ---------- the Prototype bar: fakes T3 Code's state ---------- */\r\n\r\n  function protoBar() {\r\n    return `\u003cdiv class=\"ho-proto\" role=\"group\" aria-label=\"Prototype: fake T3 Code state\">\u003cspan class=\"ho-proto-tag\">Prototype\u003c/span>\u003cspan class=\"ho-proto-lbl\">#55 in T3 Code:\u003c/span>\r\n      ${FAKE_STATES.map(([k, l]) => `\u003cbutton type=\"button\" class=\"${state.fake === k ? 'is-on' : ''}\" data-fake=\"${k}\">${l}\u003c/button>`).join('')}\r\n      \u003cspan class=\"ho-proto-sep\">\u003c/span>\u003cbutton type=\"button\" class=\"${state.others ? '' : 'is-on'}\" data-others title=\"Hide the four other hand-offs, to see a quiet start\">Only #55\u003c/button>\u003cbutton type=\"button\" data-replay title=\"Undo the hand-off and press Open in T3 Code again\">${icon('retry')}Replay hand-off\u003c/button>\u003c/div>`;\r\n  }\r\n\r\n  /* ---------- state and rendering ---------- */\r\n\r\n  let render = null;\r\n  let timer = null;\r\n\r\n  function paint() {\r\n    document.getElementById('root').innerHTML = render(state) + protoBar();\r\n    Kit.fillIcons();\r\n  }\r\n\r\n  function setFake(k) {\r\n    state.fake = k;\r\n    if (k !== 'offline') lastFake = k;\r\n    state.handedOff = true;\r\n    paint();\r\n  }\r\n\r\n  /** What pressing Open in T3 Code does in every variant: start, then settle into Working. */\r\n  function handOff() {\r\n    clearTimeout(timer);\r\n    state.handedOff = true;\r\n    state.justHandedOff = true;\r\n    setFake('starting');\r\n    timer = setTimeout(() => {\r\n      state.justHandedOff = false;\r\n      if (state.fake === 'starting') setFake('working');\r\n    }, 2600);\r\n  }\r\n\r\n  document.addEventListener('click', (e) => {\r\n    const fake = e.target.closest('[data-fake]');\r\n    if (fake) {\r\n      clearTimeout(timer);\r\n      state.justHandedOff = false;\r\n      return setFake(fake.dataset.fake);\r\n    }\r\n    if (e.target.closest('[data-others]')) {\r\n      state.others = !state.others;\r\n      return paint();\r\n    }\r\n    if (e.target.closest('[data-replay]')) {\r\n      clearTimeout(timer);\r\n      state.handedOff = false;\r\n      state.justHandedOff = false;\r\n      state.view = 'map';\r\n      state.fake = 'working';\r\n      lastFake = 'working';\r\n      paint();\r\n      return Kit.toast('Press Open in T3 Code in the ticket panel');\r\n    }\r\n    if (e.target.closest('[data-handoff]')) {\r\n      e.preventDefault();\r\n      return handOff();\r\n    }\r\n    const view = e.target.closest('[data-view]');\r\n    if (view) {\r\n      e.preventDefault();\r\n      state.view = view.dataset.view;\r\n      state.justHandedOff = false;\r\n      return paint();\r\n    }\r\n    const toggle = e.target.closest('[data-toggle]');\r\n    if (toggle) {\r\n      e.preventDefault();\r\n      state.open = !state.open;\r\n      return paint();\r\n    }\r\n  });\r\n\r\n  window.AFTER = {\r\n    STATUS,\r\n    FAKE_STATES,\r\n    MAP,\r\n    state,\r\n    esc,\r\n    icon,\r\n    offline,\r\n    handOffs,\r\n    byUrgency,\r\n    focusHandOff,\r\n    waiting,\r\n    label,\r\n    where,\r\n    whereHtml,\r\n    target,\r\n    pill,\r\n    dot,\r\n    statusIcon,\r\n    sinceText,\r\n    actions,\r\n    offlineBanner,\r\n    timeline,\r\n    facts,\r\n    launchBlock,\r\n    mapPage,\r\n    homePage,\r\n    flightCard,\r\n    side,\r\n    rail,\r\n    topbar,\r\n    paint,\r\n    handOff,\r\n    start(fn) {\r\n      render = fn;\r\n      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);\r\n      else paint();\r\n    },\r\n  };\r\n})();\r\n\n\u003c/script>\n    \u003cscript>\n      const { state, icon, esc, pill, dot, sinceText, actions } = AFTER;\n      const params = new URLSearchParams(window.__Q ?? location.search);\n      state.open = params.get('open') === '1';\n      let shown = null; // was the button there on the last paint? For the pop when it appears.\n\n      // A: the node says it is in T3 Code, in the same words as the card.\n      function badge(t) {\n        const h = AFTER.handOffs().find((x) => x.number === t.number && !x.repo);\n        return h ? `\u003cspan class=\"ho-nbadge\">${pill(h)}\u003cspan class=\"grow\">${esc(sinceText(h))}\u003c/span>\u003c/span>` : '';\n      }\n\n      // A: the launch block turns into this card when you press Open in T3 Code, and stays live.\n      function card() {\n        if (!state.handedOff) return AFTER.launchBlock();\n        const h = AFTER.focusHandOff();\n        return `\u003cdiv class=\"ho-card${state.justHandedOff ? ' is-fresh' : ''}\" style=\"--tone:${AFTER.STATUS[h.status].tone}\">\n          ${state.justHandedOff ? `\u003cp class=\"ho-sent\">${icon('check')}Sent to T3 Code. You can keep working here: this card stays live.\u003c/p>` : ''}\n          \u003cdiv class=\"ho-card-head\">${pill(h, { size: 'lg' })}\u003cspan class=\"ho-when\">${esc(sinceText(h))}\u003c/span>\u003c/div>\n          ${AFTER.offline() ? `\u003cdiv class=\"ho-offline\">${icon('plug')}\u003cspan class=\"grow\">T3 Code isn't running. This is its last report.\u003c/span>\u003c/div>` : ''}\n          \u003cp class=\"ho-line\">${esc(h.line)}\u003c/p>\n          \u003cdiv class=\"ho-row\">${actions(h, { back: false })}\u003c/div>\n          \u003cdetails${h.status === 'failed' ? ' open' : ''}>\u003csummary>Branch, worktree and what happened\u003c/summary>${AFTER.facts(h)}${AFTER.timeline(h)}\u003c/details>\n        \u003c/div>`;\n      }\n\n      // B, in the topbar: only there while something is in T3 Code.\n      function button() {\n        const list = AFTER.handOffs();\n        if (list.length === 0) {\n          shown = false;\n          return '';\n        }\n        const isNew = shown === false;\n        shown = true;\n        const waiting = AFTER.waiting(list);\n        return `\u003cbutton type=\"button\" class=\"ho-hbtn${waiting && !AFTER.offline() ? ' is-waiting' : ''}${isNew ? ' is-new' : ''}\" data-toggle aria-expanded=\"${state.open}\" aria-haspopup=\"true\">\n          ${AFTER.offline() ? icon('plug') : `\u003cspan class=\"ho-dots\">${AFTER.byUrgency(list).map(dot).join('')}\u003c/span>`}\n          ${list.length} in T3 Code${waiting ? `\u003cspan class=\"ho-wait\">· ${waiting} need${waiting === 1 ? 's' : ''} you\u003c/span>` : ''}${icon('chevron')}\u003c/button>`;\n      }\n\n      const GROUPS = [\n        ['Waiting on you', ['input', 'failed']],\n        ['In T3 Code', ['starting', 'working']],\n        ['Done', ['done']],\n      ];\n\n      function row(h, s) {\n        return `\u003cdiv class=\"ho-drow\">${dot(h)}\n          \u003cdiv>\u003cdiv class=\"ho-drow-top\">\u003cstrong>${esc(AFTER.label(h))}\u003c/strong>\u003cspan class=\"ho-when\">${esc(sinceText(h))}\u003c/span>\u003c/div>\n          ${AFTER.whereHtml(h)}\u003cp class=\"ho-line\">${h.stale ? `${AFTER.STATUS[h.status].word} · ` : ''}${esc(h.line)}\u003c/p>\u003c/div>\n          \u003cdiv class=\"ho-row\">${actions(h, { compact: true })}\u003c/div>\u003c/div>`;\n      }\n\n      function dropdown(s) {\n        const list = AFTER.handOffs();\n        if (!state.open || list.length === 0) return '';\n        const body = GROUPS.map(([title, st]) => {\n          const rows = list.filter((h) => st.includes(h.status));\n          return rows.length ? `\u003cdiv class=\"ho-group\">${title}\u003c/div>${rows.map((h) => row(h, s)).join('')}` : '';\n        }).join('');\n        return `\u003cdiv class=\"ho-drop\" role=\"dialog\" aria-label=\"Hand-offs\">\n          \u003cdiv class=\"ho-drop-head\">${icon('flight')}\u003cb>Hand-offs\u003c/b>\u003cspan class=\"ho-count\">${list.length} across all maps\u003c/span>\u003cspan class=\"grow\">\u003c/span>\n            \u003cbutton type=\"button\" class=\"iconbtn\" data-toggle aria-label=\"Close\">${icon('up')}\u003c/button>\u003c/div>\n          \u003cdiv class=\"ho-drop-body\">${AFTER.offline() ? `\u003cdiv class=\"ho-offline\">${icon('plug')}\u003cspan class=\"grow\">\u003cb>T3 Code isn't running.\u003c/b> Last report 14 min ago.\u003c/span>\u003c/div>` : ''}${body}\u003c/div>\u003c/div>`;\n      }\n\n      function inFlightChip() {\n        const n = AFTER.handOffs().filter((h) => h.kind === 'ticket' && !h.repo).length;\n        return n ? `\u003cspan class=\"filter-sep\" role=\"none\">\u003c/span>\u003cbutton type=\"button\" class=\"fchip\" style=\"--accent: var(--state-claimed)\">${icon('pulse')}In T3 Code \u003cb>${n}\u003c/b>\u003c/button>` : '';\n      }\n\n      // Clicking outside closes the dropdown.\n      document.addEventListener('click', (e) => {\n        if (state.open && !e.target.closest('.ho-drop, [data-toggle], .ho-proto')) {\n          state.open = false;\n          AFTER.paint();\n        }\n      });\n\n      AFTER.start((s) => {\n        const right = button();\n        const page =\n          s.view === 'home'\n            ? `\u003cdiv class=\"app has-side\">${AFTER.side(s)}\u003cdiv class=\"main\">${AFTER.topbar(s, { right })}${AFTER.homePage()}\u003c/div>\u003c/div>`\n            : `\u003cdiv class=\"app\">${AFTER.rail(s)}\u003cdiv class=\"main\">${AFTER.topbar(s, { right })}${AFTER.mapPage({ badge, slot: card(), filterExtra: inFlightChip() })}\u003c/div>\u003c/div>`;\n        return page + dropdown(s);\n      });\n    \u003c/script>\n  \u003c/body>\n\u003c/html>\n","A":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n  \u003chead>\u003cscript>window.__Q = \"__Q__\";\u003c/script>\n    \u003cmeta charset=\"utf-8\" />\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n    \u003ctitle>A · Stays on the ticket\u003c/title>\n    \u003c!-- PROTOTYPE (#45), direction A: the hand-off lives where you started it. The button turns into a live card, the node carries the status, and Home's In flight strip is the only list. -->\n    \u003cstyle>\n/*\r\n  Colors come from the validated reference palette. Ticket state is the only thing\r\n  carrying hue: three hues plus neutral, each shipped with an icon and a word, so the\r\n  chart never asks color alone to carry meaning. Ticket type rides a monogram and a\r\n  label instead of a fourth hue, which would fail the all-pairs separation gate.\r\n*/\r\n.viz-root {\r\n  color-scheme: light;\r\n  --surface-1: #fcfcfb;\r\n  --plane: #f4f4f1;\r\n  --text-primary: #0b0b0b;\r\n  --text-secondary: #52514e;\r\n  --text-muted: #898781;\r\n  --gridline: #dcdbd3;\r\n  --baseline: #c3c2b7;\r\n  --hairline: rgba(11, y);\r\n}\r\n\r\n.menu-item:hover {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.menu-item.is-on {\r\n  color: var(--text-primary);\r\n  font-weight: 600;\r\n}\r\n\r\n.menu-item .grow {\r\n  flex: 1;\r\n  min-width: 0;\r\n  white-space: nowrap;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n}\r\n\r\n.menu-sep {\r\n  height: 1px;\r\n  background: var(--hairline);\r\n  margin: 6px 0;\r\n}\r\n\r\n.miniring {\r\n  width: 18px;\r\n  height: 18px;\r\n  flex: none;\r\n  transform: rotate(-90deg);\r\n}\r\n\r\n.keyrow {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding: 3px 0;\r\n  font-size: 12.5px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.keyrow .i {\r\n  width: 14px;\r\n  height: 14px;\r\n}\r\n\r\n.keyrow b {\r\n  flex: none;\r\n  width: 76px;\r\n  font-weight: 500;\r\n  color: var(--text-primary);\r\n}\r\n\r\n.keyrow.is-type .i {\r\n  color: var(--text-secondary);\r\n}\r\n\r\n/* ---------- layout ---------- */\r\n\r\n.app {\r\n  height: 100%;\r\n  display: grid;\r\n  grid-template-columns: 56px minmax(0, 1fr);\r\n}\r\n\r\n.rail {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  gap: 4px;\r\n  padding: 12px 0;\r\n  background: var(--surface-1);\r\n  border-right: 1px solid var(--hairline);\r\n}\r\n\r\n.rail .logo {\r\n  margin-bottom: 14px;\r\n}\r\n\r\n.rail-btn {\r\n  position: relative;\r\n  width: 38px;\r\n  height: 38px;\r\n  display: grid;\r\n  place-items: center;\r\n  border: 0;\r\n  border-radius: 10px;\r\n  background: none;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.rail-btn .i {\r\n  width: 18px;\r\n  height: 18px;\r\n}\r\n\r\n.rail-btn:hover {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.rail-btn.is-on {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.rail-btn.is-on::before {\r\n  content: '';\r\n  position: absolute;\r\n  left: -9px;\r\n  top: 9px;\r\n  bottom: 9px;\r\n  width: 3px;\r\n  border-radius: 0 n  top: 0;\r\n  left: 0;\r\n  width: 1280px;\r\n  height: 800px;\r\n  border: 0;\r\n  transform: scale(var(--thumb-scale, 0.25));\r\n  transform-origin: top left;\r\n  pointer-events: none;\r\n}\r\n\r\n.proto-open {\r\n  position: absolute;\r\n  right: 10px;\r\n  bottom: 10px;\r\n  padding: 5px 11px;\r\n  border-radius: 999px;\r\n  background: var(--state-claimed);\r\n  color: #fff;\r\n  font-size: 12px;\r\n  font-weight: 600;\r\n  opacity: 0;\r\n  transform: translateY(4px);\r\n  transition: opacity 140ms, transform 140ms;\r\n}\r\n\r\n.proto-thumb:hover .proto-open,\r\n.proto-thumb:focus-visible .proto-open {\r\n  opacity: 1;\r\n  transform: none;\r\n}\r\n\r\n.proto-thumb:focus-visible {\r\n  outline: 2px solid var(--state-claimed);\r\n  outline-offset: -2px;\r\n}\r\n\r\n.proto-thumb.is-empty {\r\n  display: grid;\r\n  place-items: center;\r\n  color: var(--text-muted);\r\n  font-size: 13px;\r\n}\r\n\r\n.proto-tile-body {\r\n  display: grid;\r\n  gap: 6px;\r\n  padding: 14px 16px 16px;\r\n}\r\n\r\n.proto-tile-body .eyebrow {\r\n  margin: 0;\r\n}\r\n\r\n.proto-tile-body h2 {\r\n  margin: 0;\r\n  font-size: 15px;\r\n  line-height: 1.35;\r\n}\r\n\r\n.proto-tile-body h2 a {\r\n  color: inherit;\r\n  text-decoration: none;\r\n}\r\n\r\n.proto-tile-body h2 a:hover {\r\n  color: var(--state-claimed);\r\n}\r\n\r\n.proto-gist {\r\n  margin: 0;\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n  display: -webkit-box;\r\n  -webkit-line-clamp: 2;\r\n  -webkit-box-orient: vertical;\r\n  overflow: hidden;\r\n}\r\n\r\n.proto-tile-foot {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 14px;\r\n  margin-top: 4px;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.proto-tile-foot a,\r\n.proto-tile-foot .linkish {\r\n  color: var(--text-secondary);\r\n  font-size: 12px;\r\n}\r\n\r\n.proto-tile-foot a:hover,\r\n.proto-tile-foot .linkish:hover {\r\n  color: var(--state-claimed);\r\n}\r\n\r\n/* In the narrow ticket panel the tile sits flush in its section. */\r\n.ticket-proto .proto-tile {\r\n  border: 0;\r\n  border-radius: 0;\r\n}\r\n\r\n\r\n\r\n/* ---------- repository badge with GitHub avatar / T3 Code initial ---------- */\r\n\r\n.repo-icon-badge {\r\n  position: relative;\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  width: 20px;\r\n  height: 20px;\r\n  border-radius: 5px;\r\n  overflow: hidden;\r\n  flex: none;\r\n  user-select: none;\r\n  vertical-align: middle;\r\n}\r\n\r\n.repo-icon-badge.is-sm {\r\n  width: 16px;\r\n  height: 16px;\r\n  border-radius: 4px;\r\n}\r\n\r\n.repo-icon-badge.is-lg {\r\n  width: 32px;\r\n  height: 32px;\r\n  border-radius: 8px;\r\n}\r\n\r\n.repo-icon-badge .repo-monogram {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  width: 100%;\r\n  height: 100%;\r\n}\r\n\r\n.repo-icon-badge .repo-monogram-svg {\r\n  width: 100%;\r\n  height: 100%;\r\n  display: block;\r\n}\r\n\r\n.repo-icon-badge .repo-icon-img {\r\n  position: absolute;\r\n  inset: 0;\r\n  width: 100%;\r\n  height: 100%;\r\n  object-fit: contain;\r\n  border-radius: inherit;\r\n  z-index: 1;\r\n}\r\n\r\n:root[data-theme=\"light\"] .repo-monogram-svg,\r\n@media (prefers-color-scheme: light) {\r\n  :root:not([data-theme=\"dark\"]) .repo-monogram-svg {\r\n    filter: brightness(0.85) contrast(1.1);\r\n  }\r\n}\r\n\r\n.page-title-row {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n}\r\n\r\n.page-title-row h1 {\r\n  margin: 0;\r\n}\r\n\r\n.repo-pill {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n}\r\n\r\n.repo-option {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n\n\u003c/style>\n    \u003cstyle>\n/* PROTOTYPE (#45): pieces every after-hand-off variant shares. Tokens come from src/ui/styles.css. */\r\n\r\n.viz-root {\r\n  --ho-failed: #d13636;\r\n}\r\n:root[data-theme='dark'] .viz-root {\r\n  --ho-failed: #f06a6a;\r\n}\r\n\r\n#root,\r\n#root > .app {\r\n  height: 100%;\r\n}\r\n\r\n.grow {\r\n  flex: 1;\r\n  min-width: 0;\r\n}\r\n\r\ncode {\r\n  font: 12px ui-monospace, 'Cascadia Code', Consolas, monospace;\r\n}\r\n\r\n/* ---------- status pill, dot, spinner ---------- */\r\n\r\n.ho-pill {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  height: 22px;\r\n  padding: 0 8px;\r\n  border-radius: 999px;\r\n  font-size: 11.5px;\r\n  font-weight: 600;\r\n  white-space: nowrap;\r\n  color: color-mix(in srgb, var(--tone) 78%, var(--text-primary));\r\n  background: color-mix(in srgb, var(--tone) 13%, transparent);\r\n  border: 1px solid color-mix(in srgb, var(--tone) 30%, transparent);\r\n}\r\n.ho-pill .i {\r\n  width: 12px;\r\n  height: 12px;\r\n}\r\n.ho-pill i {\r\n  font-style: normal;\r\n  font-weight: 500;\r\n  opacity: 0.8;\r\n}\r\n.ho-pill.is-lg {\r\n  height: 28px;\r\n  padding: 0 11px;\r\n  font-size: 13px;\r\n}\r\n.ho-pill.is-stale {\r\n  color: var(--text-muted);\r\n  background: transparent;\r\n  border-style: dashed;\r\n  border-color: var(--baseline);\r\n}\r\n.ho-pill.is-live .i {\r\n  animation: ho-beat 1.4s ease-in-out infinite;\r\n}\r\n\r\n.ho-dot {\r\n  flex: none;\r\n  width: 8px;\r\n  height: 8px;\r\n  border-radius: 50%;\r\n  background: var(--tone);\r\n}\r\n.ho-dot.is-live {\r\n  box-shadow: 0 0 0 0 color-mix(in srgb, var(--tone) 60%, transparent);\r\n  animation: ho-ping 1.6s ease-out infinite;\r\n}\r\n.ho-dot.is-stale {\r\n  background: transparent;\r\n  border: 1.5px dashed var(--text-muted);\r\n}\r\n\r\n.ho-spin {\r\n  flex: none;\r\n  width: 11px;\r\n  height: 11px;\r\n  border-radius: 50%;\r\n  border: 2px solid color-mix(in srgb, currentColor 25%, transparent);\r\n  border-top-color: currentColor;\r\n  animation: ho-rot 0.8s linear infinite;\r\n}\r\n\r\n@keyframes ho-rot {\r\n  to {\r\n    transform: rotate(360deg);\r\n  }\r\n}\r\n@keyframes ho-beat {\r\n  50% {\r\n    opacity: 0.35;\r\n  }\r\n}\r\n@keyframes ho-ping {\r\n  to {\r\n    box-shadow: 0 0 0 7px transparent;\r\n  }\r\n}\r\n@media (prefers-reduced-motion: reduce) {\r\n  .ho-spin,\r\n  .ho-pill.is-live .i,\r\n  .ho-dot.is-live {\r\n    animation: none;\r\n  }\r\n}\r\n\r\n/* ---------- small shared bits ---------- */\r\n\r\n.ho-sm {\r\n  height: 28px;\r\n  padding: 0 10px;\r\n  font-size: 12.5px;\r\n}\r\n.ho-row {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n.ho-back {\r\n  margin-left: auto;\r\n  font-size: 12.5px;\r\n}\r\n.ho-line {\r\n  margin: 2px 0 0;\r\n  color: var(--text-secondary);\r\n  font-size: 12.5px;\r\n  line-height: 1.45;\r\n}\r\n.ho-when,\r\n.ho-count {\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n  white-space: nowrap;\r\n}\r\n.ho-where {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n}\r\n.ho-where-map {\r\n  display: flex;\r\n  min-width: 0;\r\n  max-width: 100%;\r\n  font-size: 11.5px;\r\n}\r\n.ho-where-map .ho-mark {\r\n  width: 15px;\r\n  height: 15px;\r\n  font-size: 7px;\r\n  border-radius: 4px;\r\n}\r\n.ho-where-repo {\r\n  color: var(--text-secondary);\r\n  white-space: nowrap;\r\n}\r\n.ho-where-sep {\r\n  opacity: 0.6;\r\n}\r\n.ho-where-title {\r\n  min-width: 0;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n.ho-where .i {\r\n  width: 12px;\r\n  height: 12px;\r\n}\r\n.ho-facts code {\r\n  min-width: 0;\r\n  font-size: 11.5px;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n.ho-facts dd .linkish {\r\n  margin: 0;\r\n}\r\n\r\n.ho-offline {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  padding: 9px 12px;\r\n  border: 1px dashed var(--baseline);\r\n  border-radius: 10px;\r\n  background: var(--wash);\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n}\r\n.ho-offline > .i {\r\n  color: var(--text-muted);\r\n}\r\n.ho-offline b {\r\n  color: var(--text-primary);\r\n}\r\n.ho-stage-banner {\r\n  position: absolute;\r\n  z-index: 5;\r\n  left: 16px;\r\n  right: 16px;\r\n  top: 12px;\r\n}\r\n.ho-stage-banner .ho-offline {\r\n  background: var(--surface-1);\r\n  box-shadow: var(--shadow);\r\n}\r\n\r\n.ho-prose h3 {\r\n  margin: 18px 0 6px;\r\n  font-size: 12px;\r\n  text-transform: uppercase;\r\n  letter-spacing: 0.06em;\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- timeline ---------- */\r\n\r\n.ho-timeline {\r\n  list-style: none;\r\n  margin: 0;\r\n  padding: 0;\r\n}\r\n.ho-timeline li {\r\n  --c: var(--baseline);\r\n  position: relative;\r\n  display: flex;\r\n  gap: 12px;\r\n  padding: 0 0 14px 22px;\r\n  font-size: 13px;\r\n}\r\n.ho-timeline li::before {\r\n  content: '';\r\n  position: absolute;\r\n  left: 5px;\r\n  top: 14px;\r\n  bottom: -2px;\r\n  width: 2px;\r\n  background: var(--hairline);\r\n}\r\n.ho-timeline li:last-child::before {\r\n  display: none;\r\n}\r\n.ho-tl-dot {\r\n  position: absolute;\r\n  left: 0;\r\n  top: 4px;\r\n  width: 12px;\r\n  height: 12px;\r\n  border-radius: 50%;\r\n  border: 2px solid var(--c);\r\n  background: var(--surface-1);\r\n}\r\n.ho-timeline li.is-done {\r\n  --c: var(--text-muted);\r\n}\r\n.ho-timeline li.is-done .ho-tl-dot {\r\n  background: var(--c);\r\n}\r\n.ho-timeline li.is-live {\r\n  --c: var(--state-claimed);\r\n}\r\n.ho-timeline li.is-live .ho-tl-dot {\r\n  animation: ho-ping 1.6s ease-out infinite;\r\n  box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent);\r\n}\r\n.ho-timeline li.is-stale {\r\n  --c: var(--text-muted);\r\n}\r\n.ho-timeline li.is-stale .ho-tl-dot {\r\n  animation: none;\r\n  border-style: dashed;\r\n}\r\n.ho-timeline li.is-wait {\r\n  --c: var(--state-blocked);\r\n}\r\n.ho-timeline li.is-good {\r\n  --c: var(--state-frontier);\r\n}\r\n.ho-timeline li.is-bad {\r\n  --c: var(--ho-failed);\r\n}\r\n.ho-timeline li.is-wait .ho-tl-dot,\r\n.ho-timeline li.is-good .ho-tl-dot,\r\n.ho-timeline li.is-bad .ho-tl-dot {\r\n  background: var(--c);\r\n}\r\n.ho-timeline b {\r\n  display: block;\r\n  font-weight: 600;\r\n}\r\n.ho-time ;\r\n}\r\n\r\n/* ---------- sidebar (#42 D) ---------- */\r\n\r\n.app.has-side {\r\n  grid-template-columns: 256px minmax(0, 1fr);\r\n}\r\n.ho-side {\r\n  display: flex;\r\n  flex-direction: column;\r\n  min-height: 0;\r\n  background: var(--surface-1);\r\n  border-right: 1px solid var(--hairline);\r\n  font-size: 13px;\r\n}\r\n.ho-side-head {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  height: 56px;\r\n  padding: 0 13px;\r\n  border-bottom: 1px solid var(--hairline);\r\n}\r\n.ho-side-actions {\r\n  display: grid;\r\n  gap: 6px;\r\n  padding: 12px 10px 6px;\r\n}\r\n.ho-side-actions .primary {\r\n  justify-content: center;\r\n  text-decoration: none;\r\n}\r\n.ho-side .search {\r\n  width: auto;\r\n  margin: 0;\r\n}\r\n.ho-tree {\r\n  flex: 1;\r\n  overflow: auto;\r\n  padding: 6px 8px 12px;\r\n}\r\n.ho-tlabel {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  padding: 14px 8px 6px;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  letter-spacing: 0.08em;\r\n  text-transform: uppercase;\r\n  color: var(--text-muted);\r\n}\r\n.ho-trow {\r\n  position: relative;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  min-height: 30px;\r\n  padding: 0 8px;\r\n  border-radius: 7px;\r\n  color: var(--text-secondary);\r\n  text-decoration: none;\r\n  white-space: nowrap;\r\n}\r\n.ho-trow:hover {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n.ho-trow .grow {\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n}\r\n.ho-trow > .i {\r\n  width: 14px;\r\n  height: 14px;\r\n  flex: none;\r\n}\r\n.ho-trow.is-on {\r\n  background: color-mix(in srgb, var(--state-claimed) 12%, transparent);\r\n  color: var(--text-primary);\r\n  font-weight: 600;\r\n}\r\n.ho-trow.is-on::before {\r\n  content: '';\r\n  position: absolute;\r\n  left: -8px;\r\n  top: 7px;\r\n  bottom: 7px;\r\n  width: 3px;\r\n  border-radius: 0 3px 3px 0;\r\n  background: var(--state-claimed);\r\n}\r\n.ho-trow.is-trail {\r\n  color: var(--text-primary);\r\n  font-weight: 600;\r\n}\r\n.ho-kids {\r\n  margin-left: 15px;\r\n  padding-left: 9px;\r\n  border-left: 1px solid var(--hairline);\r\n}\r\n.ho-mark {\r\n  --h: 212;\r\n  flex: none;\r\n  display: inline-grid;\r\n  place-items: center;\r\n  width: 18px;\r\n  height: 18px;\r\n  border-radius: 5px;\r\n  font-size: 8px;\r\n  font-weight: 700;\r\n  color: hsl(var(--h) 60% 35%);\r\n  background: hsl(var(--h) 60% 50% / 0.16);\r\n}\r\n.crumbs .ho-mark {\r\n  margin-right: 6px;\r\n}\r\n.ho-side-foot {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding: 10px 12px;\r\n  border-top: 1px solid var(--hairline);\r\n}\r\n.ho-side-foot .rail-mark {\r\n  margin: 0;\r\n}\r\n.ho-ptitle {\r\n  font-size: 14px;\r\n  font-weight: 600;\r\n  white-space: nowrap;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n}\r\n.crumbs {\r\n  display: flex;\r\n  align-items: center;\r\n}\r\n\r\n/* ---------- the Prototype bar ---------- */\r\n\r\n.ho-proto {\r\n  position: fixed;\r\n  z-index: 90;\r\n  left: 50%;\r\n  bottom: 14px;\r\n  transform: translateX(-50%);\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 4px;\r\n  padding: 5px;\r\n  border: 1.5px dashed #b07cff;\r\n  border-radius: 12px;\r\n  background: color-mix(in srgb, var(--surface-1) 94%, #b07cff);\r\n  box-shadow: var(--shadow);\r\n  font-size: 12px;\r\n  white-space: nowrap;\r\n}\r\n.ho-proto-tag {\r\n  padding: 3px 7px;\r\n  border-radius: 7px;\r\n  background: #b07cff;\r\n  color: #fff;\r\n  font-weight: 700;\r\n  font-size: 10.5px;\r\n  letter-spacing: 0.06em;\r\n  text-transform: uppercase;\r\n}\r\n.ho-proto-lbl {\r\n  padding: 0 4px 0 6px;\r\n  color: var(--text-muted);\r\n}\r\n.ho-proto button {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  height: 26px;\r\n  padding: 0 9px;\r\n  border: 0;\r\n  border-radius: 7px;\r\n  background: none;\r\n  color: var(--text-secondary);\r\n}\r\n.ho-proto button:hover {\r\n  background: var(--wash);\r\n}\r\n.ho-proto button.is-on {\r\n  background: var(--text-primary);\r\n  color: var(--surface-1);\r\n}\r\n.ho-proto .i {\r\n  width: 12px;\r\n  height: 12px;\r\n}\r\n.ho-proto-sep {\r\n  width: 1px;\r\n  height: 18px;\r\n  margin: 0 3px;\r\n  background: var(--hairline);\r\n}\r\n\n\u003c/style>\n    \u003cstyle>\n      .ho-card {\n        margin-bottom: 16px;\n        padding: 12px;\n        border: 1px solid var(--hairline);\n        border-left: 3px solid var(--tone);\n        border-radius: 12px;\n        background: var(--wash);\n      }\n      .ho-card.is-fresh {\n        animation: ho-arrive 1.2s ease-out;\n      }\n      @keyframes ho-arrive {\n        from {\n          box-shadow: 0 0 0 4px color-mix(in srgb, var(--state-claimed) 35%, transparent);\n        }\n      }\n      .ho-card-head {\n        display: flex;\n        align-items: center;\n        gap: 8px;\n        margin-bottom: 6px;\n      }\n      .ho-card-head .ho-when {\n        margin-left: auto;\n      }\n      .ho-card .ho-line {\n        margin: 0 0 10px;\n      }\n      .ho-card .ho-sent {\n        display: flex;\n        align-items: center;\n        gap: 6px;\n        margin: 0 0 8px;\n        font-size: 12.5px;\n        color: var(--text-secondary);\n      }\n      .ho-card .ho-sent .i {\n        color: var(--state-frontier);\n      }\n      .ho-card details {\n        margin-top: 10px;\n        border-top: 1px solid var(--hairline);\n        padding-top: 8px;\n        font-size: 12.5px;\n      }\n      .ho-card summary {\n        cursor: pointer;\n        color: var(--text-muted);\n        margin-bottom: 8px;\n      }\n      .ho-card .ho-offline {\n        margin-bottom: 10px;\n        padding: 7px 10px;\n        font-size: 12.5px;\n      }\n    \u003c/style>\n  \u003c/head>\n  \u003cbody class=\"viz-root\">\n    \u003cdiv id=\"root\">\u003c/div>\n    \u003cscript>\n/*\n  Optional helpers for pages in variants/. Load it with \u003cscript src=\"../kit/kit.js\">\u003c/script>.\n  It applies the theme and style the canvas passes (?theme=, ?style=), makes links marked\n  data-to=\"…\" explain themselves instead of navigating, fills data-icon=\"name\" from Kit.icons,\n  and gives you Kit.toast and Kit.esc. It knows nothing about any project: put fake data and\n  icons in your own file (see variants/ for an example).\n*/\nwindow.Kit = (() => {\n  const params = new URLSearchParams(window.__Q ?? location.search);\n  const theme = params.get('theme');\n  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;\n\n  // A named style from config.js. Same rules canvas.js writes for its own items.\n  const decls = (vars) =>\n    Object.entries(vars ?? {})\n      .map(([key, value]) => `${key.startsWith('--') ? key : `--${key}`}:${value};`)\n      .join('');\n  try {\n    const style = JSON.parse(params.get('style') ?? 'null');\n    if (style) {\n      for (const href of [...(style.stylesheets ?? []), ...(style.fonts ?? [])]) {\n        const link = document.createElement('link');\n        link.rel = 'stylesheet';\n        link.href = href;\n        document.head.append(link);\n      }\n      const body = `body${style.bodyClass ? `.${style.bodyClass}` : ''}`;\n      const el = document.createElement('style');\n      el.textContent = `:root,:root ${body}{${decls(style.vars)}}:root ${body}{${style.font ? `font-family:${style.font};` : ''}}\n        :root[data-theme='dark'],:root[data-theme='dark'] ${body}{${decls({ ...style.vars, ...style.dark })}}\n        ${style.css ?? ''}`;\n      document.head.append(el);\n    }\n  } catch {\n    console.warn('Ignoring a style the canvas could not parse.');\n  }\n\n  const esc = (text) => String(text ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n  /** Inner SVG markup by name, drawn on a 24px grid in currentColor. Add your own: Kit.icons.star = '\u003cpath …/>'. */\n  const icons = {};\n  const icon = (name) =>\n    `\u003csvg class=\"i\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${\n      icons[name] ?? ''\n    }\u003c/svg>`;\n\n  function fillIcons(root = document) {\n    for (const el of root.querySelectorAll('[data-icon]')) el.innerHTML = icon(el.dataset.icon);\n  }\n\n  const toastCss = document.createElement('style');\n  toastCss.textContent = `#kit-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;padding:9px 14px;border-radius:8px;\n    background:#1b1b1a;color:#f3f2ee;font:13px/1.4 system-ui,sans-serif;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}#kit-toast[hidden]{display:none}`;\n  document.head.append(toastCss);\n\n  let timer;\n  function toast(message) {\n    let el = document.getElementById('kit-toast');\n    if (!el) {\n      el = document.createElement('div');\n      el.id = 'kit-toast';\n      el.setAttribute('role', 'status');\n      document.body.append(el);\n    }\n    el.textContent = message;\n    el.hidden = false;\n    clearTimeout(timer);\n    timer = setTimeout(() => (el.hidden = true), 2600);\n  }\n\n  // A prototype has nowhere real to go: say where a link would lead instead.\n  document.addEventListener('click', (event) => {\n    const link = event.target.closest('[data-to]');\n    if (!link) return;\n    event.preventDefault();\n    toast(`Would open ${link.dataset.to}`);\n  });\n\n  document.addEventListener('DOMContentLoaded', () => fillIcons());\n\n  return { icons, icon, fillIcons, toast, esc };\n})();\n\n\u003c/script>\n    \u003cscript>\n/*\r\n  PROTOTYPE (#45): shared fake data, T3 Code states, chrome and page bodies for the\r\n  after-hand-off variants. Load after ../kit/kit.js. A variant calls AFTER.start(render),\r\n  where render(state) returns the whole page; everything here is the same in every variant.\r\n\r\n  The focus hand-off is ticket #55. Its T3 Code state is faked by th
