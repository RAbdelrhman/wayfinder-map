    <style>

* { box-sizing: border-box; }

.prototype-page { min-height: 100vh; margin-left: 58px; }.prototype-topbar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 18px; height: 58px; padding: 0 28px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(10px); }.where { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); white-space: nowrap; }.where i { color: #a9b1be; font-style: normal; }.where strong { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }.home-crumb { color: var(--muted); text-decoration: none; }.home-crumb:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }.map-switch { max-width: 230px; overflow: hidden; text-overflow: ellipsis; border: 0; border-left: 1px solid var(--line); background: none; color: var(--ink); padding-left: 14px; white-space: nowrap; cursor: pointer; }.map-switch .i { width: 14px; height: 14px; margin-left: 5px; color: var(--muted); }.prototype-search { display: flex; align-items: center; gap: 8px; width: min(340px, 38vw); height: 34px; margin-left: auto; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--muted); }.prototype-search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent); }.prototype-search .i { width: 15px; height: 15px; flex: none; }.prototype-search input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); }.prototype-search kbd { border-radius: 4px; background: #eef1f5; padding: 1px 5px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.prototype-main { width: min(1120px, calc(100% - 56px)); margin: 0 auto; padding: 28px 0 56px; }.home-main { width: min(980px, calc(100% - 56px)); }.home-tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }.home-tabs a { padding: 9px 12px 10px; color: var(--muted); text-decoration: none; }.home-tabs a:hover { color: var(--ink); }.home-tabs a.is-on { margin-bottom: -1px; border-bottom: 2px solid var(--blue); color: var(--ink); font-weight: 650; }.page-heading { margin-bottom: 20px; }.page-heading h1, .map-head h1 { margin: 0 0 5px; font-size: 25px; line-height: 1.2; letter-spacing: -0.035em; }.page-heading p, .map-head > div > p:last-child { margin: 0; color: var(--muted); }.page-heading.with-action, .map-head { display: flex; align-items: start; justify-content: space-between; gap: 24px; }.text-action { padding: 7px 10px; border-radius: 7px; color: var(--blue); text-decoration: none; white-space: nowrap; }.text-action:hover { background: var(--blue-wash); }

.repository-main { padding-top: 34px; }.map-card.compact { min-height: 118px; }.map-head { margin-bottom: 22px; }.map-id { margin: 0 0 4px; color: var(--blue) !important; font-size: 12px; font-weight: 700; }.map-preview { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 250px; min-height: 450px; overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); }.preview-filters { position: absolute; top: 18px; left: 18px; z-index: 1; display: flex; gap: 6px; }.filter { padding: 5px 8px; border: 1px solid transparent; border-radius: 6px; color: var(--muted); font-size: 12px; }.filter.active { border-color: #c7d9f7; background: var(--blue-wash); color: var(--blue); }.preview-stage { position: relative; overflow: hidden; border-right: 1px solid var(--line); background-image: radial-gradient(#e1e7f0 1px, transparent 1px); background-size: 16px 16px; }.preview-node { position: absolute; display: grid; place-items: center; width: 70px; height: 44px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); box-shadow: 0 3px 10px rgba(20, 34, 52, 0.08); font-size: 13px; font-weight: 700; }.preview-node.done { top: 170px; left: 14%; color: var(--muted); }.preview-node.next { top: 240px; left: 45%; border-color: #a9ddbd; color: var(--green); }.preview-node.open { top: 130px; right: 15%; border-color: #a7c7f5; color: var(--blue); }.preview-line { position: absolute; height: 1px; background: #b7c3d3; transform-origin: left; }.line-one { top: 191px; left: 24%; width: 175px; transform: rotate(21deg); }.line-two { top: 255px; left: 55%; width: 130px; transform: rotate(-36deg); }.preview-inspector { padding: 28px 20px; color: var(--muted); }.preview-inspector strong { display: block; margin-bottom: 26px; color: var(--ink); }.preview-inspector p { margin: 0 0 4px; font-size: 12px; }.preview-inspector b { display: block; color: var(--ink); font-size: 13px; font-weight: 500; }.preview-inspector a { display: inline-block; margin-top: 28px; color: var(--blue); font-size: 13px; text-decoration: none; }
.help-main { width: min(680px, calc(100% - 56px)); }.how-list { display: grid; gap: 0; margin: 26px 0 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }.how-list li { display: grid; grid-template-columns: 28px 1fr; gap: 14px; padding: 19px; border-bottom: 1px solid var(--line); }.how-list li:last-child { border-bottom: 0; }.how-list span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--blue-wash); color: var(--blue); font-size: 12px; font-weight: 700; }.how-list strong { display: block; margin-bottom: 2px; }.how-list p { margin: 0; color: var(--muted); }
@media (max-width: 760px) { .prototype-page { margin-left: 48px; }.rail { width: 48px; }.prototype-topbar { height: auto; min-height: 56px; padding: 10px 16px; flex-wrap: wrap; }.where { width: 100%; }.prototype-search { width: 100%; margin-left: 0; }.prototype-main, .home-main, .help-main { width: min(100% - 32px, 1120px); padding-top: 20px; }.page-heading.with-action { flex-direction: column; }.map-card, .repository-card { grid-template-columns: 1fr 20px; gap: 14px; }.map-card-meta, .repo-progress { grid-column: 1; justify-items: start; }.map-preview { grid-template-columns: 1fr; }.preview-stage { min-height: 320px; border-right: 0; border-bottom: 1px solid var(--line); }.preview-inspector { min-height: 190px; }.preview-filters { flex-wrap: wrap; }.map-head { flex-direction: column; } }
