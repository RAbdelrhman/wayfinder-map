\r\n  ];\r\n  const EDGES = [\r\n    [41, 45],\r\n    [41, 55],\r\n    [44, 48],\r\n    [45, 49],\r\n    [55, 56],\r\n    [49, 56],\r\n    [48, 54],\r\n  ];\r\n  const NODE_W = 236;\r\n  const NODE_H = 104;\r\n  const pos = (t) => ({ x: 28 + t.col * (NODE_W + 70), y: 28 + t.row * (NODE_H + 20) });\r\n\r\n  /** A ticket's state while it is handed off: #55 is claimed from the moment it leaves. */\r\n  const ticketState = (t) => (t.number === 55 && state.handedOff ? 'claimed' : t.state);\r\n\r\n  function nodeHtml(t, { badge, selected }) {\r\n    const st = STATES[ticketState(t)];\r\n    const p = pos(t);\r\n    const b = badge ? badge(t) : '';\r\n    return `\u003cbutton type=\"button\" class=\"node${ticketState(t) === 'done' ? ' is-done' : ''}${selected === t.number ? ' is-selected' : ''}${b ? ' ho-has-badge' : ''}\" data-to=\"ticket #${t.number} in the ticket panel\" style=\"--accent: var(${st.v}); left:${p.x}px; top:${p.y}px; width:${NODE_W}px; height:${NODE_H}px\">\r\n      \u003cspan class=\"node-top\">\u003cspan class=\"glyph\">${icon(TYPES[t.type][1])}\u003c/span>\u003cspan class=\"num\">#${t.number}\u003c/span>\u003cspan class=\"chip\" style=\"--accent: var(${st.v})\">${icon(st.icon)}${st.label}\u003c/span>\u003c/span>\r\n      \u003cspan class=\"title\">${esc(t.title)}\u003c/span>${b || `\u003cspan class=\"meta\">${ticketState(t) === 'claimed' || ticketState(t) === 'done' ? '@RAbdelrhman' : TYPES[t.type][0]}\u003c/span>`}\u003c/button>`;\r\n  }\r\n\r\n  function edgesSvg() {\r\n    const at = Object.fromEntries(TICKETS.map((t) => [t.number, pos(t)]));\r\n    return EDGES.map(([a, b]) => {\r\n      const x1 = at[a].x + NODE_W;\r\n      const y1 = at[a].y + NODE_H / 2;\r\n      const x2 = at[b].x;\r\n      const y2 = at[b].y + NODE_H / 2;\r\n      const m = (x1 + x2) / 2;\r\n      return `\u003cpath d=\"M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}\"/>`;\r\n    }).join('');\r\n  }\r\n\r\n  /** Filters row; `extra` is a variant's own chip. */\r\n  const filters = (extra = '') =>\r\n    `\u003cdiv class=\"filters\">\u003cbutton type=\"button\" class=\"fchip is-on\">All \u003cb>${TICKETS.length}\u003c/b>\u003c/button>${['frontier', 'claimed', 'blocked', 'done']\r\n      .map((s) => `\u003cbutton type=\"button\" class=\"fchip\" style=\"--accent: var(${STATES[s].v})\">${icon(STATES[s].icon)}${{ frontier: 'Next up', claimed: 'Claimed', blocked: 'Blocked', done: 'Done' }[s]} \u003cb>${TICKETS.filter((t) => ticketState(t) === s).length}\u003c/b>\u003c/button>`)\r\n      .join('')}${extra}\u003c/div>`;\r\n\r\n  /** The ticket panel for #55. `slot` replaces the launch block. */\r\n  function ticketPanel(slot) {\r\n    const t = TICKETS.find((x) => x.number === 55);\r\n    const st = STATES[ticketState(t)];\r\n    return `\u003caside class=\"inspector\">\u003cdiv class=\"insp-tabs\">\u003cdiv class=\"segmented\">\u003cbutton class=\"seg\">Brief\u003c/button>\u003cbutton class=\"seg is-on\">Ticket\u003c/button>\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"insp-panel\">\r\n        \u003cdiv class=\"dhead\">\u003cspan class=\"glyph\">${icon('list')}\u003c/span>\u003cspan class=\"num\">#55\u003c/span>\u003cspan class=\"chip\" style=\"--accent: var(${st.v})\">${icon(st.icon)}${st.label}\u003c/span>\u003c/div>\r\n        \u003ch2 class=\"dtitle\">${esc(t.title)}\u003c/h2>\r\n        ${slot}\r\n        \u003cdiv class=\"prose ho-prose\">\u003ch3>Question\u003c/h3>\u003cp>Persist a minimal record of every hand-off under \u003ccode>~/.wayfinder-map/\u003c/code> and keep it current from T3 Code's WebSocket, reconciling against \u003ccode>/api/orchestration/snapshot\u003c/code> every minute.\u003c/p>\r\n        \u003ch3>Done when\u003c/h3>\u003cul>\u003cli>Records survive a restart\u003c/li>\u003cli>Branch and PR links are picked up when T3 reports them\u003c/li>\u003cli>Offline shows the last record as stale\u003c/li>\u003c/ul>\u003c/div>\r\n      \u003c/div>\u003c/aside>`;\r\n  }\r\n\r\n  /** Today's launch block: what the panel shows before (or instead of) a hand-off. */\r\n  const launchBlock = () => `\u003cdiv class=\"launch\">\u003cdiv class=\"launch-actions\">\u003cbutton type=\"button\" class=\"primary\" data-handoff>${icon('play')}Open in T3 Code\u003c/button>\u003cbutton type=\"button\" class=\"ghost\" data-to=\"the clipboard\">${icon('copy')}Copy prompt\u003c/button>\u003c/div>\u003c/div>`;\r\n\r\n  function mapPage({ badge, slot, filterExtra = '', overlay = '' } = {}) {\r\n    return `${filters(filterExtra)}\u003cdiv class=\"body\">\u003csection class=\"stage\">${offlineBanner() ? `\u003cdiv class=\"ho-stage-banner\">${offlineBanner()}\u003c/div>` : ''}\u003cdiv class=\"canvas-wrap\">\u003cdiv class=\"canvas\" style=\"width:980px;height:560px\">\u003csvg class=\"edges\" width=\"980\" height=\"560\">${edgesSvg()}\u003c/svg>\u003cdiv class=\"nodes\">${TICKETS.map((t) => nodeHtml(t, { badge, selected: 55 })).join('')}\u003c/div>\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"zoom floatbox\">\u003cbutton class=\"iconbtn\">${icon('minus')}\u003c/button>\u003cbutton class=\"iconbtn pct\">100%\u003c/button>\u003cbutton class=\"iconbtn\">${icon('plus')}\u003c/button>\u003c/div>${overlay}\u003c/section>${ticketPanel(slot ?? launchBlock())}\u003c/div>`;\r\n  }\r\n\r\n  /* ---------- Home (#40): Continue, then In flight ordered by what waits on you ---------- */\r\n\r\n  function flightCard(h) {\r\n    return `\u003cdiv class=\"card ho-fcard\" style=\"--tone:${STATUS[h.status].tone}\">\r\n      \u003cdiv class=\"ho-fcard-top\">${pill(h)}\u003cspan class=\"ho-when\">${esc(sinceText(h))}\u003c/span>\u003c/div>\r\n      \u003cstrong>${esc(label(h))}\u003c/strong>\u003cp class=\"ho-line\">${esc(h.line)}\u003c/p>${whereHtml(h)}\r\n      \u003cdiv class=\"ho-row\">${actions(h, { compact: true })}\u003c/div>\u003c/div>`;\r\n  }\r\n\r\n  function homePage({ strip } = {}) {\r\n    const list = byUrgency(handOffs());\r\n    return `\u003cmain class=\"page\">\u003cdiv class=\"sheet ho-home\">\r\n      \u003cdiv class=\"page-head\">\u003cdiv class=\"grow\">\u003cp class=\"eyebrow\">Home\u003c/p>\u003ch1>Pick up where you left off\u003c/h1>\u003c/div>\u003c/div>\r\n      \u003ca class=\"card ho-continue\" href=\"#\" data-view=\"map\">\u003cspan class=\"ho-cont-ic\">${icon('graph')}\u003c/span>\u003cspan class=\"grow\">\u003cspan class=\"eyebrow\">Continue · wayfinder-map\u003c/span>\u003cstrong>#35 ${esc(MAP.title)}\u003c/strong>\u003cspan class=\"ho-line\">4 next up · 5 claimed\u003c/span>\u003c/span>${icon('arrow')}\u003c/a>\r\n      ${offlineBanner()}\r\n      \u003csection class=\"section\">\u003cdiv class=\"section-head\">\u003ch2>In flight\u003c/h2>\u003cspan class=\"ho-count\">${list.length}${waiting(list) ? ` · ${waiting(list)} waiting on you` : ''}\u003c/span>\u003c/div>\r\n        ${list.length === 0 ? '\u003cp class=\"ho-line\">Nothing in T3 Code right now.\u003c/p>' : strip ? strip(list) : `\u003cdiv class=\"ho-strip\">${list.map(flightCard).join('')}\u003c/div>`}\u003c/section>\r\n    \u003c/div>\u003c/main>`;\r\n  }\r\n\r\n  /* ---------- chrome (#42 D): sidebar tree on pages, folded rail on the map ---------- */\r\n\r\n  function side(s, { top = '' } = {}) {\r\n    const row = (attrs, inner, cls = '') => `\u003ca class=\"ho-trow${cls}\" href=\"#\" ${attrs}>${inner}\u003c/a>`;\r\n    return `\u003cnav class=\"ho-side\" aria-label=\"App\">\r\n      \u003cdiv class=\"ho-side-head\">\u003cspan class=\"logo\">${icon('compass')}\u003c/span>\u003cb>Wayfinder\u003c/b>\u003c/div>\r\n      \u003cdiv class=\"ho-side-actions\">\u003ca class=\"primary\" href=\"#\" data-to=\"Start a new map\">${icon('plus')}Start a new map\u003c/a>\r\n        \u003cbutton type=\"button\" class=\"search\" data-to=\"Jump to\">${icon('lens')}\u003cspan class=\"grow\">Jump to…\u003c/span>\u003ckbd>Ctrl K\u003c/kbd>\u003c/button>\u003c/div>\r\n      \u003cdiv class=\"ho-tree\">${top}\r\n        ${row('data-view=\"home\"', `${icon('home')}\u003cspan class=\"grow\">Home\u003c/span>`, s.view === 'home' ? ' is-on' : '')}\r\n        \u003cdiv class=\"ho-tlabel\">Repositories\u003c/div>\r\n        ${row('data-to=\"the repository page\"', `${icon('chevron')}\u003cspan class=\"ho-mark\">WM\u003c/span>\u003cspan class=\"grow\">wayfinder-map\u003c/span>`, ' is-trail')}\r\n        \u003cdiv class=\"ho-kids\">${row('data-view=\"map\"', `${icon('graph')}\u003cspan class=\"grow\">#35 Redesign Home and Start a…\u003c/span>`, s.view === 'map' ? ' is-on' : '')}\r\n          ${row('data-to=\"map #14\"', `${icon('graph')}\u003cspan class=\"grow\">#14 Installable desktop app\u003c/span>`)}\u003c/div>\r\n        ${row('data-to=\"podcontrol\"', `${icon('right')}\u003cspan class=\"ho-mark\" style=\"--h:150\">PC\u003c/span>\u003cspan class=\"grow\">podcontrol\u003c/span>`)}\r\n        ${row('data-to=\"pdfbuilder\"', `${icon('right')}\u003cspan class=\"ho-mark\" style=\"--h:28\">PB\u003c/span>\u003cspan class=\"grow\">pdfbuilder\u003c/span>`)}\r\n      \u003c/div>\r\n      \u003cdiv class=\"ho-side-foot\">\u003cspan class=\"rail-mark\">R\u003c/span>\u003cspan class=\"grow\">ramon\u003c/span>\u003cbutton type=\"button\" class=\"rail-btn\" data-to=\"settings\">${icon('moon')}\u003c/button>\u003c/div>\u003c/nav>`;\r\n  }\r\n\r\n  function rail(s, { extra = '' } = {}) {\r\n    return `\u003cnav class=\"rail\" aria-label=\"App\">\u003ca class=\"logo\" href=\"#\" data-view=\"home\">${icon('compass')}\u003c/a>\r\n      \u003cbutton type=\"button\" class=\"rail-btn\" data-to=\"the sidebar\" title=\"Open the sidebar\">${icon('panel')}\u003c/button>\r\n      \u003ca class=\"rail-btn${s.view === 'map' ? ' is-on' : ''}\" href=\"#\" data-view=\"map\" title=\"Map\">${icon('graph')}\u003c/a>\r\n      \u003ca class=\"rail-btn\" href=\"#\" data-to=\"the table view\" title=\"Table\">${icon('table')}\u003c/a>\r\n      \u003ca class=\"rail-btn\" href=\"#\" data-to=\"this map's prototypes\" title=\"Prototypes\">${icon('beaker')}\u003c/a>\r\n      ${extra}\u003cspan class=\"rail-spacer\">\u003c/span>\r\n      \u003cbutton type=\"button\" class=\"rail-btn\" data-to=\"the theme switch\">${icon('moon')}\u003c/button>\u003c/nav>`;\r\n  }\r\n\r\n  function topbar(s, { right = '', title } = {}) {\r\n    const t =\r\n      title ??\r\n      (s.view === 'map'\r\n        ? `\u003cspan class=\"crumbs\">\u003cspan class=\"ho-mark\">WM\u003c/span>wayfinder-map\u003cspan class=\"crumb-sep\">/\u003c/span>\u003c/span>\u003cspan class=\"ho-ptitle\">#35 ${esc(MAP.title)}\u003c/span>`\r\n        : `\u003cspan class=\"ho-ptitle\">${s.view === 'home' ? 'Home' : ''}\u003c/span>`);\r\n    return `\u003cheader class=\"topbar\">${t}\u003cspan class=\"topbar-spacer\">\u003c/span>${right}\u003cspan class=\"synced\">${offline() ? 'T3 Code offline' : 'Synced just now'}\u003c/span>\u003c/header>`;\r\n  }\r\n\r\n  /* ---------- the Prototype bar: fakes T3 Code's state ---------- */\r\n\r\n  function protoBar() {\r\n    return `\u003cdiv class=\"ho-proto\" role=\"group\" aria-label=\"Prototype: fake T3 Code state\">\u003cspan class=\"ho-proto-tag\">Prototype\u003c/span>\u003cspan class=\"ho-proto-lbl\">#55 in T3 Code:\u003c/span>\r\n      ${FAKE_STATES.map(([k, l]) => `\u003cbutton type=\"button\" class=\"${state.fake === k ? 'is-on' : ''}\" data-fake=\"${k}\">${l}\u003c/button>`).join('')}\r\n      \u003cspan class=\"ho-proto-sep\">\u003c/span>\u003cbutton type=\"button\" class=\"${state.others ? '' : 'is-on'}\" data-others title=\"Hide the four other hand-offs, to see a quiet start\">Only #55\u003c/button>\u003cbutton type=\"button\" data-replay title=\"Undo the hand-off and press Open in T3 Code again\">${icon('retry')}Replay hand-off\u003c/button>\u003c/div>`;\r\n  }\r\n\r\n  /* ---------- state and rendering ---------- */\r\n\r\n  let render = null;\r\n  let timer = null;\r\n\r\n  function paint() {\r\n    document.getElementById('root').innerHTML = render(state) + protoBar();\r\n    Kit.fillIcons();\r\n  }\r\n\r\n  function setFake(k) {\r\n    state.fake = k;\r\n    if (k !== 'offline') lastFake = k;\r\n    state.handedOff = true;\r\n    paint();\r\n  }\r\n\r\n  /** What pressing Open in T3 Code does in every variant: start, then settle into Working. */\r\n  function handOff() {\r\n    clearTimeout(timer);\r\n    state.handedOff = true;\r\n    state.justHandedOff = true;\r\n    setFake('starting');\r\n    timer = setTimeout(() => {\r\n      state.justHandedOff = false;\r\n      if (state.fake === 'starting') setFake('working');\r\n    }, 2600);\r\n  }\r\n\r\n  document.addEventListener('click', (e) => {\r\n    const fake = e.target.closest('[data-fake]');\r\n    if (fake) {\r\n      clearTimeout(timer);\r\n      state.justHandedOff = false;\r\n      return setFake(fake.dataset.fake);\r\n    }\r\n    if (e.target.closest('[data-others]')) {\r\n      state.others = !state.others;\r\n      return paint();\r\n    }\r\n    if (e.target.closest('[data-replay]')) {\r\n      clearTimeout(timer);\r\n      state.handedOff = false;\r\n      state.justHandedOff = false;\r\n      state.view = 'map';\r\n      state.fake = 'working';\r\n      lastFake = 'working';\r\n      paint();\r\n      return Kit.toast('Press Open in T3 Code in the ticket panel');\r\n    }\r\n    if (e.target.closest('[data-handoff]')) {\r\n      e.preventDefault();\r\n      return handOff();\r\n    }\r\n    const view = e.target.closest('[data-view]');\r\n    if (view) {\r\n      e.preventDefault();\r\n      state.view = view.dataset.view;\r\n      state.justHandedOff = false;\r\n      return paint();\r\n    }\r\n    const toggle = e.target.closest('[data-toggle]');\r\n    if (toggle) {\r\n      e.preventDefault();\r\n      state.open = !state.open;\r\n      return paint();\r\n    }\r\n  });\r\n\r\n  window.AFTER = {\r\n    STATUS,\r\n    FAKE_STATES,\r\n    MAP,\r\n    state,\r\n    esc,\r\n    icon,\r\n    offline,\r\n    handOffs,\r\n    byUrgency,\r\n    focusHandOff,\r\n    waiting,\r\n    label,\r\n    where,\r\n    whereHtml,\r\n    target,\r\n    pill,\r\n    dot,\r\n    statusIcon,\r\n    sinceText,\r\n    actions,\r\n    offlineBanner,\r\n    timeline,\r\n    facts,\r\n    launchBlock,\r\n    mapPage,\r\n    homePage,\r\n    flightCard,\r\n    side,\r\n    rail,\r\n    topbar,\r\n    paint,\r\n    handOff,\r\n    start(fn) {\r\n      render = fn;\r\n      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);\r\n      else paint();\r\n    },\r\n  };\r\n})();\r\n\n\u003c/script>\n    \u003cscript>\n      const { state, icon, esc, pill, sinceText, actions, facts, timeline } = AFTER;\n\n      // The node says it is in T3 Code, in the same words as the card.\n      function badge(t) {\n        const h = AFTER.handOffs().find((x) => x.number === t.number && !x.repo);\n        return h ? `\u003cspan class=\"ho-nbadge\">${pill(h)}\u003cspan class=\"grow\">${esc(sinceText(h))}\u003c/span>\u003c/span>` : '';\n      }\n\n      // The launch block turns into this card when you press Open in T3 Code, and stays live.\n      function card() {\n        if (!state.handedOff) return AFTER.launchBlock();\n        const h = AFTER.focusHandOff();\n        return `\u003cdiv class=\"ho-card${state.justHandedOff ? ' is-fresh' : ''}\" style=\"--tone:${AFTER.STATUS[h.status].tone}\">\n          ${state.justHandedOff ? `\u003cp class=\"ho-sent\">${icon('check')}Sent to T3 Code. You can keep working here: this card stays live.\u003c/p>` : ''}\n          \u003cdiv class=\"ho-card-head\">${pill(h, { size: 'lg' })}\u003cspan class=\"ho-when\">${esc(sinceText(h))}\u003c/span>\u003c/div>\n          ${AFTER.offline() ? `\u003cdiv class=\"ho-offline\">${icon('plug')}\u003cspan class=\"grow\">T3 Code isn't running. This is its last report.\u003c/span>\u003c/div>` : ''}\n          \u003cp class=\"ho-line\">${esc(h.line)}\u003c/p>\n          \u003cdiv class=\"ho-row\">${actions(h, { back: false })}\u003c/div>\n          \u003cdetails${h.status === 'failed' ? ' open' : ''}>\u003csummary>Branch, worktree and what happened\u003c/summary>${facts(h)}${timeline(h)}\u003c/details>\n        \u003c/div>`;\n      }\n\n      function inFlightChip() {\n        const n = AFTER.handOffs().filter((h) => h.kind === 'ticket' && !h.repo).length;\n        return `\u003cspan class=\"filter-sep\" role=\"none\">\u003c/span>\u003cbutton type=\"button\" class=\"fchip\" style=\"--accent: var(--state-claimed)\">${icon('pulse')}In T3 Code \u003cb>${n}\u003c/b>\u003c/button>`;\n      }\n\n      AFTER.start((s) => {\n        if (s.view === 'home')\n          return `\u003cdiv class=\"app has-side\">${AFTER.side(s)}\u003cdiv class=\"main\">${AFTER.topbar(s)}${AFTER.homePage()}\u003c/div>\u003c/div>`;\n        return `\u003cdiv class=\"app\">${AFTER.rail(s)}\u003cdiv class=\"main\">${AFTER.topbar(s)}${AFTER.mapPage({ badge, slot: card(), filterExtra: inFlightChip() })}\u003c/div>\u003c/div>`;\n      });\n    \u003c/script>\n  \u003c/body>\n\u003c/html>\n","B":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n  \u003chead>\u003cscript>window.__Q = \"__Q__\";\u003c/script>\n    \u003cmeta charset=\"utf-8\" />\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n    \u003ctitle>B · A tray that follows you\u003c/title>\n    \u003c!-- PROTOTYPE (#45), direction B: every hand-off lands in one tray at the bottom right of every page, like a download manager. The ticket only says \"In T3 Code\". -->\n    \u003cstyle>\n/*\r\n  Colors come from the validated reference palette. Ticket state is the only thing\r\n  carrying hue: three hues plus neutral, each shipped with an icon and a word, so the\r\n  chart never asks color alone to carry meaning. Ticket type rides a monogram and a\r\n  label instead of a fourth hue, which would fail the all-pairs separation gate.\r\n*/\r\n.viz-root {\r\n  color-scheme: light;\r\n  --surface-1: #fcfcfb;\r\n  --plane: #f4f4f1;\r\n  --text-primary: #0b0b0b;\r\n  --text-secondary: #52514e;\r\n  --text-muted: #898781;\r\n  --gridline: #dcdbd3;\r\n  --baseline: #c3c2b7;\r\n  --hai der-radius: 7px;\r\n  padding: 4px 10px;\r\n  color: var(--text-muted);\r\n  font-size: 13px;\r\n  white-space: nowrap;\r\n}\r\n\r\n.seg:hover:not(:disabled) {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.seg.is-on {\r\n  background: var(--surface-1);\r\n  color: var(--text-primary);\r\n  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 0 0 1px var(--hairline);\r\n}\r\n\r\n.seg:disabled {\r\n  opacity: 0.5;\r\n}\r\n\r\n.floatbox {\r\n  background: color-mix(in srgb, var(--surface-1) 86%, transparent);\r\n  backdrop-filter: blur(14px);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  box-shadow: var(--shadow);\r\n}\r\n\r\n.badge {\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  color: var(--text-secondary);\r\n  background: var(--wash);\r\n  border-radius: 999px;\r\n  padding: 1px 7px;\r\n  white-space: nowrap;\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n.logo {\r\n  display: grid;\r\n  place-items: center;\r\n  width: 30px;\r\n  height: 30px;\r\n  border-radius: 9px;\r\n  background: var(--text-primary);\r\n  color: var(--plane);\r\n  flex: none;\r\n}\r\n\r\n.logo .i {\r\n  width: 18px;\r\n  height: 18px;\r\n}\r\n\r\n/* menus: the map switcher and the key */\r\n.menu-anchor {\r\n  position: relative;\r\n  min-width: 0;\r\n}\r\n\r\n.menu {\r\n  position: absolute;\r\n  top: calc(100% + 8px);\r\n  left: 0;\r\n  z-index: 40;\r\n  min-width: 320px;\r\n  max-width: 460px;\r\n  padding: 6px;\r\n  background: var(--surface-1);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  box-shadow: var(--shadow);\r\n}\r\n\r\n.menu.is-up {\r\n  top: auto;\r\n  bottom: calc(100% + 8px);\r\n  padding: 10px 12px;\r\n  min-width: 380px;\r\n}\r\n\r\n.menu-label {\r\n  padding: 6px 10px 4px;\r\n}\r\n\r\n.menu-item {\r\n  width: 100%;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  text-align: left;\r\n  border: 0;\r\n  background: none;\r\n  border-radius: 8px;\r\n  padding: 8px 10px;\r\n  font-size: 13px;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.menu-item:hover {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.menu-item.is-on {\r\n  color: var(--text-primary);\r\n  font-weight: 600;\r\n}\r\n\r\n.menu-item .grow {\r\n  flex: 1;\r\n  min-width: 0;\r\n  white-space: nowrap;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n}\r\n\r\n.menu-sep {\r\n  height: 1px;\r\n  background: var(--hairline);\r\n  margin: 6px 0;\r\n}\r\n\r\n.miniring {\r\n  width: 18px;\r\n  height: 18px;\r\n  flex: none;\r\n  transform: rotate(-90deg);\r\n}\r\n\r\n.keyrow {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding: 3px 0;\r\n  font-size: 12.5px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.keyrow .i {\r\n  width: 14px;\r\n  height: 14px;\r\n}\r\n\r\n.keyrow b {\r\n  flex: none;\r\n  width: 76px;\r\n  font-weight: 500;\r\n  color: var(--text-primary);\r\n}\r\n\r\n.keyrow.is-type .i {\r\n  color: var(--text-secondary);\r\n}\r\n\r\n/* ---------- layout ---------- */\r\n\r\n.app {\r\n  height: 100%;\r\n  display: grid;\r\n  grid-template-columns: 56px minmax(0, 1fr);\r\n}\r\n\r\n.rail {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  gap: 4px;\r\n  padding: 12px 0;\r\n  background: var(--surface-1);\r\n  border-right: 1px solid var(--hairline);\r\n}\r\n\r\n.rail .logo {\r\n  margin-bottom: 14px;\r\n}\r\n\r\n.rail-btn {\r\n  position: relative;\r\n  width: 38px;\r\n  height: 38px;\r\n  display: grid;\r\n  place-items: center;\r\n  border: 0;\r\n  border-radius: 10px;\r\n  background: none;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.rail-btn .i {\r\n  width: 18px;\r\n  height: 18px;\r\n}\r\n\r\n.rail-btn:hover {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.rail-btn.is-on {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.rail-btn.is-on::before {\r\n  content: '';\r\n  position: absolute;\r\n  left: -9px;\r\n  top: 9px;\r\n  bottom: 9px;\r\n  width: 3px;\r\n  bo  content: '';\r\n  position: absolute;\r\n  left: -12px;\r\n  top: 0.65em;\r\n  width: 4px;\r\n  height: 4px;\r\n  border-radius: 50%;\r\n  background: var(--baseline);\r\n}\r\n\r\n.prose strong {\r\n  color: var(--text-primary);\r\n  font-weight: 600;\r\n}\r\n\r\n.prose pre,\r\npre.prompt {\r\n  background: var(--plane);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 8px;\r\n  padding: 10px;\r\n  font-size: 12px;\r\n  white-space: pre-wrap;\r\n  overflow: auto;\r\n}\r\n\r\n.prose pre code {\r\n  border: 0;\r\n  background: none;\r\n  padding: 0;\r\n}\r\n\r\n/* ticket */\r\n.dhead {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n\r\n.dhead .glyph {\r\n  width: 22px;\r\n  height: 22px;\r\n}\r\n\r\n.dhead .glyph .i {\r\n  width: 14px;\r\n  height: 14px;\r\n}\r\n\r\n.dhead .chip {\r\n  margin-left: 4px;\r\n}\r\n\r\n.dhead .iconbtn {\r\n  margin-left: auto;\r\n  width: 30px;\r\n  height: 30px;\r\n}\r\n\r\n.dtitle {\r\n  margin: 12px 0;\r\n  font-size: 18px;\r\n  font-weight: 650;\r\n  line-height: 1.35;\r\n  letter-spacing: -0.01em;\r\n}\r\n\r\n.banner {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  gap: 10px;\r\n  margin-bottom: 14px;\r\n  padding: 10px 12px;\r\n  border-radius: 10px;\r\n  background: color-mix(in srgb, var(--accent) 10%, transparent);\r\n  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n}\r\n\r\n.banner .i {\r\n  margin-top: 2px;\r\n  color: var(--accent);\r\n}\r\n\r\n.banner b {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.facts {\r\n  display: grid;\r\n  grid-template-columns: 90px minmax(0, 1fr);\r\n  gap: 8px 12px;\r\n  margin: 0 0 16px;\r\n  font-size: 13px;\r\n}\r\n\r\n.facts dt {\r\n  color: var(--text-muted);\r\n}\r\n\r\n.facts dd {\r\n  margin: 0;\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  align-items: center;\r\n  gap: 6px;\r\n  color: var(--text-secondary);\r\n  min-width: 0;\r\n}\r\n\r\n.facts dd .i {\r\n  widt n  border-top: 1px solid var(--gridline);\r\n  padding: 10px 0;\r\n}\r\n\r\n.sec > summary {\r\n  cursor: pointer;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.sec > summary:hover {\r\n  color: var(--text-primary);\r\n}\r\n\r\npre.prompt {\r\n  margin: 10px 0 0;\r\n  max-height: 260px;\r\n  color: var(--text-secondary);\r\n  overflow-wrap: anywhere;\r\n}\r\n\r\n.body-text {\r\n  border-top: 1px solid var(--gridline);\r\n  padding-top: 14px;\r\n}\r\n\r\n/* ---------- table view ---------- */\r\n\r\n.tablewrap {\r\n  position: absolute;\r\n  inset: 0;\r\n  overflow: auto;\r\n  background: var(--surface-1);\r\n}\r\n\r\ntable {\r\n  width: 100%;\r\n  border-collapse: collapse;\r\n  font-size: 13px;\r\n}\r\n\r\nth,\r\ntd {\r\n  text-align: left;\r\n  padding: 10px 16px;\r\n  border-bottom: 1px solid var(--gridline);\r\n  vertical-align: top;\r\n}\r\n\r\nth {\r\n  position: sticky;\r\n  top: 0;\r\n  background: var(--surface-1);\r\n  color: var(--text-muted);\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  letter-spacing: 0.06em;\r\n  text-transform: uppercase;\r\n}\r\n\r\ntd.num,\r\nth.num {\r\n  width: 62px;\r\n  color: var(--text-muted);\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\ntbody tr {\r\n  cursor: pointer;\r\n}\r\n\r\ntbody tr:hover {\r\n  background: var(--wash);\r\n}\r\n\r\ntbody tr.is-selected {\r\n  background: color-mix(in srgb, var(--state-claimed) 10%, transparent);\r\n}\r\n\r\n.cellchip,\r\n.typecell {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.cellchip .i,\r\n.typecell .i {\r\n  width: 13px;\r\n  height: 13px;\r\n}\r\n\r\n.cellchip .i {\r\n  color: var(--accent);\r\n}\r\n\r\n.typecell .i {\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- models dialog ---------- */\r\n\r\n.dialog {\r\n  width: min(560px, calc(100vw - 32px));\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  background: var(--surface-1);\r\n  color: var(-- n: absolute;\r\n  top: 0;\r\n  left: 0;\r\n  width: 1280px;\r\n  height: 800px;\r\n  border: 0;\r\n  transform: scale(var(--thumb-scale, 0.25));\r\n  transform-origin: top left;\r\n  pointer-events: none;\r\n}\r\n\r\n.proto-open {\r\n  position: absolute;\r\n  right: 10px;\r\n  bottom: 10px;\r\n  padding: 5px 11px;\r\n  border-radius: 999px;\r\n  background: var(--state-claimed);\r\n  color: #fff;\r\n  font-size: 12px;\r\n  font-weight: 600;\r\n  opacity: 0;\r\n  transform: translateY(4px);\r\n  transition: opacity 140ms, transform 140ms;\r\n}\r\n\r\n.proto-thumb:hover .proto-open,\r\n.proto-thumb:focus-visible .proto-open {\r\n  opacity: 1;\r\n  transform: none;\r\n}\r\n\r\n.proto-thumb:focus-visible {\r\n  outline: 2px solid var(--state-claimed);\r\n  outline-offset: -2px;\r\n}\r\n\r\n.proto-thumb.is-empty {\r\n  display: grid;\r\n  place-items: center;\r\n  color: var(--text-muted);\r\n  font-size: 13px;\r\n}\r\n\r\n.proto-tile-body {\r\n  display: grid;\r\n  gap: 6px;\r\n  padding: 14px 16px 16px;\r\n}\r\n\r\n.proto-tile-body .eyebrow {\r\n  margin: 0;\r\n}\r\n\r\n.proto-tile-body h2 {\r\n  margin: 0;\r\n  font-size: 15px;\r\n  line-height: 1.35;\r\n}\r\n\r\n.proto-tile-body h2 a {\r\n  color: inherit;\r\n  text-decoration: none;\r\n}\r\n\r\n.proto-tile-body h2 a:hover {\r\n  color: var(--state-claimed);\r\n}\r\n\r\n.proto-gist {\r\n  margin: 0;\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n  display: -webkit-box;\r\n  -webkit-line-clamp: 2;\r\n  -webkit-box-orient: vertical;\r\n  overflow: hidden;\r\n}\r\n\r\n.proto-tile-foot {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 14px;\r\n  margin-top: 4px;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.proto-tile-foot a,\r\n.proto-tile-foot .linkish {\r\n  color: var(--text-secondary);\r\n  font-size: 12px;\r\n}\r\n\r\n.proto-tile-foot a:hover,\r\n.proto-tile-foot .linkish:hover {\r\n  color: var(--state-claimed);\r\n}\r\n\r\n/* In the narrow ticket panel the tile sits flush n}\r\n\r\n.grow {\r\n  flex: 1;\r\n  min-width: 0;\r\n}\r\n\r\ncode {\r\n  font: 12px ui-monospace, 'Cascadia Code', Consolas, monospace;\r\n}\r\n\r\n/* ---------- status pill, dot, spinner ---------- */\r\n\r\n.ho-pill {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  height: 22px;\r\n  padding: 0 8px;\r\n  border-radius: 999px;\r\n  font-size: 11.5px;\r\n  font-weight: 600;\r\n  white-space: nowrap;\r\n  color: color-mix(in srgb, var(--tone) 78%, var(--text-primary));\r\n  background: color-mix(in srgb, var(--tone) 13%, transparent);\r\n  border: 1px solid color-mix(in srgb, var(--tone) 30%, transparent);\r\n}\r\n.ho-pill .i {\r\n  width: 12px;\r\n  height: 12px;\r\n}\r\n.ho-pill i {\r\n  font-style: normal;\r\n  font-weight: 500;\r\n  opacity: 0.8;\r\n}\r\n.ho-pill.is-lg {\r\n  height: 28px;\r\n  padding: 0 11px;\r\n  font-size: 13px;\r\n}\r\n.ho-pill.is-stale {\r\n  color: var(--text-muted);\r\n  background: transparent;\r\n  border-style: dashed;\r\n  border-color: var(--baseline);\r\n}\r\n.ho-pill.is-live .i {\r\n  animation: ho-beat 1.4s ease-in-out infinite;\r\n}\r\n\r\n.ho-dot {\r\n  flex: none;\r\n  width: 8px;\r\n  height: 8px;\r\n  border-radius: 50%;\r\n  background: var(--tone);\r\n}\r\n.ho-dot.is-live {\r\n  box-shadow: 0 0 0 0 color-mix(in srgb, var(--tone) 60%, transparent);\r\n  animation: ho-ping 1.6s ease-out infinite;\r\n}\r\n.ho-dot.is-stale {\r\n  background: transparent;\r\n  border: 1.5px dashed var(--text-muted);\r\n}\r\n\r\n.ho-spin {\r\n  flex: none;\r\n  width: 11px;\r\n  height: 11px;\r\n  border-radius: 50%;\r\n  border: 2px solid color-mix(in srgb, currentColor 25%, transparent);\r\n  border-top-color: currentColor;\r\n  animation: ho-rot 0.8s linear infinite;\r\n}\r\n\r\n@keyframes ho-rot {\r\n  to {\r\n    transform: rotate(360deg);\r\n  }\r\n}\r\n@keyframes ho-beat {\r\n  50% {\r\n    opacity: 0.35;\r\n  }\r\n}\r\n@keyframes ho-ping {\r\n  to {\r\n    box-shadow: 0 0 0 7px transparent;\r\n  }\r\n}\r\n@media (prefers-reduced-motion: reduce) {\r\n  .ho-spin,\r\n  .ho-pill.is-live .i,\r\n  .ho-dot.is-live {\r\n    animation: none;\r\n  }\r\n}\r\n\r\n/* ---------- small shared bits ---------- */\r\n\r\n.ho-sm {\r\n  height: 28px;\r\n  padding: 0 10px;\r\n  font-size: 12.5px;\r\n}\r\n.ho-row {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n.ho-back {\r\n  margin-left: auto;\r\n  font-size: 12.5px;\r\n}\r\n.ho-line {\r\n  margin: 2px 0 0;\r\n  color: var(--text-secondary);\r\n  font-size: 12.5px;\r\n  line-height: 1.45;\r\n}\r\n.ho-when,\r\n.ho-count {\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n  white-space: nowrap;\r\n}\r\n.ho-where {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n}\r\n.ho-where-map {\r\n  display: flex;\r\n  min-width: 0;\r\n  max-width: 100%;\r\n  font-size: 11.5px;\r\n}\r\n.ho-where-map .ho-mark {\r\n  width: 15px;\r\n  height: 15px;\r\n  font-size: 7px;\r\n  border-radius: 4px;\r\n}\r\n.ho-where-repo {\r\n  color: var(--text-secondary);\r\n  white-space: nowrap;\r\n}\r\n.ho-where-sep {\r\n  opacity: 0.6;\r\n}\r\n.ho-where-title {\r\n  min-width: 0;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n.ho-where .i {\r\n  width: 12px;\r\n  height: 12px;\r\n}\r\n.ho-facts code {\r\n  min-width: 0;\r\n  font-size: 11.5px;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n.ho-facts dd .linkish {\r\n  margin: 0;\r\n}\r\n\r\n.ho-offline {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  padding: 9px 12px;\r\n  border: 1px dashed var(--baseline);\r\n  border-radius: 10px;\r\n  background: var(--wash);\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n}\r\n.ho-offline > .i {\r\n  color: var(--text-muted);\r\n}\r\n.ho-offline b {\r\n  color: var(--text-primary);\r\n}\r\n.ho-stage-banner {\r\n  position: absolute;\r\n  z-index: 5;\r\ ;\n        font-size: 13px;\n      }\n      .ho-inline .linkish {\n        margin-left: auto;\n      }\n    \u003c/style>\n  \u003c/head>\n  \u003cbody class=\"viz-root\">\n    \u003cdiv id=\"root\">\u003c/div>\n    \u003cscript>\n/*\n  Optional helpers for pages in variants/. Load it with \u003cscript src=\"../kit/kit.js\">\u003c/script>.\n  It applies the theme and style the canvas passes (?theme=, ?style=), makes links marked\n  data-to=\"…\" explain themselves instead of navigating, fills data-icon=\"name\" from Kit.icons,\n  and gives you Kit.toast and Kit.esc. It knows nothing about any project: put fake data and\n  icons in your own file (see variants/ for an example).\n*/\nwindow.Kit = (() => {\n  const params = new URLSearchParams(window.__Q ?? location.search);\n  const theme = params.get('theme');\n  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;\n\n  // A named style from config.js. Same rules canvas.js writes for its own items.\n  const decls = (vars) =>\n    Object.entries(vars ?? {})\n      .map(([key, value]) => `${key.startsWith('--') ? key : `--${key}`}:${value};`)\n      .join('');\n  try {\n    const style = JSON.parse(params.get('style') ?? 'null');\n    if (style) {\n      for (const href of [...(style.stylesheets ?? []), ...(style.fonts ?? [])]) {\n        const link = document.createElement('link');\n        link.rel = 'stylesheet';\n        link.href = href;\n        document.head.append(link);\n      }\n      const body = `body${style.bodyClass ? `.${style.bodyClass}` : ''}`;\n      const el = document.createElement('style');\n      el.textContent = `:root,:root ${body}{${decls(style.vars)}}:root ${body}{${style.font ? `font-family:${style.font};` : ''}}\n        :root[data-theme='dark'],:root[data-theme='dark'] ${body}{${decls({ ...style.vars, ...style.dark })}}\n        ${style.css ?? ''}`;\n      document.head.append(el);\n    }\n  } catch {\n    console.warn('Ignoring a style the canvas could kind === 'map' ? 'Go to the map' : 'Go to the ticket'}\u003c/button>`);\r\n    return out.join('');\r\n  }\r\n\r\n  /** The \"T3 Code isn't running\" line, shared by every variant. */\r\n  const offlineBanner = (extra = '') =>\r\n    offline()\r\n      ? `\u003cdiv class=\"ho-offline\" role=\"status\">${icon('plug')}\u003cspan class=\"grow\">\u003cb>T3 Code isn't running.\u003c/b> Showing what it last reported, 14 min ago. Nothing has failed.\u003c/span>${extra}\u003cbutton type=\"button\" class=\"ghost ho-sm\" data-to=\"T3 Code\">${icon('play')}Start T3 Code\u003c/button>\u003c/div>`\r\n      : '';\r\n\r\n  /** A timeline of what the thread did, as far as the focus state goes. */\r\n  function timeline(h) {\r\n    const steps = [\r\n      ['Handed off', '10:02', 'Prompt sent with Mid · Opus 5 · high', true],\r\n      ['Thread started', '10:02', 'Worktree at C:\\\\code\\\\wayfinder-map\\\\.t3\\\\55-track-hand-offs', h.status !== 'starting'],\r\n    ];\r\n    if (h.status === 'working') steps.push(['Working', 'now', 'Editing src/server/handOffs.ts', 'live']);\r\n    if (h.status === 'input') steps.push(['Asked you a question', '10:11', h.line.replace(/^Asked: /, ''), 'wait']);\r\n    if (h.status === 'done') steps.push(['Asked you a question', '10:11', 'Archived counts as done', true], ['Answered', '10:13', '', true], ['PR #76 opened', '10:29', 'wayfinder/55-track-hand-offs-on-the-server → main · checks passing', 'good']);\r\n    if (h.status === 'failed') steps.push(['Working', '10:03', '', true], ['Stopped', '10:24', h.line.replace(/^The thread stopped: /, ''), 'bad']);\r\n    if (h.status === 'starting') steps[1][3] = 'live';\r\n    return `\u003col class=\"ho-timeline\">${steps\r\n      .map(\r\n        ([t, at, sub, st]) =>\r\n          `\u003cli class=\"${st === true ? 'is-done' : st === 'live' ? 'is-live' : st === 'wait' ? 'is-wait' : st === 'good' ? 'is-good' : st === 'bad' ? 'is-bad' : ''}${h.stale && st === 'live' ? ' is-stale' : ''}\">\u003cspan class=\"ho-tl-dot\">\u003c/span>\u003cspan class=\"grow\">\u003cb>${esc(t)}\u003c/b>${sub ? `\u003cspan>${esc(sub)}\u003c/span>` : ''}\u003c/span>\u003ctime>${esc(at)}\u003c/time>\u003c/li>`,\r\n      )\r\n      .join('')}\u003c/ol>`;\r\n  }\r\n\r\n  /** Key facts about a hand-off, in the ticket panel's .facts grid. */\r\n  const facts = (h) => `\u003cdl class=\"facts ho-facts\">\r\n      \u003cdt>Branch\u003c/dt>\u003cdd>${icon('branch')}\u003ccode>${esc(h.branch)}\u003c/code>\u003c/dd>\r\n      ${h.pr ? `\u003cdt>PR\u003c/dt>\u003cdd>${icon('pr')}\u003ca class=\"linkish\" href=\"#\" data-to=\"PR #${h.pr}\">#${h.pr}\u003c/a> · checks passing\u003c/dd>` : ''}\r\n      \u003cdt>Worktree\u003c/dt>\u003cdd>${icon('folder')}\u003ccode>.t3\\\\${h.kind === 'map' ? 'new-map' : `${h.number}-…`}\u003c/code>\u003c/dd>\r\n      \u003cdt>Model\u003c/dt>\u003cdd>${icon('cpu')}${esc(h.model)}\u003c/dd>\r\n    \u003c/dl>`;\r\n\r\n  /* ---------- the map page ---------- */\r\n\r\n  const STATES = {\r\n    frontier: { label: 'next', icon: 'arrow', v: '--state-frontier' },\r\n    claimed: { label: 'claimed', icon: 'person', v: '--state-claimed' },\r\n    blocked: { label: 'blocked', icon: 'lock', v: '--state-blocked' },\r\n    done: { label: 'done', icon: 'check', v: '--state-done' },\r\n  };\r\n  const TYPES = { R: ['research', 'lens'], P: ['prototype', 'beaker'], G: ['grilling', 'grill'], T: ['task', 'list'] };\r\n  const T = (number, col, row, type, st, title) => ({ number, col, row, type, state: st, title });\r\n  const TICKETS = [\r\n    T(41, 0, 0, 'G', 'done', 'How deep does hand-off tracking go?'),\r\n    T(44, 0, 1, 'P', 'done', 'What should starting a new map feel like?'),\r\n    T(37, 0, 2, 'R', 'done', \"What is the map page's design system?\"),\r\n    T(45, 1, 0, 'P', 'claimed', 'What does the user see after handing off to T3 Code?'),\r\n    T(55, 1, 1, 'T', 'frontier', 'Track hand-offs on the server'),\r\n    T(48, 1, 2, 'G', 'claimed', 'Which Start a new map flow ships?'),\r\n    T(50, 1, 3, 'T', 'claimed', 'Consolidate shared design tokens and components'),\r\n    T(49, 2, 0, 'G', 'blocked', 'Which after-hand-off experience ships?'),\r\n    T(56, 2, 1, 'T', 'blocked', 'Show hand-off status and links'),\r\n    T(53, 2, 2, 'T', 'claimed', 'Redesign the repository views'),\r\n    T(54, 2, 3, 'T', 'blocked', 'Redesign the Start a new map flow'),\r\n  ];\r\n  const EDGES = [\r\n    [41, 45],\r\n    [41, 55],\r\n    [44, 48],\r\n    [45, 49],\r\n    [55, 56],\r\n    [49, 56],\r\n    [48, 54],\r\n  ];\r\n  const NODE_W = 236;\r\n  const NODE_H = 104;\r\n  const pos = (t) => ({ x: 28 + t.col * (NODE_W + 70), y: 28 + t.row * (NODE_H + 20) });\r\n\r\n  /** A ticket's state while it is handed off: #55 is claimed from the moment it leaves. */\r\n  const ticketState = (t) => (t.number === 55 && state.handedOff ? 'claimed' : t.state);\r\n\r\n  function nodeHtml(t, { badge, selected }) {\r\n    const st = STATES[ticketState(t)];\r\n    const p = pos(t);\r\n    const b = badge ? badge(t) : '';\r\n    return `\u003cbutton type=\"button\" class=\"node${ticketState(t) === 'done' ? ' is-done' : ''}${selected === t.number ? ' is-selected' : ''}${b ? ' ho-has-badge' : ''}\" data-to=\"ticket #${t.number} in the ticket panel\" style=\"--accent: var(${st.v}); left:${p.x}px; top:${p.y}px; width:${NODE_W}px; height:${NODE_H}px\">\r\n      \u003cspan class=\"node-top\">\u003cspan class=\"glyph\">${icon(TYPES[t.type][1])}\u003c/span>\u003cspan class=\"num\">#${t.number}\u003c/span>\u003cspan class=\"chip\" style=\"--accent: var(${st.v})\">${icon(st.icon)}${st.label}\u003c/span>\u003c/span>\r\n      \u003cspan class=\"title\">${esc(t.title)}\u003c/span>${b || `\u003cspan class=\"meta\">${ticketState(t) === 'claimed' || ticketState(t) === 'done' ? '@RAbdelrhman' : TYPES[t.type][0]}\u003c/span>`}\u003c/button>`;\r\n  }\r\n\r\n  function edgesSvg() {\r\n    const at = Object.fromEntries(TICKETS.map((t) => [t.number, pos(t)]));\r\n    return EDGES.map(([a, b]) => {\r\n      const x1 = at[a].x + NODE_W;\r\n      const y1 = at[a].y + NODE_H / 2;\r\n      const x2 = at[b].x;\r\n      const y2 = at[b].y + NODE_H / 2;\r\n      const m = (x1 + x2) / 2;\r\n      return `\u003cpath d=\"M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}\"/>`;\r\n    }).join('');\r\n  }\r\n\r\n  /** Filters row; `extra` is a variant's own chip. */\r\n  const filters = (extra = '') =>\r\n    `\u003cdiv class=\"filters\">\u003cbutton type=\"button\" class=\"fchip is-on\">All \u003cb>${TICKETS.length}\u003c/b>\u003c/button>${['frontier', 'claimed', 'blocked', 'done']\r\n      .map((s) => `\u003cbutton type=\"button\" class=\"fchip\" style=\"--accent: var(${STATES[s].v})\">${icon(STATES[s].icon)}${{ frontier: 'Next up', claimed: 'Claimed', blocked: 'Blocked', done: 'Done' }[s]} \u003cb>${TICKETS.filter((t) => ticketState(t) === s).length}\u003c/b>\u003c/button>`)\r\n      .join('')}${extra}\u003c/div>`;\r\n\r\n  /** The ticket panel for #55. `slot` replaces the launch block. */\r\n  function ticketPanel(slot) {\r\n    const t = TICKETS.find((x) => x.number === 55);\r\n    const st = STATES[ticketState(t)];\r\n    return `\u003caside class=\"inspector\">\u003cdiv class=\"insp-tabs\">\u003cdiv class=\"segmented\">\u003cbutton class=\"seg\">Brief\u003c/button>\u003cbutton class=\"seg is-on\">Ticket\u003c/button>\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"insp-panel\">\r\n        \u003cdiv class=\"dhead\">\u003cspan class=\"glyph\">${icon('list')}\u003c/span>\u003cspan class=\"num\">#55\u003c/span>\u003cspan class=\"chip\" style=\"--accent: var(${st.v})\">${icon(st.icon)}${st.label}\u003c/span>\u003c/div>\r\n        \u003ch2 class=\"dtitle\">${esc(t.title)}\u003c/h2>\r\n        ${slot}\r\n        \u003cdiv class=\"prose ho-prose\">\u003ch3>Question\u003c/h3>\u003cp>Persist a minimal record of every hand-off under \u003ccode>~/.wayfinder-map/\u003c/code> and keep it current from T3 Code's WebSocket, reconciling against \u003ccode>/api/orchestration/snapshot\u003c/code> every minute.\u003c/p>\r\n        \u003ch3>Done when\u003c/h3>\u003cul>\u003cli>Records survive a restart\u003c/li>\u003cli>Branch and PR links are picked up when T3 reports them\u003c/li>\u003cli>Offline shows the last record as stale\u003c/li>\u003c/ul>\u003c/div>\r\n      \u003c/div>\u003c/aside>`;\r\n  }\r\n\r\n  /** Today's launch block: what the panel shows before (or instead of) a hand-off. */\r\n  const launchBlock = () => `\u003cdiv class=\"launch\">\u003cdiv class=\"launch-actions\">\u003cbutton type=\"button\" class=\"primary\" data-handoff>${icon('play')}Open in T3 Code\u003c/button>\u003cbutton type=\"button\" class=\"ghost\" data-to=\"the clipboard\">${icon('copy')}Copy prompt\u003c/button>\u003c/div>\u003c/div>`;\r\n\r\n  function mapPage({ badge, slot, filterExtra = '', overlay = '' } = {}) {\r\n    return `${filters(filterExtra)}\u003cdiv class=\"body\">\u003csection class=\"stage\">${offlineBanner() ? `\u003cdiv class=\"ho-stage-banner\">${offlineBanner()}\u003c/div>` : ''}\u003cdiv class=\"canvas-wrap\">\u003cdiv class=\"canvas\" style=\"width:980px;height:560px\">\u003csvg class=\"edges\" width=\"980\" height=\"560\">${edgesSvg()}\u003c/svg>\u003cdiv class=\"nodes\">${TICKETS.map((t) => nodeHtml(t, { badge, selected: 55 })).join('')}\u003c/div>\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"zoom floatbox\">\u003cbutton class=\"iconbtn\">${icon('minus')}\u003c/button>\u003cbutton class=\"iconbtn pct\">100%\u003c/button>\u003cbutton class=\"iconbtn\">${icon('plus')}\u003c/button>\u003c/div>${overlay}\u003c/section>${ticketPanel(slot ?? launchBlock())}\u003c/div>`;\r\n  }\r\n\r\n  /* ---------- Home (#40): Continue, then In flight ordered by what waits on you ---------- */\r\n\r\n  function flightCard(h) {\r\n    return `\u003cdiv class=\"card ho-fcard\" style=\"--tone:${STATUS[h.status].tone}\">\r\n      \u003cdiv class=\"ho-fcard-top\">${pill(h)}\u003cspan class=\"ho-when\">${esc(sinceText(h))}\u003c/span>\u003c/div>\r\n      \u003cstrong>${esc(label(h))}\u003c/strong>\u003cp class=\"ho-line\">${esc(h.line)}\u003c/p>${whereHtml(h)}\r\n      \u003cdiv class=\"ho-row\">${actions(h, { compact: true })}\u003c/div>\u003c/div>`;\r\n  }\r\n\r\n  function homePage({ strip } = {}) {\r\n    const list = byUrgency(handOffs());\r\n    return `\u003cmain class=\"page\">\u003cdiv class=\"sheet ho-home\">\r\n      \u003cdiv class=\"page-head\">\u003cdiv class=\"grow\">\u003cp class=\"eyebrow\">Home\u003c/p>\u003ch1>Pick up where you left off\u003c/h1>\u003c/div>\u003c/div>\r\n      \u003ca class=\"card ho-continue\" href=\"#\" data-view=\"map\">\u003cspan class=\"ho-cont-ic\">${icon('graph')}\u003c/span>\u003cspan class=\"grow\">\u003cspan class=\"eyebrow\">Continue · wayfinder-map\u003c/span>\u003cstrong>#35 ${esc(MAP.title)}\u003c/strong>\u003cspan class=\"ho-line\">4 next up · 5 claimed\u003c/span>\u003c/span>${icon('arrow')}\u003c/a>\r\n      ${offlineBanner()}\r\n      \u003csection class=\"section\">\u003cdiv class=\"section-head\">\u003ch2>In flight\u003c/h2>\u003cspan class=\"ho-count\">${list.length}${waiting(list) ? ` · ${waiting(list)} waiting on you` : ''}\u003c/span>\u003c/div>\r\n        ${list.length === 0 ? '\u003cp class=\"ho-line\">Nothing in T3 Code right now.\u003c/p>' : strip ? strip(list) : `\u003cdiv class=\"ho-strip\">${list.map(flightCard).join('')}\u003c/div>`}\u003c/section>\r\n    \u003c/div>\u003c/main>`;\r\n  }\r\n\r\n  /* ---------- chrome (#42 D): sidebar tree on pages, folded rail on the map ---------- */\r\n\r\n  function side(s, { top = '' } = {}) {\r\n    const row = (attrs, inner, cls = '') => `\u003ca class=\"ho-trow${cls}\" href=\"#\" ${attrs}>${inner}\u003c/a>`;\r\n    return `\u003cnav class=\"ho-side\" aria-label=\"App\">\r\n      \u003cdiv class=\"ho-side-head\">\u003cspan class=\"logo\">${icon('compass')}\u003c/span>\u003cb>Wayfinder\u003c/b>\u003c/div>\r\n      \u003cdiv class=\"ho-side-actions\">\u003ca class=\"primary\" href=\"#\" data-to=\"Start a new map\">${icon('plus')}Start a new map\u003c/a>\r\n        \u003cbutton type=\"button\" class=\"search\" data-to=\"Jump to\">${icon('lens')}\u003cspan class=\"grow\">Jump to…\u003c/span>\u003ckbd>Ctrl K\u003c/kbd>\u003c/button>\u003c/div>\r\n      \u003cdiv class=\"ho-tree\">${top}\r\n        ${row('data-view=\"home\"', `${icon('home')}\u003cspan class=\"grow\">Home\u003c/span>`, s.view === 'home' ? ' is-on' : '')}\r\n        \u003cdiv class=\"ho-tlabel\">Repositories\u003c/div>\r\n        ${row('data-to=\"the repository page\"', `${icon('chevron')}\u003cspan class=\"ho-mark\">WM\u003c/span>\u003cspan class=\"grow\">wayfinder-map\u003c/span>`, ' is-trail')}\r\n        \u003cdiv class=\"ho-kids\">${row('data-view=\"map\"', `${icon('graph')}\u003cspan class=\"grow\">#35 Redesign Home and Start a…\u003c/span>`, s.view === 'map' ? ' is-on' : '')}\r\n          ${row('data-to=\"map #14\"', `${icon('graph')}\u003cspan class=\"grow\">#14 Installable desktop app\u003c/span>`)}\u003c/div>\r\n        ${row('data-to=\"podcontrol\"', `${icon('right')}\u003cspan class=\"ho-mark\" style=\"--h:150\">PC\u003c/span>\u003cspan class=\"grow\">podcontrol\u003c/span>`)}\r\n        ${row('data-to=\"pdfbuilder\"', `${icon('right')}\u003cspan class=\"ho-mark\" style=\"--h:28\">PB\u003c/span>\u003cspan class=\"grow\">pdfbuilder\u003c/span>`)}\r\n      \u003c/div>\r\n      \u003cdiv class=\"ho-side-foot\">\u003cspan class=\"rail-mark\">R\u003c/span>\u003cspan class=\"grow\">ramon\u003c/span>\u003cbutton type=\"button\" class=\"rail-btn\" data-to=\"settings\">${icon('moon')}\u003c/button>\u003c/div>\u003c/nav>`;\r\n  }\r\n\r\n  function rail(s, { extra = '' } = {}) {\r\n    return `\u003cnav class=\"rail\" aria-label=\"App\">\u003ca class=\"logo\" href=\"#\" data-view=\"home\">${icon('compass')}\u003c/a>\r\n      \u003cbutton type=\"button\" class=\"rail-btn\" data-to=\"the sidebar\" title=\"Open the sidebar\">${icon('panel')}\u003c/button>\r\n      \u003ca class=\"rail-btn${s.view === 'map' ? ' is-on' : ''}\" href=\"#\" data-view=\"map\" title=\"Map\">${icon('graph')}\u003c/a>\r\n      \u003ca class=\"rail-btn\" href=\"#\" data-to=\"the table view\" title=\"Table\">${icon('table')}\u003c/a>\r\n      \u003ca class=\"rail-btn\" href=\"#\" data-to=\"this map's prototypes\" title=\"Prototypes\">${icon('beaker')}\u003c/a>\r\n      ${extra}\u003cspan class=\"rail-spacer\">\u003c/span>\r\n      \u003cbutton type=\"button\" class=\"rail-btn\" data-to=\"the theme switch\">${icon('moon')}\u003c/button>\u003c/nav>`;\r\n  }\r\n\r\n  function topbar(s, { right = '', title } = {}) {\r\n    const t =\r\n      title ??\r\n      (s.view === 'map'\r\n        ? `\u003cspan class=\"crumbs\">\u003cspan class=\"ho-mark\">WM\u003c/span>wayfinder-map\u003cspan class=\"crumb-sep\">/\u003c/span>\u003c/span>\u003cspan class=\"ho-ptitle\">#35 ${esc(MAP.title)}\u003c/span>`\r\n        : `\u003cspan class=\"ho-ptitle\">${s.view === 'home' ? 'Home' : ''}\u003c/span>`);\r\n    return `\u003cheader class=\"topbar\">${t}\u003cspan class=\"topbar-spacer\">\u003c/span>${right}\u003cspan class=\"synced\">${offline() ? 'T3 Code offline' : 'Synced just now'}\u003c/span>\u003c/header>`;\r\n  }\r\n\r\n  /* ---------- the Prototype bar: fakes T3 Code's state ---------- */\r\n\r\n  function protoBar() {\r\n    return `\u003cdiv class=\"ho-proto\" role=\"group\" aria-label=\"Prototype: fake T3 Code state\">\u003cspan class=\"ho-proto-tag\">Prototype\u003c/span>\u003cspan class=\"ho-proto-lbl\">#55 in T3 Code:\u003c/span>\r\n      ${FAKE_STATES.map(([k, l]) => `\u003cbutton type=\"button\" class=\"${state.fake === k ? 'is-on' : ''}\" data-fake=\"${k}\">${l}\u003c/button>`).join('')}\r\n      \u003cspan class=\"ho-proto-sep\">\u003c/span>\u003cbutton type=\"button\" class=\"${state.others ? '' : 'is-on'}\" data-others title=\"Hide the four other hand-offs, to see a quiet start\">Only #55\u003c/button>\u003cbutton type=\"button\" data-replay title=\"Undo the hand-off and press Open in T3 Code again\">${icon('retry')}Replay hand-off\u003c/button>\u003c/div>`;\r\n  }\r\n\r\n  /* ---------- state and rendering ---------- */\r\n\r\n  let render = null;\r\n  let timer = null;\r\n\r\n  function paint() {\r\n    document.getElementById('root').innerHTML = render(state) + protoBar();\r\n    Kit.fillIcons();\r\n  }\r\n\r\n  function setFake(k) {\r\n    state.fake = k;\r\n    if (k !== 'offline') lastFake = k;\r\n    state.handedOff = true;\r\n    paint();\r\n  }\r\n\r\n  /** What pressing Open in T3 Code does in every variant: start, then settle into Working. */\r\n  function handOff() {\r\n    clearTimeout(timer);\r\n    state.handedOff = true;\r\n    state.justHandedOff = true;\r\n    setFake('starting');\r\n    timer = setTimeout(() => {\r\n      state.justHandedOff = false;\r\n      if (state.fake === 'starting') setFake('working');\r\n    }, 2600);\r\n  }\r\n\r\n  document.addEventListener('click', (e) => {\r\n    const fake = e.target.closest('[data-fake]');\r\n    if (fake) {\r\n      clearTimeout(timer);\r\n      state.justHandedOff = false;\r\n      return setFake(fake.dataset.fake);\r\n    }\r\n    if (e.target.closest('[data-others]')) {\r\n      state.others = !state.others;\r\n      return paint();\r\n    }\r\n    if (e.target.closest('[data-replay]')) {\r\n      clearTimeout(timer);\r\n      state.handedOff = false;\r\n      state.justHandedOff = false;\r\n      state.view = 'map';\r\n      state.fake = 'working';\r\n      lastFake = 'working';\r\n      paint();\r\n      return Kit.toast('Press Open in T3 Code in the ticket panel');\r\n    }\r\n    if (e.target.closest('[data-handoff]')) {\r\n      e.preventDefault();\r\n      return handOff();\r\n    }\r\n    const view = e.target.closest('[data-view]');\r\n    if (view) {\r\n      e.preventDefault();\r\n      state.view = view.dataset.view;\r\n      state.justHandedOff = false;\r\n      return paint();\r\n    }\r\n    const toggle = e.target.closest('[data-toggle]');\r\n    if (toggle) {\r\n      e.preventDefault();\r\n      state.open = !state.open;\r\n      return paint();\r\n    }\r\n  });\r\n\r\n  window.AFTER = {\r\n    STATUS,\r\n    FAKE_STATES,\r\n    MAP,\r\n    state,\r\n    esc,\r\n    icon,\r\n    offline,\r\n    handOffs,\r\n    byUrgency,\r\n    focusHandOff,\r\n    waiting,\r\n    label,\r\n    where,\r\n    whereHtml,\r\n    target,\r\n    pill,\r\n    dot,\r\n    statusIcon,\r\n    sinceText,\r\n    actions,\r\n    offlineBanner,\r\n    timeline,\r\n    facts,\r\n    launchBlock,\r\n    mapPage,\r\n    homePage,\r\n    flightCard,\r\n    side,\r\n    rail,\r\n    topbar,\r\n    paint,\r\n    handOff,\r\n    start(fn) {\r\n      render = fn;\r\n      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);\r\n      else paint();\r\n    },\r\n  };\r\n})();\r\n\n\u003c/script>\n    \u003cscript>\n      const { state, icon, esc, pill, dot, sinceText, actions } = AFTER;\n\n      // Nodes carry only a dot: the tray is where you read status.\n      function badge(t) {\n        const h = AFTER.handOffs().find((x) => x.number === t.number && !x.repo);\n        return h ? `\u003cspan class=\"ho-nbadge\">${dot(h)}\u003cspan class=\"grow\">In T3 Code\u003c/span>\u003c/span>` : '';\n      }\n\n      // The ticket panel says it's in T3 Code and points at the tray.\n      function slot() {\n        if (!state.handedOff) return AFTER.launchBlock();\n        const h = AFTER.focusHandOff();\n        return `\u003cdiv class=\"ho-inline\">${pill(h)}\u003cspan>${esc(sinceText(h))}\u003c/span>\u003cbutton type=\"button\" class=\"linkish\" data-toggle>Show in Hand-offs\u003c/button>\u003c/div>`;\n      }\n\n      const GROUPS = [\n        ['Waiting on you', ['input', 'failed']],\n        ['In T3 Code', ['starting', 'working']],\n        ['Done', ['done']],\n      ];\n\n      function row(h) {\n        return `\u003cdiv class=\"ho-trow2${h.focus && state.justHandedOff ? ' is-fresh' : ''}\">${dot(h)}\n          \u003cdiv>\u003cdiv class=\"ho-trow2-top\">\u003cstrong>${esc(AFTER.label(h))}\u003c/strong>\u003cspan class=\"ho-when\">${esc(sinceText(h))}\u003c/span>\u003c/div>\n          \u003cp class=\"ho-line\">${h.stale ? `${AFTER.STATUS[h.status].word} · ` : ''}${esc(h.line)}\u003c/p>\u003c/div>\n          \u003cdiv class=\"ho-row\">${actions(h, { compact: true })}\u003c/div>\u003c/div>`;\n      }\n\n      function tray() {\n        const list = AFTER.handOffs();\n        const waiting = AFTER.waiting(list);\n        const btn = `\u003cbutton type=\"button\" class=\"ho-tray-btn\" data-toggle aria-expanded=\"${state.open}\">\n          ${AFTER.offline() ? icon('plug') : `\u003cspan class=\"ho-dots\">${AFTER.byUrgency(list).map(dot).join('')}\u003c/span>`}\n          ${list.length} in T3 Code${waiting ? `\u003cspan class=\"ho-wait\">· ${waiting} need${waiting === 1 ? 's' : ''} you\u003c/span>` : ''}${icon(state.open ? 'chevron' : 'up')}\u003c/button>`;\n        const toast = state.justHandedOff && !state.open ? `\u003cdiv class=\"ho-toastcard\">${icon('check')}\u003cspan class=\"grow\">Handed off #55 to T3 Code\u003c/span>\u003c/div>` : '';\n        if (!state.open) return `\u003cdiv class=\"ho-tray\">${toast}${btn}\u003c/div>`;\n        const body = GROUPS.map(([title, st]) => {\n          const rows = list.filter((h) => st.includes(h.status));\n          return rows.length ? `\u003cdiv class=\"ho-group\">${title}\u003c/div>${rows.map(row).join('')}` : '';\n        }).join('');\n        return `\u003cdiv class=\"ho-tray\">\u003cdiv class=\"ho-tray-panel\" role=\"region\" aria-label=\"Hand-offs\">\n          \u003cdiv class=\"ho-tray-head\">${icon('flight')}\u003cb>Hand-offs\u003c/b>\u003cspan class=\"ho-count\">${list.length}\u003c/span>\u003cspan class=\"grow\">\u003c/span>\n            \u003cbutton type=\"button\" class=\"iconbtn\" data-to=\"all hand-offs, including finished ones\">${icon('list')}\u003c/button>\u003cbutton type=\"button\" class=\"iconbtn\" data-toggle aria-label=\"Close\">${icon('chevron')}\u003c/button>\u003c/div>\n          \u003cdiv class=\"ho-tray-body\">${AFTER.offline() ? `\u003cdiv class=\"ho-offline\">${icon('plug')}\u003cspan class=\"grow\">\u003cb>T3 Code isn't running.\u003c/b> Last report 14 min ago.\u003c/span>\u003c/div>` : ''}${body}\u003c/div>\n        \u003c/div>${btn}\u003c/div>`;\n      }\n\n      // Pressing Open in T3 Code opens the tray, so the new row is seen arriving.\n      document.addEventListener(\n        'click',\n        (e) => {\n          if (e.target.closest('[data-handoff]')) state.open = true;\n        },\n        true,\n      );\n\n      AFTER.start((s) => {\n        const page =\n          s.view === 'home'\n            ? `\u003cdiv class=\"app has-side\">${AFTER.side(s)}\u003cdiv class=\"main\">${AFTER.topbar(s)}${AFTER.homePage()}\u003c/div>\u003c/div>`\n            : `\u003cdiv class=\"app\">${AFTER.rail(s)}\u003cdiv class=\"main\">${AFTER.topbar(s)}${AFTER.mapPage({ badge, slot: slot() })}\u003c/div>\u003c/div>`;\n        return page + tray();\n      });\n    \u003c/script>\n  \u003c/body>\n\u003c/html>\n","C":"\u003c!doctype html>\r\n\u003chtml lang=\"en\">\r\n  \u003chead>\u003cscript>window.__Q = \"__Q__\";\u003c/script>\r\n    \u003cmeta charset=\"utf-8\" />\r\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\r\n    \u003ctitle>C · Each hand-off gets a page\u003c/title>\r\n    \u003c!-- PROTOTYPE (#45), direction C: pressing Open in T3 Code takes you to the hand-off's own page, and the sidebar grows an In flight group listing every hand-off. -->\r\n    \u003cstyle>\n/*\r\n  Colors come from the validated reference palette. Ticket state is the only thing\r\n  carrying hue: three hues plus neutral, each shipped with an icon and a word, so the\r\n  chart never asks color alone to carry meaning. Ticket type rides a monogram and a\r\n  label instead of a fourth hue, which would fail the all-pairs separation gate.\r\n*/\r\n.viz-root {\r\n  color-scheme: light;\r\n  --surface-1: #fcfcfb;\r\n  --plane: #f4f4f1;\r\n  --text-primary: #0b0b0b;\r\n  --text-secondary: #52514e;\r\n  --text-muted: #898781;\r\n  --gridline: #dcdbd3;\r\n  --baseline: #c3c2b7;\r\n  --hairline: rgba(11, 11, 11, 0.1);\r\n  --wash: rgba(11, 11, 11, 0.05);\r\n  --shadow: 0 16px 40px -20px rgba(0, 0, 0, 0.28);\r\n\r\n  --state-done: #898781;\r\n  --state-blocked: #fab219;\r\n  --state-claimed: #2a78d6;\r\n  --state-frontier: #0ca30c;\r\n}\r\n\r\n@media (prefers-color-scheme: dark) {\r\n  :root:where(:not([data-theme='light'])) .viz-root {\r\n    color-scheme: dark;\r\n    --surface-1: #1a1a19;\r\n    --plane: #0d0d0d;\r\n    --text-primary: #ffffff;\r\n    --text-secondary: #c3c2b7;\r\n    --text-muted: #898781;\r\n    --gridline: #2c2c2a;\r\n    --baseline: #383835;\r\n    --hairline: rgba(255, 255, 255, 0.1);\r\n    --wash: rgba(255, 255, 255, 0.06);\r\n    --shadow: 0 16px 48px -18px rgba(0, 0, 0, 0.7);\r\n    --state-claimed: #3987e5;\r\n  }\r\n}\r\n\r\n:root[data-theme='dark'] .viz-root {\r\n  color-scheme: dark;\r\n  --surface-1: #1a1a19;\r\n  --plane: #0d0d0d;\r\n  --text-primary: #ffffff;\r\n  --text-secondary: #c3c2b7;\r\n  --text-muted: #898781;\r\n  --gridline: #2c2c2a;\r\n  --baseline: #383835;\r\n  --hairline: rgba(255, 255, 255, 0.1);\r\n  --wash: rgba(255, 255, 255, 0.06);\r\n  --shadow: 0 16px 48px -18px rgba(0, 0, 0, 0.7);\r\n  --state-claimed: #3987e5;\r\n}\r\n\r\n* {\r\n  box-sizing: border-box;\r\n}\r\n\r\nhtml,\r\nbody {\r\n  height: 100%;\r\n}\r\n\r\nbody {\r\n  margin: 0;\r\n  background: var(--plane);\r\n  color: var(--text-primary);\r\n  font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;\r\n  overflow: hidden;\r\n}\r\n\r\nbutton {\r\n  font: inherit;\r\n  color: inherit;\r\n  cursor: pointer;\r\n}\r\n\r\nbutton:disabled {\r\n  cursor: default;\r\n}\r\n\r\na {\r\n  color: var(--state-claimed);\r\n}\r\n\r\n[hidden] {\r\n  display: none !important;\r\n}\r\n\r\n.i {\r\n  width: 16px;\r\n  height: 16px;\r\n  flex: none;\r\n}\r\n\r\n.num {\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n.eyebrow {\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  letter-spacing: 0.08em;\r\n  text-transform: uppercase;\r\n  color: var(--text-muted);\r\n}\r\n\r\ncode {\r\n  font: 12px ui-monospace, 'Cascadia Code', Consolas, monospace;\r\n  background: var(--wash);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 5px;\r\n  padding: 0 4px;\r\n}\r\n\r\n/* ---------- shared controls ---------- */\r\n\r\n.iconbtn {\r\n  width: 34px;\r\n  height: 34px;\r\n  display: grid;\r\n  place-items: center;\r\n  border: 0;\r\n  border-radius: 9px;\r\n  background: none;\r\n  color: var(--text-secondary);\r\n  text-decoration: none;\r\n}\r\n\r\n.iconbtn:hover {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.iconbtn[aria-pressed='false'] {\r\n  color: var(--text-muted);\r\n}\r\n\r\n.ghost {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  background: none;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 8px;\r\n  padding: 6px 10px;\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n  text-decoration: none;\r\n}\r\n\r\n.ghost:hover {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.ghost .i {\r\n  width: 14px;\r\n  height: 14px;\r\n}\r\n\r\n.primary {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  gap: 7px;\r\n  background: var(--state-claimed);\r\n  color: #fff;\r\n  border: 0;\r\n  border-radius: 8px;\r\n  padding: 7px 14px;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n}\r\n\r\n.primary .i {\r\n  width: 12px;\r\n  height: 12px;\r\n}\r\n\r\n.primary:hover {\r\n  filter: brightness(1.08);\r\n}\r\n\r\n.primary:disabled {\r\n  opacity: 0.45;\r\n  filter: none;\r\n  cursor: progress;\r\n}\r\n\r\n.primary[title]:disabled {\r\n  cursor: not-allowed;\r\n}\r\n\r\n.segmented {\r\n  display: flex;\r\n  gap: 2px;\r\n  padding: 3px;\r\n  background: var(--wash);\r\n  border-radius: 9px;\r\n}\r\n\r\n.seg {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  background: none;\r\n  border: 0;\r\n  border-radius: 7px;\r\n  padding: 4px 10px;\r\n  color: var(--text-muted);\r\n  font-size: 13px;\r\n  white-space: nowrap;\r\n}\r\n\r\n.seg:hover:not(:disabled) {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.seg.is-on {\r\n  background: var(--surface-1);\r\n  color: var(--text-primary);\r\n  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 0 0 1px var(--hairline);\r\n}\r\n\r\n.seg:disabled {\r\n  opacity: 0.5;\r\n}\r\n\r\n.floatbox {\r\n  background: color-mix(in srgb, var(--surface-1) 86%, transparent);\r\n  backdrop-filter: blur(14px);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  box-shadow: var(--shadow);\r\n}\r\n\r\n.badge {\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  color: var(--text-secondary);\r\n  background: var(--wash);\r\n  border-radius: 999px;\r\n  padding: 1px 7px;\r\n  white-space: nowrap;\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n.logo {\r\n  display: grid;\r\n  place-items: center;\r\n  width: 30px;\r\n  height: 30px;\r\n  border-radius: 9px;\r\n  background: var(--text-primary);\r\n  color: var(--plane);\r\n  flex: none;\r\n}\r\n\r\n.logo .i {\r\n  width: 18px;\r\n  height: 18px;\r\n}\r\n\r\n/* menus: the map switcher and the key */\r\n.menu-anchor {\r\n  position: relative;\r\n  min-width: 0;\r\n}\r\n\r\n.menu {\r\n  position: absolute;\r\n  top: calc(100% + 8px);\r\n  left: 0;\r\n  z-index: 40;\r\n  min-width: 320px;\r\n  max-width: 460px;\r\n  padding: 6px;\r\n  background: var(--surface-1);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  box-shadow: var(--shadow);\r\n}\r\n\r\n.menu.is-up {\r\n  top: auto;\r\n  bottom: calc(100% + 8px);\r\n  padding: 10px 12px;\r\n  min-width: 380px;\r\n}\r\n\r\n.menu-label {\r\n  padding: 6px 10px 4px;\r\n}\r\n\r\n.menu-item {\r\n  width: 100%;\r\n  display: flex;\r\n  align-item
