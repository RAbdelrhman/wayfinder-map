\n}\r\n\r\n.hovercard .hint-row {\r\n  margin-top: 10px;\r\n  font-size: 11px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- inspector ---------- */\r\n\r\n.inspector {\r\n  display: flex;\r\n  flex-direction: column;\r\n  min-width: 0;\r\n  min-height: 0;\r\n  background: var(--surface-1);\r\n  border-left: 1px solid var(--hairline);\r\n}\r\n\r\n.insp-tabs {\r\n  flex: none;\r\n  display: flex;\r\n  align-items: center;\r\n  padding: 8px 10px;\r\n  border-bottom: 1px solid var(--hairline);\r\n}\r\n\r\n.insp-tabs .iconbtn {\r\n  margin-left: auto;\r\n  width: 30px;\r\n  height: 30px;\r\n}\r\n\r\n.insp-panel {\r\n  flex: 1;\r\n  overflow: auto;\r\n  padding: 18px 20px 24px;\r\n}\r\n\r\n/* brief */\r\n.brief h1 {\r\n  margin: 6px 0 16px;\r\n  font-size: 19px;\r\n  line-height: 1.3;\r\n  letter-spacing: -0.015em;\r\n}\r\n\r\n.brief .eyebrow a {\r\n  color: inherit;\r\n  text-decoration: none;\r\n}\r\n\r\n.brief .eyebrow a:hover {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.summary {\r\n  display: grid;\r\n  grid-template-columns: 76px minmax(0, 1fr);\r\n  align-items: center;\r\n  gap: 16px;\r\n}\r\n\r\n.ring {\r\n  position: relative;\r\n  width: 76px;\r\n  height: 76px;\r\n}\r\n\r\n.ring svg {\r\n  width: 76px;\r\n  height: 76px;\r\n  transform: rotate(-90deg);\r\n}\r\n\r\n.ring .lbl {\r\n  position: absolute;\r\n  inset: 0;\r\n  display: grid;\r\n  place-content: center;\r\n  text-align: center;\r\n  line-height: 1.1;\r\n}\r\n\r\n.ring .lbl b {\r\n  font-size: 18px;\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n.ring .lbl span {\r\n  font-size: 10px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.status-rows {\r\n  display: grid;\r\n  gap: 2px;\r\n}\r\n\r\n.srow {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  border: 0;\r\n  border-radius: 7px;\r\n  padding: 3px 8px;\r\n  background: none;\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n  text-align: left;\r\n}\r\n\r\n.srow .i {\r\n  width: 13px;\r\n  height: 13px;\r\n  color: var(--accent);\r\n}\r\n\r\n.srow b {\r\n  margin-left: auto;\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n.srow:hover:not(:disabled) {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.srow.is-on {\r\n  background: color-mix(in srgb, var(--accent) 14%, transparent);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.srow:disabled {\r\n  opacity: 0.4;\r\n}\r\n\r\n.tabs {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 4px;\r\n  margin: 20px 0 12px;\r\n}\r\n\r\n.tab {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  border: 1px solid transparent;\r\n  border-radius: 999px;\r\n  padding: 3px 10px;\r\n  background: none;\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n}\r\n\r\n.tab:hover {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.tab.is-on {\r\n  background: var(--wash);\r\n  border-color: var(--hairline);\r\n  color: var(--text-primary);\r\n}\r\n\r\n/* rendered markdown: map sections and issue bodies */\r\n.prose {\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n  line-height: 1.6;\r\n  overflow-wrap: anywhere;\r\n}\r\n\r\n.prose p,\r\n.prose pre {\r\n  margin: 0 0 10px;\r\n}\r\n\r\n.prose h4 {\r\n  margin: 14px 0 6px;\r\n  font-size: 13px;\r\n  color: var(--text-primary);\r\n}\r\n\r\n.prose ul,\r\n.prose ol {\r\n  margin: 0 0 10px;\r\n  padding-left: 18px;\r\n  display: grid;\r\n  gap: 8px;\r\n}\r\n\r\n.prose ul {\r\n  list-style: none;\r\n  padding-left: 14px;\r\n}\r\n\r\n.prose ul li {\r\n  position: relative;\r\n}\r\n\r\n.prose ul li::before {\r\n  content: '';\r\n  position: absolute;\r\n  left: -12px;\r\n  top: 0.65em;\r\n  width: 4px;\r\n  height: 4px;\r\n  border-radius: 50%;\r\n  background: var(--baseline);\r\n}\r\n\r\n.prose strong {\r\n  color: var(--text-primary);\r\n  font-weight: 600;\r\n}\r\n\r\n.prose pre,\r\npre.prompt {\r\n  background: var(--plane);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 8px;\r\n  padding: 10px;\r\n  font-size: 12px;\r\n  white-space: pre-wrap;\r\n  overflow: auto;\r\n}\r\n\r\n.prose pre code {\r\n  border: 0;\r\n  background: none;\r\n  padding: 0;\r\n}\r\n\r\n/* ticket */\r\n.dhead {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n\r\n.dhead .glyph {\r\n  width: 22px;\r\n  height: 22px;\r\n}\r\n\r\n.dhead .glyph .i {\r\n  width: 14px;\r\n  height: 14px;\r\n}\r\n\r\n.dhead .chip {\r\n  margin-left: 4px;\r\n}\r\n\r\n.dhead .iconbtn {\r\n  margin-left: auto;\r\n  width: 30px;\r\n  height: 30px;\r\n}\r\n\r\n.dtitle {\r\n  margin: 12px 0;\r\n  font-size: 18px;\r\n  font-weight: 650;\r\n  line-height: 1.35;\r\n  letter-spacing: -0.01em;\r\n}\r\n\r\n.banner {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  gap: 10px;\r\n  margin-bottom: 14px;\r\n  padding: 10px 12px;\r\n  border-radius: 10px;\r\n  background: color-mix(in srgb, var(--accent) 10%, transparent);\r\n  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n}\r\n\r\n.banner .i {\r\n  margin-top: 2px;\r\n  color: var(--accent);\r\n}\r\n\r\n.banner b {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.facts {\r\n  display: grid;\r\n  grid-template-columns: 90px minmax(0, 1fr);\r\n  gap: 8px 12px;\r\n  margin: 0 0 16px;\r\n  font-size: 13px;\r\n}\r\n\r\n.facts dt {\r\n  color: var(--text-muted);\r\n}\r\n\r\n.facts dd {\r\n  margin: 0;\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  align-items: center;\r\n  gap: 6px;\r\n  color: var(--text-secondary);\r\n  min-width: 0;\r\n}\r\n\r\n.facts dd .i {\r\n  width: 13px;\r\n  height: 13px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.launch {\r\n  margin-bottom: 16px;\r\n  padding: 12px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  background: var(--wash);\r\n}\r\n\r\n.launch-actions {\r\n  display: flex;\r\n  gap: 8px;\r\n}\r\n\r\n.launch-actions .primary {\r\n  flex: 1;\r\n}\r\n\r\n.clone-hint {\r\n  margin: 0 0 10px;\r\n}\r\n\r\n.clone-row {\r\n  display: flex;\r\n  gap: 6px;\r\n  min-width: 0;\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.clone-row select {\r\n  flex: 1 1 auto;\r\n  min-width: 0;\r\n  padding: 6px 8px;\r\n  background: var(--surface-1);\r\n  color: var(--text-primary);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 8px;\r\n  font: inherit;\r\n  font-size: 12px;\r\n}\r\n\r\n.runwith {\r\n  display: grid;\r\n  gap: 10px;\r\n  margin-bottom: 12px;\r\n}\r\n\r\n.runwith-row {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  min-width: 0;\r\n}\r\n\r\n.runwith-label {\r\n  flex: none;\r\n  width: 52px;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.runwith .seg {\r\n  padding: 3px 10px;\r\n  font-size: 12px;\r\n}\r\n\r\n.runwith .hint {\r\n  margin: 0;\r\n}\r\n\r\n.linkish {\r\n  margin-left: auto;\r\n  padding: 2px 4px;\r\n  border: 0;\r\n  background: none;\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n  text-decoration: underline;\r\n  text-underline-offset: 2px;\r\n}\r\n\r\n.linkish:hover {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.hint {\r\n  margin: 8px 0 0;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.picker {\r\n  display: flex;\r\n  gap: 6px;\r\n  min-width: 0;\r\n}\r\n\r\n.picker select {\r\n  flex: 1 1 auto;\r\n  min-width: 0;\r\n  padding: 6px 8px;\r\n  background: var(--surface-1);\r\n  color: var(--text-primary);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 8px;\r\n  font: inherit;\r\n  font-size: 12px;\r\n}\r\n\r\n.picker select + select {\r\n  flex: 0 1 auto;\r\n}\r\n\r\n.sec {\r\n  border-top: 1px solid var(--gridline);\r\n  padding: 10px 0;\r\n}\r\n\r\n.sec > summary {\r\n  cursor: pointer;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.sec > summary:hover {\r\n  color: var(--text-primary);\r\n}\r\n\r\npre.prompt {\r\n  margin: 10px 0 0;\r\n  max-height: 260px;\r\n  color: var(--text-secondary);\r\n  overflow-wrap: anywhere;\r\n}\r\n\r\n.body-text {\r\n  border-top: 1px solid var(--gridline);\r\n  padding-top: 14px;\r\n}\r\n\r\n/* ---------- table view ---------- */\r\n\r\n.tablewrap {\r\n  position: absolute;\r\n  inset: 0;\r\n  overflow: auto;\r\n  background: var(--surface-1);\r\n}\r\n\r\ntable {\r\n  width: 100%;\r\n  border-collapse: collapse;\r\n  font-size: 13px;\r\n}\r\n\r\nth,\r\ntd {\r\n  text-align: left;\r\n  padding: 10px 16px;\r\n  border-bottom: 1px solid var(--gridline);\r\n  vertical-align: top;\r\n}\r\n\r\nth {\r\n  position: sticky;\r\n  top: 0;\r\n  background: var(--surface-1);\r\n  color: var(--text-muted);\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  letter-spacing: 0.06em;\r\n  text-transform: uppercase;\r\n}\r\n\r\ntd.num,\r\nth.num {\r\n  width: 62px;\r\n  color: var(--text-muted);\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\ntbody tr {\r\n  cursor: pointer;\r\n}\r\n\r\ntbody tr:hover {\r\n  background: var(--wash);\r\n}\r\n\r\ntbody tr.is-selected {\r\n  background: color-mix(in srgb, var(--state-claimed) 10%, transparent);\r\n}\r\n\r\n.cellchip,\r\n.typecell {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.cellchip .i,\r\n.typecell .i {\r\n  width: 13px;\r\n  height: 13px;\r\n}\r\n\r\n.cellchip .i {\r\n  color: var(--accent);\r\n}\r\n\r\n.typecell .i {\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- models dialog ---------- */\r\n\r\n.dialog {\r\n  width: min(560px, calc(100vw - 32px));\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  background: var(--surface-1);\r\n  color: var(--text-primary);\r\n  padding: 16px;\r\n  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.24);\r\n}\r\n\r\n.dialog::backdrop {\r\n  background: rgba(0, 0, 0, 0.32);\r\n}\r\n\r\n.dialog-head {\r\n  display: flex;\r\n  align-items: center;\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.dialog-head h2 {\r\n  margin: 0;\r\n  font-size: 15px;\r\n}\r\n\r\n.detail-close {\r\n  margin-left: auto;\r\n  padding: 2px 6px;\r\n  border: 0;\r\n  border-radius: 6px;\r\n  background: none;\r\n  color: var(--text-muted);\r\n  font-size: 18px;\r\n  line-height: 1;\r\n}\r\n\r\n.detail-close:hover {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.dialog .hint {\r\n  margin: 0 0 14px;\r\n}\r\n\r\n.tier-row {\r\n  display: grid;\r\n  grid-template-columns: 150px minmax(0, 1fr);\r\n  gap: 12px;\r\n  align-items: center;\r\n  padding: 10px 0;\r\n  border-top: 1px solid var(--gridline);\r\n}\r\n\r\n.tier-name {\r\n  display: grid;\r\n  gap: 2px;\r\n  font-size: 13px;\r\n}\r\n\r\n.tier-name span {\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- toast ---------- */\r\n\r\n.toast {\r\n  position: fixed;\r\n  left: 50%;\r\n  bottom: 24px;\r\n  z-index: 70;\r\n  max-width: 70vw;\r\n  transform: translateX(-50%);\r\n  padding: 10px 16px;\r\n  border-radius: 10px;\r\n  background: var(--text-primary);\r\n  color: var(--surface-1);\r\n  font-size: 13px;\r\n  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);\r\n}\r\n\r\n@media (max-width: 1100px) {\r\n  .synced,\r\n  .search kbd {\r\n    display: none;\r\n  }\r\n\r\n  .body {\r\n    grid-template-columns: minmax(0, 1fr);\r\n    grid-template-rows: minmax(0, 1fr) 42vh;\r\n  }\r\n\r\n  .inspector {\r\n    border-left: 0;\r\n    border-top: 1px solid var(--hairline);\r\n  }\r\n}\r\n\r\n/* ---------- prototypes view ---------- */\r\n\r\n.app.is-prototypes .filters,\r\n.app.is-prototypes .keybox,\r\n.app.is-prototypes .zoom {\r\n  display: none;\r\n}\r\n\r\n.protowrap {\r\n  position: absolute;\r\n  inset: 0;\r\n  overflow: auto;\r\n  background: var(--surface-1);\r\n}\r\n\r\n.protowrap .empty code {\r\n  font-size: 11px;\r\n}\r\n\r\n.protolist {\r\n  display: grid;\r\n  gap: 12px;\r\n  max-width: 860px;\r\n  margin: 0 auto;\r\n  padding: 20px 24px 40px;\r\n}\r\n\r\n.protolist > .eyebrow {\r\n  margin: 0;\r\n}\r\n\r\n.proto {\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  padding: 14px 16px 4px;\r\n  background: var(--surface-1);\r\n}\r\n\r\n.proto-head {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.proto-title {\r\n  flex: 1;\r\n  min-width: 0;\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 8px;\r\n  padding: 0;\r\n  border: 0;\r\n  background: none;\r\n  text-align: left;\r\n  font-weight: 600;\r\n}\r\n\r\n.proto-title:hover {\r\n  color: var(--state-claimed);\r\n}\r\n\r\n.proto-date {\r\n  flex: none;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n.proto-verdict {\r\n  margin: 4px 0 10px;\r\n  padding: 8px 12px;\r\n  border-left: 3px solid var(--state-done);\r\n  background: var(--wash);\r\n  border-radius: 0 8px 8px 0;\r\n  max-height: 220px;\r\n  overflow: auto;\r\n}\r\n\r\n.proto-verdict .prose {\r\n  margin-top: 4px;\r\n}\r\n\r\n.proto-actions {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 8px;\r\n  margin: 10px 0;\r\n}\r\n\r\n.proto-actions .primary {\r\n  text-decoration: none;\r\n}\r\n\r\n.proto .sec code,\r\n.ticket-proto .sec code {\r\n  font-size: 11px;\r\n}\r\n\r\n.proto-files {\r\n  margin: 8px 0 0;\r\n  padding-left: 18px;\r\n  font: 12px ui-monospace, 'Cascadia Code', Consolas, monospace;\r\n  color: var(--text-secondary);\r\n  overflow-wrap: anywhere;\r\n}\r\n\r\n.ticket-proto {\r\n  margin-bottom: 16px;\r\n  padding: 12px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n}\r\n\r\n.ticket-proto .sec {\r\n  padding-bottom: 0;\r\n}\r\n\r\n/* ---------- home and repository pages ---------- */\r\n\r\n/*\r\n  Home borrows the map page's shell: the same 56px rail, the same 56px top bar, the same\r\n  surfaces and hairlines. Only the middle scrolls, so the chrome stays put exactly as it\r\n  does on a map.\r\n*/\r\n\r\n.rail-btn.is-on[href] {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.rail-mark {\r\n  width: 30px;\r\n  height: 30px;\r\n  margin-top: 6px;\r\n  border-radius: 9px;\r\n  display: grid;\r\n  place-items: center;\r\n  background: var(--state-claimed);\r\n  color: #fff;\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  flex: none;\r\n}\r\n\r\n.topbar-spacer {\r\n  flex: 1;\r\n  min-width: 8px;\r\n}\r\n\r\n.topbar .primary {\r\n  flex: none;\r\n  margin-right: 8px;\r\n  text-decoration: none;\r\n}\r\n\r\n.crumbs a {\r\n  color: inherit;\r\n  text-decoration: none;\r\n}\r\n\r\n.crumbs a:hover {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.page {\r\n  flex: 1 1 auto;\r\n  min-height: 0;\r\n  overflow: auto;\r\n}\r\n\r\n.sheet {\r\n  width: min(940px, 100%);\r\n  margin: 0 auto;\r\n  padding: 30px 28px 80px;\r\n}\r\n\r\n.page-head {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  gap: 18px;\r\n  margin-bottom: 26px;\r\n}\r\n\r\n.page-head .grow {\r\n  flex: 1;\r\n  min-width: 0;\r\n}\r\n\r\n.page-head h1 {\r\n  margin: 7px 0 0;\r\n  font-size: 25px;\r\n  line-height: 1.22;\r\n  letter-spacing: -0.02em;\r\n  font-weight: 650;\r\n  overflow-wrap: anywhere;\r\n}\r\n\r\n.page-head p {\r\n  margin: 8px 0 0;\r\n  max-width: 64ch;\r\n  font-size: 13.5px;\r\n  line-height: 1.55;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.page-actions {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding-top: 6px;\r\n}\r\n\r\n.section {\r\n  margin-top: 30px;\r\n}\r\n\r\n.section-head {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  margin-bottom: 12px;\r\n}\r\n\r\n.section-head h2 {\r\n  margin: 0;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  letter-spacing: 0.08em;\r\n  text-transform: uppercase;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.section-head .grow {\r\n  flex: 1;\r\n}\r\n\r\n.card {\r\n  display: block;\r\n  padding: 16px;\r\n  background: var(--surface-1);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  color: inherit;\r\n  text-decoration: none;\r\n}\r\n\r\na.card:hover {\r\n  border-color: var(--state-claimed);\r\n}\r\n\r\n.panel {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n  margin- ${style.bodyClass}` : ''}`;\n      const el = document.createElement('style');\n      el.textContent = `:root,:root ${body}{${decls(style.vars)}}:root ${body}{${style.font ? `font-family:${style.font};` : ''}}\n        :root[data-theme='dark'],:root[data-theme='dark'] ${body}{${decls({ ...style.vars, ...style.dark })}}\n        ${style.css ?? ''}`;\n      document.head.append(el);\n    }\n  } catch {\n    console.warn('Ignoring a style the canvas could not parse.');\n  }\n\n  const esc = (text) => String(text ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n  /** Inner SVG markup by name, drawn on a 24px grid in currentColor. Add your own: Kit.icons.star = '<path …/>'. */\n  const icons = {};\n  const icon = (name) =>\n    `<svg class=\"i\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${\n      icons[name] ?? ''\n    }<\/svg>`;\n\n  function fillIcons(root = document) {\n    for (const el of root.querySelectorAll('[data-icon]')) el.innerHTML = icon(el.dataset.icon);\n  }\n\n  const toastCss = document.createElement('style');\n  toastCss.textContent = `#kit-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;padding:9px 14px;border-radius:8px;\n    background:#1b1b1a;color:#f3f2ee;font:13px/1.4 system-ui,sans-serif;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}#kit-toast[hidden]{display:none}`;\n  document.head.append(toastCss);\n\n  let timer;\n  function toast(message) {\n    let el = document.getElementById('kit-toast');\n    if (!el) {\n      el = document.createElement('div');\n      el.id = 'kit-toast';\n      el.setAttribute('role', 'status');\n      document.body.append(el);\n    }\n    el.textContent = message;\n    el.hidden = false;\n    clearTimeout(timer);\n    timer = setTimeout(() => (el.hidden = true), 2600);\n  }\n\n  // A prototype has nowhere real to go: say where a link would lead instead.\n  document.addEventListener('click', (event) => {\n    const link = event.target.closest('[data-to]');\n    if (!link) return;\n    event.preventDefault();\n    toast(`Would open ${link.dataset.to}`);\n  });\n\n  document.addEventListener('DOMContentLoaded', () => fillIcons());\n\n  return { icons, icon, fillIcons, toast, esc };\n})();\n<\/script>\n    <script>/*\n  PROTOTYPE (#42): shared fake data, icons and page bodies for the navigation-shell variants.\n  The bodies (Home, repository, Prototypes, /new-map, map) are the same in every variant, so the\n  only thing that differs between nav-a/b/c.html is the shell around them. Load after ../kit/kit.js.\n\n  A variant calls NAV.start(shell), where shell(state, body) returns the whole .app markup.\n  Navigation inside the prototype is real: anything with data-view (plus optional data-repo,\n  data-map, data-mapview) moves there and re-renders. ?view= picks the starting view.\n*/\n(() => {\n  Object.assign(Kit.icons, {\n    compass: '<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m15.5 8.5-2 5-5 2 2-5z\"/>',\n    home: '<path d=\"m3 10.5 9-7 9 7\"/><path d=\"M5.5 9.2V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.2\"/>',\n    plus: '<path d=\"M12 5v14M5 12h14\"/>',\n    refresh: '<path d=\"M20 11a8 8 0 0 0-14.9-3.5L3 10\"/><path d=\"M3 4v6h6\"/><path d=\"M4 13a8 8 0 0 0 14.9 3.5L21 14\"/><path d=\"M21 20v-6h-6\"/>',\n    moon: '<path d=\"M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z\"/>',\n    repo: '<path d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v18H6.5A1.5 1.5 0 0 1 5 19.5z\"/><path d=\"M5 16.5A1.5 1.5 0 0 1 6.5 15H19\"/>',\n    arrow: '<path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/>',\n    chevron: '<path d=\"m6 9 6 6 6-6\"/>',\n    right: '<path d=\"m9 6 6 6-6 6\"/>',\n    graph: '<rect x=\"3\" y=\"4\" width=\"7\" height=\"6\" rx=\"1.5\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"6\" rx=\"1.5\"/><path d=\"M10 7h1.5a2.5 2.5 0 0 1 2.5 2.5V14\"/>',\n    table:  'check', v: '--state-done' },\n  };\n  const TYPES = { R: ['research', 'lens'], P: ['prototype', 'beaker'], G: ['grilling', 'grill'], T: ['task', 'list'] };\n\n  // Map #35 as it stands today: column, type, state, blockers.\n  const T = (number, col, type, state, title, blockers = []) => ({ number, col, type, state, title, blockers });\n  const MAP_35 = [\n    T(36, 0, 'R', 'done', 'Where do Home and Start a new map fall short of the map page?'),\n    T(37, 0, 'R', 'done', \"What is the map page's design system, and where do the Home views drift?\"),\n    T(38, 0, 'R', 'done', 'What can T3 Code tell Wayfinder about a thread after a hand-off?'),\n    T(39, 0, 'P', 'done', 'What should the prototype canvas look like?'),\n    T(40, 1, 'G', 'frontier', 'What is Home for?'),\n    T(41, 1, 'G', 'frontier', 'How deep does hand-off tracking go?'),\n    T(42, 1, 'P', 'claimed', 'How should navigation show where you are and where you can go?'),\n    T(44, 1, 'P', 'frontier', 'What should starting a new map feel like?'),\n    T(50, 1, 'T', 'frontier', 'Consolidate shared design tokens and components in styles.css'),\n    T(43, 2, 'P', 'blocked', 'What should the Home, repository and Prototypes views look like?', [40, 42]),\n    T(45, 2, 'P', 'blocked', 'What does the user see after handing off to T3 Code?', [41]),\n    T(46, 2, 'G', 'blocked', 'Which navigation direction ships?', [42]),\n    T(48, 2, 'G', 'blocked', 'Which Start a new map flow ships?', [44]),\n    T(55, 2, 'T', 'blocked', 'Track hand-offs on the server', [41]),\n    T(47, 3, 'G', 'blocked', 'Which Home, repository and Prototypes direction ships?', [43]),\n    T(49, 3, 'G', 'blocked', 'Which after-hand-off experience ships?', [45]),\n    T(51, 3, 'T', 'blocked', 'Build the new navigation shell', [46, 50]),\n    T(52, 4, 'T', 'blocked', 'Redesign the Home view', [47, 51]),\n    T(53, 4, 'T', 'blocked', 'Redesign the repository and Prototypes views', [47, 51]),\n    T(54, 4, 'T', 'blocked', 'Redesign the Start a ] === all ? 0 : size < 30 ? 1.5 : 3;\n        const arc = `<circle cx=\"${size / 2}\" cy=\"${size / 2}\" r=\"${r}\" fill=\"none\" stroke=\"var(${STATES[s].v})\" stroke-width=\"${stroke}\" stroke-dasharray=\"${Math.max(0, len - gap)} ${circ}\" stroke-dashoffset=\"${-off}\"/>`;\n        off += len;\n        return arc;\n      })\n      .join('');\n    return `<svg viewBox=\"0 0 ${size} ${size}\" width=\"${size}\" height=\"${size}\" style=\"transform:rotate(-90deg)\" aria-hidden=\"true\">${arcs}<\/svg>`;\n  }\n  const miniRing = (c) => `<span class=\"nv-miniring\">${ring(c, 16, 3)}<\/span>`;\n\n  function summary(c) {\n    const rows = ['frontier', 'claimed', 'blocked', 'done']\n      .filter((s) => c[s] > 0)\n      .map((s) => `<span class=\"srow\" style=\"--accent: var(${STATES[s].v})\">${icon(STATES[s].icon)}${STATES[s].long}<b>${c[s]}<\/b><\/span>`)\n      .join('');\n    return `<div class=\"summary\"><div class=\"ring\">${ring(c)}<div class=\"lbl\"><b>${c.done}/${total(c)}<\/b><span>done<\/span><\/div><\/div><div class=\"status-rows\">${rows}<\/div><\/div>`;\n  }\n\n  const go = (view, extra = '') => `data-view=\"${view}\"${extra}`;\n  const goRepo = (repo, view = 'repo') => go(view, ` data-repo=\"${esc(repo.name)}\"`);\n  const goMap = (repo, map, mapview) => go('map', ` data-repo=\"${esc(repo.name)}\" data-map=\"${map.number}\"${mapview ? ` data-mapview=\"${mapview}\"` : ''}`);\n\n  /* ---------- page bodies: identical in every variant ---------- */\n\n  function homeBody(s) {\n    const last = repoOf(REPOS[0].name);\n    const lastMap = last.maps[0];\n    return `<div class=\"sheet\">\n      <div class=\"page-head\"><div class=\"grow\"><p class=\"eyebrow\">Wayfinder<\/p><h1>Where do you want to go?<\/h1>\n        <p>Pick up the map you were on, or open a repository.<\/p><\/div><\/div>\n      <a class=\"card nv-continue\" href=\"#\" ${goMap(last, lastMap)}>\n        <div class=\"ring nv-ring-sm\">${ring(lastMap.counts, 52, 6)}<\/div>\n        <div class=\"grow\"><p class=\"eyebrow\">Continue · ${esc(last.name)}<\/p><strong>#${lastMap.number} ${esc(lastMap.title)}<\/strong>\n        <p>${lastMap.counts.frontier} next up · ${lastMap.counts.claimed} claimed<\/p><\/div>\n        <span class=\"nv-go\">${icon('arrow')}<\/span><\/a>\n      <section class=\"section\"><div class=\"section-head\"><h2>Repositories with maps<\/h2><\/div>\n        <div class=\"repo-grid\">${REPOS.map(\n          (r) => `<a class=\"card repo-card\" href=\"#\" ${goRepo(r)}>${repoMark(r, 20)}<span class=\"grow\">${esc(r.name)}<\/span>\n            <span class=\"nv-meta\">${r.maps.length} map${r.maps.length === 1 ? '' : 's'}<\/span>${icon('arrow').replace('class=\"i\"', 'class=\"i go\"')}<\/a>`,\n        ).join('')}<\/div><\/section>\n    <\/div>`;\n  }\n\n  function mapCard(repo, map) {\n    return `<a class=\"card map-card\" href=\"#\" ${goMap(repo, map)}>\n      <div><p class=\"eyebrow\">Map · #${map.number}${map.closed ? ' · completed' : ''}<\/p><h2>${esc(map.title)}<\/h2><\/div>\n      <p class=\"dest\">${esc(map.dest)}<\/p>${summary(map.counts)}<\/a>`;\n  }\n\n  function repoBody(s, { head = true } = {}) {\n    const repo = repoOf(s.repo);\n    return `<div class=\"sheet\">\n      ${head ? `<div class=\"page-head\"><div class=\"grow\"><p class=\"eyebrow\">Repository<\/p><h1 class=\"nv-h1\">${repoMark(repo, 26)}${esc(repo.name)}<\/h1><\/div><\/div>` : ''}\n      <div class=\"map-grid\">${repo.maps.map((m) => mapCard(repo, m)).join('')}<\/div>\n    <\/div>`;\n  }\n\n  function protoTile(repo, p) {\n    return `<a class=\"card nv-proto\" href=\"#\" data-to=\"prototype #${p.ticket} full size\">\n      <span class=\"nv-thumb${p.img ? ' has-img' : ''}\">${p.img ? '<img src=\"__PNG__\" alt=\"\">' : `<i><\/i><i><\/i><i><\/i>`}<\/span>\n      <span class=\"nv-proto-body\"><span class=\"eyebrow\">#${p.ticket} · map #${p.map} · ${esc(p.date)}<\/span><strong>${esc(p.title)}<\/strong><span class=\"nv-meta\">${esc(p.gist)}<\/span><\/span><\/a>`;\n  }\n\n  function protosBody(s, { head = true, map = null } = {}) {\n    const repo = repoOf(s.repo);\n    const list = repo.prototypes.filter((p) => map === null || p.map === map);\n    return `<div class=\"sheet\">\n      ${head ? `<div class=\"page-head\"><div class=\"grow\"><p class=\"eyebrow\">Prototypes${map === null ? '' : ` · map #${map}`}<\/p><h1 class=\"nv-h1\">${repoMark(repo, 26)}${esc(repo.name)}<\/h1><p>Every prototype a ticket in this repository left behind.<\/p><\/div><\/div>` : ''}\n      ${list.length ? `<div class=\"nv-proto-grid\">${list.map((p) => protoTile(repo, p)).join('')}<\/div>` : `<div class=\"empty\"><strong>No prototypes yet<\/strong><p>Prototype tickets leave their work on a prototype/&lt;n&gt;-&lt;slug&gt; branch.<\/p><\/div>`}\n    <\/div>`;\n  }\n\n  function newBody(s) {\n    const repo = repoOf(s.repo);\n    return `<div class=\"sheet nv-new\">\n      <div class=\"page-head\"><div class=\"grow\"><p class=\"eyebrow\">Start a new map<\/p><h1>Where should this map go?<\/h1>\n        <p>Describe the destination. T3 Code opens a planning thread in the repository's clone and drafts the map with you.<\/p><\/div><\/div>\n      <div class=\"field\"><label>Repository<\/label><div class=\"row\"><input class=\"input\" value=\"${esc(repo.name)}\" /><button class=\"ghost\" data-to=\"the repository picker\">Change<\/button><\/div><\/div>\n      <div class=\"field\"><label>Destination<\/label><textarea class=\"input nv-textarea\" placeholder=\"e.g. Users can export a map as a shareable image\"><\/textarea><\/div>\n      <p class=\"hint\">Runs as Mid in T3 Code · clone at C:\\\\src\\\\${esc(short(repo.name))}<\/p>\n      <div class=\"nv-actions\"><button class=\"primary\" data-to=\"T3 Code with a planning thread\">${icon('play')}Start in T3 Code<\/button><button class=\"ghost\" data-to=\"the clipboard\">${icon('copy')}Copy prompt<\/button><\/div>\n    <\/div>`;\n  }\n\n  /* ---------- the map page ---------- */\n\n  const NODE_W = 232;\n  const NODE_H = 104;\n  const COL_GAP = 72;\n  const ROW_GAP = 18;\n\n  function mapLayout(tickets) {\n    const rows = {};\n    return tickets.map((t) => {\n      const row = (rows[t.col] = (rows[t.col] ?? -1) + 1);\n      return { ...t, x: 28 + t.col * (NODE_W + COL_GAP), y: 26 + row * (NODE_H + ROW_GAP) };\n    });\n  }\n\n  function nodeHtml(t) {\n    const st = STATES[t.state];\n    const meta = t.state === 'blocked' ? `blocked by ${t.blockers.map((n) => `#${n}`).join(', ')}` : t.state === 'claimed' || t.state === 'done' ? '@RAbdelrhman' : TYPES[t.type][0];\n    return `<button type=\"button\" class=\"node${t.state === 'done' ? ' is-done' : ''}\" data-to=\"ticket #${t.number} in the inspector\" style=\"--accent: var(${st.v}); left:${t.x}px; top:${t.y}px; width:${NODE_W}px; height:${NODE_H}px\">\n      <span class=\"node-top\"><span class=\"glyph\">${icon(TYPES[t.type][1])}<\/span><span class=\"num\">#${t.number}<\/span><span class=\"chip\" style=\"--accent: var(${st.v})\">${icon(st.icon)}${st.label}<\/span><\/span>\n      <span class=\"title\">${esc(t.title)}<\/span><span class=\"meta\">${esc(meta)}<\/span><\/button>`;\n  }\n\n  function edges(laid) {\n    const at = Object.fromEntries(laid.map((t) => [t.number, t]));\n    return laid\n      .flatMap((t) =>\n        t.blockers\n          .filter((b) => at[b])\n          .map((b) => {\n            const a = at[b];\n            const x1 = a.x + NODE_W;\n            const y1 = a.y + NODE_H / 2;\n            const x2 = t.x;\n            const y2 = t.y + NODE_H / 2;\n            const mid = (x1 + x2) / 2;\n            return `<path d=\"M${x1} ${y1}C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}\" class=\"is-live\"/>`;\n          }),\n      )\n      .join('');\n  }\n\n  function filters(map) {\n    const c = map.counts;\n    const chip = (label, n, st, on) =>\n      `<button type=\"button\" class=\"fchip${on ? ' is-on' : ''}\"${st ? ` style=\"--accent: var(${STATES[st].v})\"` : ''}${n === 0 && !on ? ' disabled' : ''}>${st ? icon(STATES[st].icon) : ''}${label} <b>${n}<\/b><\/button>`;\n    const types = Object.entries(TYPES).map(([k, [label, ic]]) => `<button type=\"button\" class=\"fchip\">${icon(ic)}${label} <b>${(map.tickets ?? []).filter((t) => t.type === k).length}<\/b><\/button>`);\n    return `<div class=\"filters\">${chip('All', total(c), null, true)}${['frontier', 'claimed', 'blocked', 'done'].map((s) => chip(STATES[s].long, c[s], s)).join('')}<span class=\"filter-sep\" role=\"none\"><\/span>${types.join('')}<\/div>`;\n  }\n\n  function inspector(repo, map) {\n    return `<aside class=\"inspector\"><div class=\"insp-tabs\"><div class=\"segmented\"><button class=\"seg is-on\">Brief<\/button><button class=\"seg\" disabled>Ticket<\/button><\/div><\/div>\n      <div class=\"insp-panel brief\"><p class=\"eyebrow\">Map · #${map.number}<\/p><h1>${esc(map.title)}<\/h1>${summary(map.counts)}\n      <div class=\"tabs nv-insp-tabs\"><button class=\"tab is-on\">Destination<\/button><button class=\"tab\">Not yet specified<\/button><button class=\"tab\">Decided<\/button><\/div>\n      <div class=\"prose\"><p>${esc(map.dest)}<\/p><\/div><\/div><\/aside>`;\n  }\n\n  function tableView(map) {\n    return `<div class=\"nv-table\"><table><thead><tr><th>#<\/th><th>Title<\/th><th>Type<\/th><th>State<\/th><\/tr><\/thead><tbody>${map.tickets\n      .map(\n        (t) =>\n          `<tr><td class=\"num\">#${t.number}<\/td><td>${esc(t.title)}<\/td><td><span class=\"nv-cell\">${icon(TYPES[t.type][1])}${TYPES[t.type][0]}<\/span><\/td><td><span class=\"chip\" style=\"--accent: var(${STATES[t.state].v});margin:0\">${icon(STATES[t.state].icon)}${STATES[t.state].label}<\/span><\/td><\/tr>`,\n      )\n      .join('')}<\/tbody><\/table><\/div>`;\n  }\n\n  /** The map page's body under the topbar: filters, canvas (or table / prototypes) and inspector. */\n  function mapBody(s) {\n    const repo = repoOf(s.repo);\n    const map = mapOf(repo, s.map);\n    if (!map.tickets) map.tickets = MAP_35.slice(0, 0);\n    const laid = mapLayout(map.tickets);\n    const stage =\n      s.mapView === 'table'\n        ? tableView(map)\n        : s.mapView === 'prototypes'\n          ? `<div class=\"nv-stage-scroll\">${protosBody(s, { head: false, map: map.number })}<\/div>`\n          : `<div class=\"canvas-wrap nv-canvas\"><div class=\"canvas\" style=\"width:1560px;height:720px\"><svg class=\"edges\" width=\"1560\" height=\"720\">${edges(laid)}<\/svg><div class=\"nodes\">${laid\n              .map(nodeHtml)\n              .join('')}<\/div><\/div>${\n              laid.length ? '' : '<div class=\"empty\" style=\"position:absolute;inset:40px\">This map is fake in the prototype: open map #35 to see tickets.<\/div>'\n            }<\/div>\n            <div class=\"keybox\"><button type=\"button\" class=\"floatbox keybtn\">${icon('info')}Key<\/button><\/div>\n            <div class=\"zoom floatbox\"><button class=\"iconbtn\">${icon('minus')}<\/button><button class=\"iconbtn pct\">100%<\/button><button class=\"iconbtn\">${icon('plus')}<\/button><\/div>`;\n    return `${s.mapView === 'map' || !s.mapView ? filters(map) : ''}<div class=\"body\"><section class=\"stage\">${stage}<\/section>${inspector(repo, map)}<\/div>`;\n  }\n\n  /* ---------- menus and the jump palette ---------- */\n\n  function repoMenu(s, view = 'repo') {\n    return REPOS.map(\n      (r) => `<button type=\"button\" class=\"menu-item${r.name === s.repo ? ' is-on' : ''}\" ${goRepo(r, view)}>${repoMark(r)}<span class=\"grow\">${esc(r.name)}<\/span><span class=\"nv-meta\">${r.maps.length}<\/span><\/button>`,\n    ).join('');\n  }\n\n  function mapMenu(s) {\n    const repo = repoOf(s.repo);\n    return `<div class=\"menu-label\">Maps in ${esc(short(repo.name))}<\/div>${repo.maps\n      .map(\n        (m) =>\n          `<button type=\"button\" class=\"menu-item${s.view === 'map' && m.number === s.map ? ' is-on' : ''}\" ${goMap(repo, m)}>${miniRing(m.counts)}<span class=\"grow\">#${m.number} ${esc(m.title)}<\/span><\/button>`,\n      )\n      .join('')}<div class=\"menu-sep\"><\/div><button type=\"button\" class=\"menu-item\" ${go('new')}>${icon('plus')}<span class=\"grow\">Start a new map<\/span><\/button>`;\n  }\n\n  function paletteItems(query) {\n    const q = query.trim().toLowerCase();\n    const items = [{ label: 'Start a new map', meta: 'Action', attrs: go('new'), ic: 'plus' }, { label: 'Home', meta: 'Page', attrs: go('home'), ic: 'home' }];\n    for (const r of REPOS) {\n      items.push({ label: r.name, meta: 'Repository', attrs: goRepo(r), mark: r });\n      for (const m of r.maps) items.push({ label: `#${m.number} ${m.title}`, meta: `Map · ${short(r.name)}`, attrs: goMap(r, m), ring: m.counts });\n    }\n    for (const t of MAP_35) items.push({ label: `#${t.number} ${t.title}`, meta: 'Ticket · map #35', attrs: goMap(REPOS[0], REPOS[0].maps[0]), ic: TYPES[t.type][1] });\n    return items.filter((i) => !q || i.label.toLowerCase().includes(q) || i.meta.toLowerCase().includes(q)).slice(0, 9);\n  }\n\n  function renderPalette(query) {\n    const list = document.querySelector('.nv-palette-list');\n    if (!list) return;\n    const items = paletteItems(query);\n    list.innerHTML = items.length\n      ? items\n          .map(\n            (i, n) =>\n              `<button type=\"button\" class=\"menu-item${n === 0 ? ' is-on' : ''}\" ${i.attrs}>${i.mark ? repoMark(i.mark) : i.ring ? miniRing(i.ring) : icon(i.ic)}<span class=\"grow\">${esc(i.label)}<\/span><span class=\"nv-meta\">${esc(i.meta)}<\/span><\/button>`,\n          )\n          .join('')\n      : '<p class=\"hint\" style=\"padding:10px 12px\">Nothing matches.<\/p>';\n    Kit.fillIcons(list);\n  }\n\n  function openPalette() {\n    closeMenus();\n    let el = document.querySelector('.nv-palette');\n    if (!el) {\n      el = document.createElement('div');\n      el.className = 'nv-palette';\n      el.innerHTML = `<div class=\"nv-palette-box\" role=\"dialog\" aria-label=\"Jump to\"><label class=\"search nv-palette-search\">${icon('lens')}<input type=\"search\" placeholder=\"Jump to a repository, map or ticket…\" autocomplete=\"off\"><kbd>Esc<\/kbd><\/label><div class=\"nv-palette-list\"><\/div><\/div>`;\n      document.body.append(el);\n      el.addEventListener('click', (e) => {\n        if (e.target === el) closePalette();\n      });\n      el.querySelector('input').addEventListener('input', (e) => renderPalette(e.target.value));\n      el.querySelector('input').addEventListener('keydown', (e) => {\n        if (e.key === 'Enter') el.querySelector('.menu-item.is-on')?.click();\n      });\n    }\n    el.hidden = false;\n    el.querySelector('input').value = '';\n    renderPalette('');\n    el.querySelector('input').focus();\n  }\n  function closePalette() {\n    const el = document.querySelector('.nv-palette');\n    if (el) el.hidden = true;\n  }\n\n  function closeMenus(except) {\n    for (const m of document.querySelectorAll('.menu[data-menu-for]')) if (m !== except) m.hidden = true;\n    for (const b of document.querySelectorAll('[data-menu]')) if (!except || b.dataset.menu !== except.dataset.menuFor) b.setAttribute('aria-expanded', 'false');\n  }\n\n  /* ---------- state and rendering ---------- */\n\n  const params = new URLSearchParams((window.__Q || location.search));\n  const state = {\n    view: params.get('view') ?? 'home',\n    repo: REPOS[0].name,\n    map: 35,\n    mapView: params.get('mapview') ?? 'map',\n    expanded: {},\n  };\n  let shell = null;\n\n  function render() {\n    closePalette();\n    document.getElementById('root').innerHTML = shell(state, body(state));\n    Kit.fillIcons();\n    document.querySelector('.page')?.scrollTo(0, 0);\n  }\n\n  function body(s, opts) {\n    switch (s.view) {\n      case 'repo':\n        return repoBody(s, opts);\n      case 'protos':\n        return protosBody(s, opts);\n      case 'new':\n        return newBody(s, opts);\n      case 'map':\n        return mapBody(s, opts);\n      default:\n        return homeBody(s, opts);\n    }\n  }\n\n  document.addEventListener('click', (e) => {\n    const toggle = e.target.closest('[data-menu]');\n    if (toggle) {\n      e.preventDefault();\n      const menu = document.querySelector(`.menu[data-menu-for=\"${toggle.dataset.menu}\"]`);\n      closeMenus(menu);\n      menu.hidden = !menu.hidden;\n      toggle.setAttribute('aria-expanded', String(!menu.hidden));\n      return;\n    }\n    if (e.target.closest('[data-palette]')) {\n      e.preventDefault();\n      openPalette();\n      return;\n    }\n    const expand = e.target.closest('[data-expand]');\n    if (expand) {\n      e.preventDefault();\n      e.stopPropagation();\n      state.expanded[expand.dataset.expand] = !state.expanded[expand.dataset.expand];\n      render();\n      return;\n    }\n    const link = e.target.closest('[data-view]');\n    if (link) {\n      e.preventDefault();\n      state.view = link.dataset.view;\n      if (link.dataset.repo) state.repo = link.dataset.repo;\n      if (link.dataset.map) state.map = Number(link.dataset.map);\n      state.mapView = link.dataset.mapview ?? (link.dataset.view === 'map' && !link.dataset.map ? state.mapView : 'map');\n      if (link.dataset.repo) state.expanded[link.dataset.repo] = true;\n      render();\n      return;\n    }\n    if (!e.target.closest('.menu')) closeMenus();\n  });\n\n  document.addEventListener('keydown', (e) => {\n    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {\n      e.preventDefault();\n      openPalette();\n    } else if (e.key === 'Escape') {\n      closePalette();\n      closeMenus();\n    }\n  });\n\n  window.NAV = {\n    STATES,\n    REPOS,\n    icon,\n    esc,\n    repoOf,\n    mapOf,\n    short,\n    repoMark,\n    ring,\n    miniRing,\n    go,\n    goRepo,\n    goMap,\n    repoMenu,\n    mapMenu,\n    body,\n    state,\n    render,\n    /** The next ticket to start on the current map: the first frontier ticket. */\n    nextTicket: (s) => (mapOf(repoOf(s.repo), s.map).tickets ?? []).find((t) => t.state === 'frontier') ?? null,\n    start(fn) {\n      shell = fn;\n      state.expanded[state.repo] = true;\n      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);\n      else render();\n    },\n  };\n})();\n<\/script>\n    <script>\n      const { icon, esc, repoOf, mapOf, short, repoMark, go, goRepo, goMap, state } = NAV;\n\n      // Open everywhere except the map page, which needs its width. Folding is remembered per page kind.\n      const folded = { map: new URLSearchParams((window.__Q || location.search)).get('side') !== 'open' };\n      if (new URLSearchParams((window.__Q || location.search)).get('side') === 'folded') folded[state.view] = true;\n      const isFolded = (s) => !!folded[s.view];\n      document.addEventListener('click', (e) => {\n        if (!e.target.closest('[data-fold]')) return;\n        folded[state.view] = !isFolded(state);\n        NAV.render();\n      });\n\n      const inRepo = (s, r) => s.repo === r.name && s.view !== 'home' && s.view !== 'new';\n\n      /* ---------- open sidebar ---------- */\n\n      function tree(s) {\n        const row = (attrs, inner, cls = '') => `<a class=\"row${cls}\" href=\"#\" ${attrs}>${inner}<\/a>`;\n        const repos = NAV.REPOS.map((r) => {\n          const open = !!s.expanded[r.name];\n          const here = inRepo(s, r);\n          const twist = `<span class=\"twist${open ? ' is-open' : ''}\" data-expand=\"${esc(r.name)}\" role=\"button\" aria-label=\"${open ? 'Collapse' : 'Expand'}\">${icon('right')}<\/span>`;\n          const kids = open\n            ? `<div class=\"kids\">${r.maps\n                .map((m) => row(goMap(r, m), `${NAV.miniRing(m.counts)}<span class=\"grow\">#${m.number} ${esc(m.title)}<\/span>`, here && s.view === 'map' && s.map === m.number ? ' is-on' : ''))\n                .join('')}<\/div>`\n            : '';\n          return row(goRepo(r), `${twist}${repoMark(r)}<span class=\"grow\">${esc(short(r.name))}<\/span>`, here && s.view === 'repo' ? ' is-on' : here ? ' is-trail' : '') + kids;\n        }).join('');\n        return `${row(go('home'), `${icon('home')}<span class=\"grow\">Home<\/span>`, s.view === 'home' ? ' is-on' : '')}<div class=\"tree-label\">Repositories<\/div>${repos}`;\n      }\n\n      function side(s) {\n        return `<nav class=\"side\" aria-label=\"App\">\n          <div class=\"side-head\"><a class=\"logo\" href=\"#\" ${go('home')} aria-label=\"Wayfinder Home\">${icon('compass')}<\/a><b>Wayfinder<\/b>\n            <button type=\"button\" class=\"fold\" data-fold title=\"Fold the sidebar\" aria-label=\"Fold the sidebar\">${icon('panel')}<\/button><\/div>\n          <div class=\"side-actions\">\n            <a class=\"primary\" href=\"#\" ${go('new')}>${icon('plus')}Start a new map<\/a>\n            <button type=\"button\" class=\"search\" data-palette>${icon('lens')}<span class=\"ph\">Jump to…<\/span><kbd>Ctrl K<\/kbd><\/button>\n          <\/div>\n          <div class=\"tree\">${tree(s)}<\/div>\n          <div class=\"side-foot\"><span class=\"rail-mark\">R<\/span><span class=\"grow\">ramon<\/span>\n            <button type=\"button\" class=\"rail-btn\" data-to=\"a refresh\" aria-label=\"Refresh\">${icon('refresh')}<\/button>\n            <button type=\"button\" class=\"rail-btn\" data-to=\"the theme switch\" aria-label=\"Theme\">${icon('moon')}<\/button><\/div>\n        <\/nav>`;\n      }\n\n      /* ---------- folded sidebar ---------- */\n\n      // Same order as the open sidebar: New map, Jump to, Home, then one mark per repository whose flyout is its subtree.\n      function mini(s) {\n        const repos = NAV.REPOS.map((r) => {\n          const here = inRepo(s, r);\n          const items = `<div class=\"menu-label\">${esc(r.name)}<\/div>\n            <button type=\"button\" class=\"menu-item${here && s.view === 'repo' ? ' is-on' : ''}\" ${goRepo(r)}>${icon('graph')}<span class=\"grow\">All maps<\/span><span class=\"nv-meta\">${r.maps.length}<\/span><\/button>\n            ${r.maps\n              .map \n.dhead .chip {\r\n  margin-left: 4px;\r\n}\r\n\r\n.dhead .iconbtn {\r\n  margin-left: auto;\r\n  width: 30px;\r\n  height: 30px;\r\n}\r\n\r\n.dtitle {\r\n  margin: 12px 0;\r\n  font-size: 18px;\r\n  font-weight: 650;\r\n  line-height: 1.35;\r\n  letter-spacing: -0.01em;\r\n}\r\n\r\n.banner {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  gap: 10px;\r\n  margin-bottom: 14px;\r\n  padding: 10px 12px;\r\n  border-radius: 10px;\r\n  background: color-mix(in srgb, var(--accent) 10%, transparent);\r\n  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);\r\n  color: var(--text-secondary);\r\n  font-size: 13px;\r\n}\r\n\r\n.banner .i {\r\n  margin-top: 2px;\r\n  color: var(--accent);\r\n}\r\n\r\n.banner b {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.facts {\r\n  display: grid;\r\n  grid-template-columns: 90px minmax(0, 1fr);\r\n  gap: 8px 12px;\r\n  margin: 0 0 16px;\r\n  font-size: 13px;\r\n}\r\n\r\n.facts dt {\r\n  color: var(--text-muted);\r\n}\r\n\r\n.facts dd {\r\n  margin: 0;\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  align-items: center;\r\n  gap: 6px;\r\n  color: var(--text-secondary);\r\n  min-width: 0;\r\n}\r\n\r\n.facts dd .i {\r\n  width: 13px;\r\n  height: 13px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.launch {\r\n  margin-bottom: 16px;\r\n  padding: 12px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  background: var(--wash);\r\n}\r\n\r\n.launch-actions {\r\n  display: flex;\r\n  gap: 8px;\r\n}\r\n\r\n.launch-actions .primary {\r\n  flex: 1;\r\n}\r\n\r\n.clone-hint {\r\n  margin: 0 0 10px;\r\n}\r\n\r\n.clone-row {\r\n  display: flex;\r\n  gap: 6px;\r\n  min-width: 0;\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.clone-row select {\r\n  flex: 1 1 auto;\r\n  min-width: 0;\r\n  padding: 6px 8px;\r\n  background: var(--surface-1);\r\n  color: var(--text-primary);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 8px;\r\n  font: inherit;\r\n  font-size: 12px;\r\n}\r\n\r\n.runwith {\r\n  display: grid;\ ver {\r\n  color: var(--state-claimed);\r\n}\r\n\r\n.proto-date {\r\n  flex: none;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n.proto-verdict {\r\n  margin: 4px 0 10px;\r\n  padding: 8px 12px;\r\n  border-left: 3px solid var(--state-done);\r\n  background: var(--wash);\r\n  border-radius: 0 8px 8px 0;\r\n  max-height: 220px;\r\n  overflow: auto;\r\n}\r\n\r\n.proto-verdict .prose {\r\n  margin-top: 4px;\r\n}\r\n\r\n.proto-actions {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 8px;\r\n  margin: 10px 0;\r\n}\r\n\r\n.proto-actions .primary {\r\n  text-decoration: none;\r\n}\r\n\r\n.proto .sec code,\r\n.ticket-proto .sec code {\r\n  font-size: 11px;\r\n}\r\n\r\n.proto-files {\r\n  margin: 8px 0 0;\r\n  padding-left: 18px;\r\n  font: 12px ui-monospace, 'Cascadia Code', Consolas, monospace;\r\n  color: var(--text-secondary);\r\n  overflow-wrap: anywhere;\r\n}\r\n\r\n.ticket-proto {\r\n  margin-bottom: 16px;\r\n  padding: 12px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n}\r\n\r\n.ticket-proto .sec {\r\n  padding-bottom: 0;\r\n}\r\n\r\n/* ---------- home and repository pages ---------- */\r\n\r\n/*\r\n  Home borrows the map page's shell: the same 56px rail, the same 56px top bar, the same\r\n  surfaces and hairlines. Only the middle scrolls, so the chrome stays put exactly as it\r\n  does on a map.\r\n*/\r\n\r\n.rail-btn.is-on[href] {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.rail-mark {\r\n  width: 30px;\r\n  height: 30px;\r\n  margin-top: 6px;\r\n  border-radius: 9px;\r\n  display: grid;\r\n  place-items: center;\r\n  background: var(--state-claimed);\r\n  color: #fff;\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  flex: none;\r\n}\r\n\r\n.topbar-spacer {\r\n  flex: 1;\r\n  min-width: 8px;\r\n}\r\n\r\n.topbar .primary {\r\n  flex: none;\r\n  margin-right: 8px;\r\n  text-decoration: none;\r\n}\r\n\r\n.crumbs a {\r\n  color: inherit;\r\n  text-decoration: none;\r\n}\r\n\r\n. play: grid;\r\n  gap: 8px;\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.field > label {\r\n  font-size: 12.5px;\r\n  font-weight: 600;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.field .row {\r\n  display: flex;\r\n  gap: 8px;\r\n}\r\n\r\n.input {\r\n  flex: 1;\r\n  min-width: 0;\r\n  height: 34px;\r\n  padding: 0 10px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 9px;\r\n  background: var(--plane);\r\n  color: var(--text-primary);\r\n  font: inherit;\r\n  font-size: 13px;\r\n}\r\n\r\ntextarea.input {\r\n  height: auto;\r\n  padding: 9px 10px;\r\n  line-height: 1.55;\r\n  resize: vertical;\r\n}\r\n\r\n.input:focus {\r\n  outline: 0;\r\n  border-color: var(--state-claimed);\r\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--state-claimed) 25%, transparent);\r\n}\r\n\r\n.input::placeholder {\r\n  color: var(--text-muted);\r\n}\r\n\r\n.select {\r\n  height: 30px;\r\n  padding: 0 6px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 8px;\r\n  background: var(--plane);\r\n  color: var(--text-primary);\r\n  font: inherit;\r\n  font-size: 13px;\r\n}\r\n\r\n.page .empty {\r\n  padding: 44px 20px;\r\n  border: 1px dashed var(--gridline);\r\n  border-radius: 12px;\r\n  font-size: 13px;\r\n}\r\n\r\n.page .empty strong {\r\n  display: block;\r\n  margin-bottom: 6px;\r\n  font-size: 14px;\r\n  font-weight: 600;\r\n  color: var(--text-primary);\r\n}\r\n\r\n.page .empty p {\r\n  margin: 0 0 12px;\r\n  line-height: 1.55;\r\n}\r\n\r\n.loading {\r\n  padding: 44px 20px;\r\n  text-align: center;\r\n  color: var(--text-muted);\r\n  font-size: 13px;\r\n}\r\n\r\n.failure {\r\n  color: #e5484d;\r\n}\r\n\r\n@media (max-width: 720px) {\r\n  .sheet {\r\n    padding: 22px 16px 64px;\r\n  }\r\n\r\n  .topbar .primary span {\r\n    display: none;\r\n  }\r\n\r\n  .page-head {\r\n    flex-direction: column;\r\n    gap: 12px;\r\n  }\r\n}\r\n\r\n.page-form {\r\n  max-width: 620px;\r\n}\r\n\r\n.version {\r\n  margin-top: 44px;\r\n  text-align: center;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- prototypes on Home's repository pages ---------- */\r\n\r\n.proto-badge {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  align-self: start;\r\n  margin-top: 10px;\r\n  padding: 3px 9px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 999px;\r\n  font-size: 12px;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.proto-badge .i {\r\n  width: 13px;\r\n  height: 13px;\r\n}\r\n\r\n.proto-grid {\r\n  display: grid;\r\n  gap: 12px;\r\n}\r\n\r\n.proto-card {\r\n  display: block;\r\n  padding: 16px 18px;\r\n}\r\n\r\n.proto-card-head {\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 12px;\r\n}\r\n\r\n.proto-card h2 {\r\n  margin: 2px 0 0;\r\n  font-size: 16px;\r\n}\r\n\r\n.proto-card .proto-actions {\r\n  margin-bottom: 0;\r\n}\r\n\r\n.proto-card .proto-verdict {\r\n  max-height: none;\r\n  overflow: visible;\r\n}\r\n\r\n.proto-verdict.is-collapsible > summary {\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 10px;\r\n  cursor: pointer;\r\n  list-style: none;\r\n}\r\n\r\n.proto-verdict.is-collapsible > summary::-webkit-details-marker {\r\n  display: none;\r\n}\r\n\r\n.proto-verdict.is-collapsible > summary .gist {\r\n  flex: 1;\r\n  min-width: 0;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.proto-verdict.is-collapsible[open] > summary .gist {\r\n  display: none;\r\n}\r\n\r\n.proto-verdict.is-collapsible > summary::after {\r\n  content: 'Read';\r\n  font-size: 11px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.proto-verdict.is-collapsible[open] > summary::after {\r\n  content: 'Hide';\r\n}\r\n\r\n\r\n/* ---------- Add New Page (/new-map) Split Layout ---------- */\r\n\r\n.add-new-shell {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 24px;\r\n}\r\n\r\n.add-new-repo-bar {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 14px;\r\n  flex-wrap: wrap;\r\n  padding: 14px 18px; \r\n}\r\n\r\n.add-new-card-titles {\r\n  flex: 1;\r\n  min-width: 0;\r\n}\r\n\r\n.add-new-card-titles h2 {\r\n  font-size: 18px;\r\n  font-weight: 600;\r\n  margin: 2px 0 4px 0;\r\n  color: var(--text-primary);\r\n}\r\n\r\n.add-new-card-titles .card-blurb {\r\n  font-size: 13px;\r\n  color: var(--text-secondary);\r\n  line-height: 1.45;\r\n  margin: 0;\r\n}\r\n\r\n.add-new-card .field {\r\n  margin-bottom: 16px;\r\n}\r\n\r\n.add-new-card .field label {\r\n  display: block;\r\n  font-size: 12px;\r\n  font-weight: 600;\r\n  color: var(--text-secondary);\r\n  margin-bottom: 6px;\r\n}\r\n\r\n.ticket-preview-box {\r\n  min-height: 108px;\r\n  padding: 14px 16px;\r\n  border-radius: 8px;\r\n  border: 1px dashed var(--baseline);\r\n  background: var(--plane);\r\n  margin-bottom: 18px;\r\n  font-size: 13px;\r\n  display: flex;\r\n  flex-direction: column;\r\n  justify-content: center;\r\n  transition: all 0.2s ease;\r\n}\r\n\r\n.ticket-preview-box.is-empty {\r\n  color: var(--text-muted);\r\n  text-align: center;\r\n  border-style: dashed;\r\n}\r\n\r\n.ticket-preview-box.is-loading {\r\n  color: var(--text-secondary);\r\n  text-align: center;\r\n  font-style: italic;\r\n}\r\n\r\n.ticket-preview-box.is-error {\r\n  color: #d13636;\r\n  background: rgba(209, 54, 54, 0.06);\r\n  border-color: rgba(209, 54, 54, 0.3);\r\n  border-style: solid;\r\n}\r\n\r\n.ticket-preview-box:not(.is-empty):not(.is-loading):not(.is-error) {\r\n  border-style: solid;\r\n  border-color: var(--hairline);\r\n  background: var(--surface-1);\r\n  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);\r\n}\r\n\r\n.ticket-preview-header {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.ticket-preview-header .glyph {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.ticket-preview-num {\r\n  font-weight: 700;\r\n  color: var(--text-primary);\r\n  font-size: 14px;\r\n}\r\n\r\n.ticket-prev - models dialog ---------- */\r\n\r\n.dialog {\r\n  width: min(560px, calc(100vw - 32px));\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  background: var(--surface-1);\r\n  color: var(--text-primary);\r\n  padding: 16px;\r\n  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.24);\r\n}\r\n\r\n.dialog::backdrop {\r\n  background: rgba(0, 0, 0, 0.32);\r\n}\r\n\r\n.dialog-head {\r\n  display: flex;\r\n  align-items: center;\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.dialog-head h2 {\r\n  margin: 0;\r\n  font-size: 15px;\r\n}\r\n\r\n.detail-close {\r\n  margin-left: auto;\r\n  padding: 2px 6px;\r\n  border: 0;\r\n  border-radius: 6px;\r\n  background: none;\r\n  color: var(--text-muted);\r\n  font-size: 18px;\r\n  line-height: 1;\r\n}\r\n\r\n.detail-close:hover {\r\n  background: var(--wash);\r\n  color: var(--text-primary);\r\n}\r\n\r\n.dialog .hint {\r\n  margin: 0 0 14px;\r\n}\r\n\r\n.tier-row {\r\n  display: grid;\r\n  grid-template-columns: 150px minmax(0, 1fr);\r\n  gap: 12px;\r\n  align-items: center;\r\n  padding: 10px 0;\r\n  border-top: 1px solid var(--gridline);\r\n}\r\n\r\n.tier-name {\r\n  display: grid;\r\n  gap: 2px;\r\n  font-size: 13px;\r\n}\r\n\r\n.tier-name span {\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- toast ---------- */\r\n\r\n.toast {\r\n  position: fixed;\r\n  left: 50%;\r\n  bottom: 24px;\r\n  z-index: 70;\r\n  max-width: 70vw;\r\n  transform: translateX(-50%);\r\n  padding: 10px 16px;\r\n  border-radius: 10px;\r\n  background: var(--text-primary);\r\n  color: var(--surface-1);\r\n  font-size: 13px;\r\n  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);\r\n}\r\n\r\n@media (max-width: 1100px) {\r\n  .synced,\r\n  .search kbd {\r\n    display: none;\r\n  }\r\n\r\n  .body {\r\n    grid-template-columns: minmax(0, 1fr);\r\n    grid-template-rows: minmax(0, 1fr) 42vh;\r\n  }\r\n\r\n  .inspector {\r\n    border-left: 0;\r\n    border-top: 1px solid var(--hairline);\r\n  }\r\n}\r\n\r\n/* ---------- prototypes view ---------- */\r\n\r\n.app.is-prototypes .filters,\r\n.app.is-prototypes .keybox,\r\n.app.is-prototypes .zoom {\r\n  display: none;\r\n}\r\n\r\n.protowrap {\r\n  position: absolute;\r\n  inset: 0;\r\n  overflow: auto;\r\n  background: var(--surface-1);\r\n}\r\n\r\n.protowrap .empty code {\r\n  font-size: 11px;\r\n}\r\n\r\n.protolist {\r\n  display: grid;\r\n  gap: 12px;\r\n  max-width: 860px;\r\n  margin: 0 auto;\r\n  padding: 20px 24px 40px;\r\n}\r\n\r\n.protolist > .eyebrow {\r\n  margin: 0;\r\n}\r\n\r\n.proto {\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  padding: 14px 16px 4px;\r\n  background: var(--surface-1);\r\n}\r\n\r\n.proto-head {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.proto-title {\r\n  flex: 1;\r\n  min-width: 0;\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 8px;\r\n  padding: 0;\r\n  border: 0;\r\n  background: none;\r\n  text-align: left;\r\n  font-weight: 600;\r\n}\r\n\r\n.proto-title:hover {\r\n  color: var(--state-claimed);\r\n}\r\n\r\n.proto-date {\r\n  flex: none;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n  font-variant-numeric: tabular-nums;\r\n}\r\n\r\n.proto-verdict {\r\n  margin: 4px 0 10px;\r\n  padding: 8px 12px;\r\n  border-left: 3px solid var(--state-done);\r\n  background: var(--wash);\r\n  border-radius: 0 8px 8px 0;\r\n  max-height: 220px;\r\n  overflow: auto;\r\n}\r\n\r\n.proto-verdict .prose {\r\n  margin-top: 4px;\r\n}\r\n\r\n.proto-actions {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 8px;\r\n  margin: 10px 0;\r\n}\r\n\r\n.proto-actions .primary {\r\n  text-decoration: none;\r\n}\r\n\r\n.proto .sec code,\r\n.ticket-proto .sec code {\r\n  font-size: 11px;\r\n}\r\n\r\n.proto-files {\r\n  margin: 8px 0 0;\r\n  padding-left: 18px;\r\n  font: 12px ui-monospace, 'Cascadia Code', Consolas, monospace;\r\n  color: var(--text-secondary);\r\n  overflow-wrap: anywhere;\r\n}\r\n\r\n.ticket-proto {\r\n  margin-bottom: 16px;\r\n  padding: 12px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n}\r\n\r\n.ticket-proto .sec {\r\n  padding-bottom: 0;\r\n}\r\n\r\n/* ---------- home and repository pages ---------- */\r\n\r\n/*\r\n  Home borrows the map page's shell: the same 56px rail, the same 56px top bar, the same\r\n  surfaces and hairlines. Only the middle scrolls, so the chrome stays put exactly as it\r\n  does on a map.\r\n*/\r\n\r\n.rail-btn.is-on[href] {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.rail-mark {\r\n  width: 30px;\r\n  height: 30px;\r\n  margin-top: 6px;\r\n  border-radius: 9px;\r\n  display: grid;\r\n  place-items: center;\r\n  background: var(--state-claimed);\r\n  color: #fff;\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  flex: none;\r\n}\r\n\r\n.topbar-spacer {\r\n  flex: 1;\r\n  min-width: 8px;\r\n}\r\n\r\n.topbar .primary {\r\n  flex: none;\r\n  margin-right: 8px;\r\n  text-decoration: none;\r\n}\r\n\r\n.crumbs a {\r\n  color: inherit;\r\n  text-decoration: none;\r\n}\r\n\r\n.crumbs a:hover {\r\n  color: var(--text-primary);\r\n}\r\n\r\n.page {\r\n  flex: 1 1 auto;\r\n  min-height: 0;\r\n  overflow: auto;\r\n}\r\n\r\n.sheet {\r\n  width: min(940px, 100%);\r\n  margin: 0 auto;\r\n  padding: 30px 28px 80px;\r\n}\r\n\r\n.page-head {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  gap: 18px;\r\n  margin-bottom: 26px;\r\n}\r\n\r\n.page-head .grow {\r\n  flex: 1;\r\n  min-width: 0;\r\n}\r\n\r\n.page-head h1 {\r\n  margin: 7px 0 0;\r\n  font-size: 25px;\r\n  line-height: 1.22;\r\n  letter-spacing: -0.02em;\r\n  font-weight: 650;\r\n  overflow-wrap: anywhere;\r\n}\r\n\r\n.page-head p {\r\n  margin: 8px 0 0;\r\n  max-width: 64ch;\r\n  font-size: 13.5px;\r\n  line-height: 1.55;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.page-actions {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding-top: 6px;\r\n}\r\n\r\n.section {\r\n  margin-top: 30px;\r\n}\r\n\r\n.section-head {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  margin-bottom: 12px;\r\n}\r\n\r\n.section-head h2 {\r\n  margin: 0;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  letter-spacing: 0.08em;\r\n  text-transform: uppercase;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.section-head .grow {\r\n  flex: 1;\r\n}\r\n\r\n.card {\r\n  display: block;\r\n  padding: 16px;\r\n  background: var(--surface-1);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  color: inherit;\r\n  text-decoration: none;\r\n}\r\n\r\na.card:hover {\r\n  border-color: var(--state-claimed);\r\n}\r\n\r\n.panel {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n  margin-bottom: 12px;\r\n  padding: 13px 16px;\r\n  background: var(--surface-1);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 12px;\r\n  font-size: 13px;\r\n}\r\n\r\n.panel .grow {\r\n  flex: 1;\r\n  min-width: 0;\r\n}\r\n\r\n.panel strong {\r\n  font-weight: 600;\r\n}\r\n\r\n.panel p {\r\n  margin: 4px 0 0;\r\n  color: var(--text-secondary);\r\n  line-height: 1.5;\r\n}\r\n\r\n.panel.is-warning {\r\n  border-color: color-mix(in srgb, var(--state-blocked) 50%, transparent);\r\n  background: color-mix(in srgb, var(--state-blocked) 10%, var(--surface-1));\r\n}\r\n\r\n.panel.is-block {\r\n  display: block;\r\n}\r\n\r\n.avatar {\r\n  width: 30px;\r\n  height: 30px;\r\n  flex: none;\r\n  display: grid;\r\n  place-items: center;\r\n  border-radius: 9px;\r\n  background: var(--state-claimed);\r\n  color: #fff;\r\n  font-size: 13px;\r\n  font-weight: 700;\r\n}\r\n\r\n.repo-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));\r\n  gap: 8px;\r\n}\r\n\r\n.repo-card {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  padding: 12px 14px;\r\n  font-size: 13px;\r\n}\r\n\r\n.repo-card .i {\r\n  width: 15px;\r\n  height: 15px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.repo-card .grow {\r\n  flex: 1;\r\n  min-width: 0;\r\n  font-weight: 600;\r\n  white-space: nowrap;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n}\r\n\r\n.repo-card .go {\r\n  width: 14px;\r\n  height: 14px;\r\n  color: var(--text-muted);\r\n}\r\n\r\na.repo-card:hover .go {\r\n  color: var(--state-claimed);\r\n}\r\n\r\n.map-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));\r\n  gap: 12px;\r\n}\r\n\r\n.map-card {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 16px;\r\n  padding: 18px;\r\n}\r\n\r\n.map-card h2 {\r\n  margin: 6px 0 0;\r\n  font-size: 17px;\r\n  line-height: 1.32;\r\n  letter-spacing: -0.012em;\r\n  font-weight: 600;\r\n}\r\n\r\n.map-card .dest {\r\n  display: -webkit-box;\r\n  -webkit-line-clamp: 3;\r\n  line-clamp: 3;\r\n  -webkit-box-orient: vertical;\r\n  overflow: hidden;\r\n  margin: 0;\r\n  font-size: 13px;\r\n  line-height: 1.5;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.map-card .summary {\r\n  margin-top: auto;\r\n}\r\n\r\n/* forms: the same hairline-and-focus-ring language as the top bar's search */\r\n\r\n.field {\r\n  display: grid;\r\n  gap: 8px;\r\n  margin-bottom: 8px;\r\n}\r\n\r\n.field > label {\r\n  font-size: 12.5px;\r\n  font-weight: 600;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.field .row {\r\n  display: flex;\r\n  gap: 8px;\r\n}\r\n\r\n.input {\r\n  flex: 1;\r\n  min-width: 0;\r\n  height: 34px;\r\n  padding: 0 10px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 9px;\r\n  background: var(--plane);\r\n  color: var(--text-primary);\r\n  font: inherit;\r\n  font-size: 13px;\r\n}\r\n\r\ntextarea.input {\r\n  height: auto;\r\n  padding: 9px 10px;\r\n  line-height: 1.55;\r\n  resize: vertical;\r\n}\r\n\r\n.input:focus {\r\n  outline: 0;\r\n  border-color: var(--state-claimed);\r\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--state-claimed) 25%, transparent);\r\n}\r\n\r\n.input::placeholder {\r\n  color: var(--text-muted);\r\n}\r\n\r\n.select {\r\n  height: 30px;\r\n  padding: 0 6px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 8px;\r\n  background: var(--plane);\r\n  color: var(--text-primary);\r\n  font: inherit;\r\n  font-size: 13px;\r\n}\r\n\r\n.page .empty {\r\n  padding: 44px 20px;\r\n  border: 1px dashed var(--gridline);\r\n  border-radius: 12px;\r\n  font-size: 13px;\r\n}\r\n\r\n.page .empty strong {\r\n  display: block;\r\n  margin-bottom: 6px;\r\n  font-size: 14px;\r\n  font-weight: 600;\r\n  color: var(--text-primary);\r\n}\r\n\r\n.page .empty p {\r\n  margin: 0 0 12px;\r\n  line-height: 1.55;\r\n}\r\n\r\n.loading {\r\n  padding: 44px 20px;\r\n  text-align: center;\r\n  color: var(--text-muted);\r\n  font-size: 13px;\r\n}\r\n\r\n.failure {\r\n  color: #e5484d;\r\n}\r\n\r\n@media (max-width: 720px) {\r\n  .sheet {\r\n    padding: 22px 16px 64px;\r\n  }\r\n\r\n  .topbar .primary span {\r\n    display: none;\r\n  }\r\n\r\n  .page-head {\r\n    flex-direction: column;\r\n    gap: 12px;\r\n  }\r\n}\r\n\r\n.page-form {\r\n  max-width: 620px;\r\n}\r\n\r\n.version {\r\n  margin-top: 44px;\r\n  text-align: center;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n/* ---------- prototypes on Home's repository pages ---------- */\r\n\r\n.proto-badge {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  align-self: start;\r\n  margin-top: 10px;\r\n  padding: 3px 9px;\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 999px;\r\n  font-size: 12px;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.proto-badge .i {\r\n  width: 13px;\r\n  height: 13px;\r\n}\r\n\r\n.proto-grid {\r\n  display: grid;\r\n  gap: 12px;\r\n}\r\n\r\n.proto-card {\r\n  display: block;\r\n  padding: 16px 18px;\r\n}\r\n\r\n.proto-card-head {\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 12px;\r\n}\r\n\r\n.proto-card h2 {\r\n  margin: 2px 0 0;\r\n  font-size: 16px;\r\n}\r\n\r\n.proto-card .proto-actions {\r\n  margin-bottom: 0;\r\n}\r\n\r\n.proto-card .proto-verdict {\r\n  max-height: none;\r\n  overflow: visible;\r\n}\r\n\r\n.proto-verdict.is-collapsible > summary {\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 10px;\r\n  cursor: pointer;\r\n  list-style: none;\r\n}\r\n\r\n.proto-verdict.is-collapsible > summary::-webkit-details-marker {\r\n  display: none;\r\n}\r\n\r\n.proto-verdict.is-collapsible > summary .gist {\r\n  flex: 1;\r\n  min-width: 0;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n  color: var(--text-secondary);\r\n}\r\n\r\n.proto-verdict.is-collapsible[open] > summary .gist {\r\n  display: none;\r\n}\r\n\r\n.proto-verdict.is-collapsible > summary::after {\r\n  content: 'Read';\r\n  font-size: 11px;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.proto-verdict.is-collapsible[open] > summary::after {\r\n  content: 'Hide';\r\n}\r\n\r\n\r\n/* ---------- Add New Page (/new-map) Split Layout ---------- */\r\n\r\n.add-new-shell {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 24px;\r\n}\r\n\r\n.add-new-repo-bar {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 14px;\r\n  flex-wrap: wrap;\r\n  padding: 14px 18px;\r\n  background: var(--surface-1);\r\n  border: 1px solid var(--hairline);\r\n  border-radius: 10px;\r\n}\r\n\r\n.add-new-repo-bar label {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  font-weight: 600;\r\n  font-size: 13px;\r\n  color: var(--text-primary);\r\n  white-space: nowrap;\r\n}\r\n\r\n.add-new-repo-bar .repo-input-wrap {\r\n  flex: 1;\r\n  min-width: 240px;\r\n}\r\n\r\n.add-new-repo-bar .input {\r\n  width: 100%;\r\n}\r\n\r\n.recent-repos-hint {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  font-size: 12px;\r\n  color: var(--text-muted);\r\n  flex-wrap: wrap;\r\n}\r\n\r\n.repo-pill {\r\n  appearance: none;\r\n  border: 1px solid var(--baseline);\r\n  background: var(--plane);\r\n  color: var(--text-secondary);\r\n  padding: 3px 9px;\r\n  border-radius: 999px;\r\n  font-size: 12px;\r\n  cursor: pointer;\r\n  transition: all 0.15s ease;\r\n}\r\n\r\n.repo-pill:hover {\r\n  background: var(--surface-1);\r\n ,\n      mark: 'EL',\n      hue: 280,\n      updated: 'last week',\n      maps: [\n        { number: 11, title: 'Lockstep sync across regions', dest: 'Every region applies the same ordered log.', counts: counts(2, 5, 2, 14) },\n        { number: 19, title: 'Operator dashboard', dest: 'One screen for replication lag and failovers.', counts: counts(0, 3, 1, 4) },\n      ],\n      prototypes: [],\n    },\n  ];\n\n  const esc = Kit.esc;\n  const icon = Kit.icon;\n  const repoOf = (name) => REPOS.find((r) => r.name === name) ?? REPOS[0];\n  const mapOf = (repo, number) => repo.maps.find((m) => m.number === number) ?? repo.maps[0];\n  const total = (c) => c.claimed + c.blocked + c.frontier + c.done;\n  const short = (name) => name.split('/')[1];\n\n  /** The repository identity mark, like the map page's topbar mark. */\n  const repoMark = (repo, size = 18) =>\n    `<span class=\"nv-mark\" style=\"--h:${repo.hue};width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px\">${esc(repo.mark)}<\/span>`;\n\n  /** chrome.ts's progress ring, at any size. */\n  function ring(c, size = 76, stroke = 7) {\n    const all = total(c);\n    const r = (size - stroke) / 2;\n    const circ = 2 * Math.PI * r;\n    let off = 0;\n    const arcs = ['done', 'claimed', 'frontier', 'blocked']\n      .filter((s) => c[s] > 0)\n      .map((s) => {\n        const len = (c[s] / all) * circ;\n        const gap = c[s] === all ? 0 : size < 30 ? 1.5 : 3;\n        const arc = `<circle cx=\"${size / 2}\" cy=\"${size / 2}\" r=\"${r}\" fill=\"none\" stroke=\"var(${STATES[s].v})\" stroke-width=\"${stroke}\" stroke-dasharray=\"${Math.max(0, len - gap)} ${circ}\" stroke-dashoffset=\"${-off}\"/>`;\n        off += len;\n        return arc;\n      })\n      .join('');\n    return `<svg viewBox=\"0 0 ${size} ${size}\" width=\"${size}\" height=\"${size}\" style=\"transform:rotate(-90deg)\" aria-hidden=\"true\">${arcs}<\/svg>`;\n  }\n  const miniRing = (c) => `<span class=\"nv-miniring\">${ring(c, 16, 3)}
