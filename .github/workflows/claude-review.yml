name: Claude review

# Reviews the latest push to each PR. Runs on the owner's Claude subscription through
# the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`) and needs the Claude
# GitHub App installed on the repository. A newer push cancels the review in flight, so
# only the latest commit gets a summary. Fork and Dependabot PRs are skipped: GitHub
# withholds secrets from them, and pull_request_target would hand the token to untrusted code.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            Review this pull request for correctness bugs, security problems, and
            regressions. The PR branch is checked out in the working directory. Skip
            style nits that Prettier or the type checker would catch.

            Put each specific problem on its line with
            `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`).

            Always finish with one top-level `gh pr comment` that starts with
            "Claude review of <first 7 chars of HEAD>:" followed by either
            "no issues found" or the number of issues, and a sentence on what you read.
            Post that comment even when there is nothing to report.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
