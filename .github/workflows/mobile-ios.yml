name: Mobile iOS boot
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Temporary phone public-map acceptance fixture',
              body: 'Visibility: public\n\n## Destination\nVerify the phone can follow a public map authored by another account.\n\n## Notes\nTemporary #229 acceptance fixture. This issue will be closed after the test.',
              labels: ['wayfinder:map']
            });
            core.notice(`Fixture issue #${result.data.number}: ${result.data.html_url}`);
