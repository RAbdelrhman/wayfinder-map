name: Release

# Keeps one "chore: release x.y.z" PR open that collects everything merged to main,
# with the version bump and changelog worked out from the conventional commits.
# Merging that PR tags the release, then starts the Windows build for the tag.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag pushed with GITHUB_TOKEN never starts another workflow, but a dispatch
      # does. Running it on the tag keeps github.ref a tag, so the signing gate holds.
      - name: Build the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-windows.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.release.outputs.tag_name }}"
