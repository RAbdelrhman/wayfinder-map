name: Release

# Keeps one "chore: release x.y.z" PR open that collects everything merged to main,
# with the version bump and changelog worked out from the conventional commits.
# Merging that PR tags the release, then starts the Windows build for the tag.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Release Please creates the tag and GitHub release before the Windows job runs.
      # Gate it here so missing signing secrets cannot publish another empty release.
      - name: Require Windows signing credentials
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ] || [ -z "$WIN_CSC_KEY_PASSWORD" ]; then
            echo '::error::Set WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD before creating a release.'
            exit 1
          fi

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GITHUB_TOKEN-created PRs do not emit downstream pull_request workflow runs.
      # Dispatch trusted default-branch review code with the PR's current head.
      - name: Review release pull requests
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            const prs = JSON.parse(process.env.RELEASE_PRS || '[]');
            for (const candidate of prs) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: candidate.number,
              });
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'claude-review.yml',
                ref: context.payload.repository.default_branch,
                inputs: { pr_number: String(pr.number), head_sha: pr.head.sha },
              });
            }

      # A tag pushed with GITHUB_TOKEN never starts another workflow, but a dispatch
      # does. Running it on the tag keeps github.ref a tag, so the signing gate holds.
      - name: Build the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-windows.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.release.outputs.tag_name }}"
