name: Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      WAYFINDER_BUILD_ARCH: ${{ matrix.arch }}
      WAYFINDER_STABLE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && '1' || '0' }}
      WAYFINDER_SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && '1' || '0' }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.0

      - name: Require signing credentials for a stable tag
        if: env.WAYFINDER_STABLE_RELEASE == '1'
        shell: pwsh
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw 'Stable releases require WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD.'
          }

      - name: Match the tag to package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match $expected."
          }

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run package:win -- ${{ matrix.arch }}
      # windows-2025 is x64; ARM64 is cross-packaged here and must be installed and
      # exercised on a real Windows ARM64 machine before stable support is claimed.
      - run: bun run smoke:win -- x64
        if: matrix.arch == 'x64'

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $folder = "release/${{ matrix.arch }}"
          $lines = Get-ChildItem $folder -File |
            Where-Object { $_.Name -notlike 'SHA256SUMS-*' -and $_.Name -ne 'builder-debug.yml' } |
            Sort-Object Name |
            ForEach-Object { "{0} *{1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          Set-Content -LiteralPath "$folder/SHA256SUMS-${{ matrix.arch }}.txt" -Value $lines -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: wayfinder-windows-${{ matrix.arch }}
          # Only the release carries: the installer, update metadata, blockmap, and checksum.
          path: |
            release/${{ matrix.arch }}/*.exe
            release/${{ matrix.arch }}/*.blockmap
            release/${{ matrix.arch }}/latest-*.yml
            release/${{ matrix.arch }}/SHA256SUMS-*.txt
          if-no-files-found: error

  cli:
    name: CLI package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.0

      - name: Match the tag to package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      # Includes the packaged-CLI smoke test, here on POSIX where it also checks SIGINT shutdown.
      - run: bun run test

      - name: Pack the CLI
        run: |
          mkdir release-cli
          npm pack --pack-destination release-cli
          cd release-cli && sha256sum *.tgz > SHA256SUMS-cli.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wayfinder-cli
          path: release-cli/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wayfinder-*
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
